<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decision Tree</title>

<style>
  /* FULL PAGE BACKGROUND FIX */
  body {
    margin: 0;
    background: radial-gradient(circle at top, #05070f, #020617 80%);
    font-family: "Segoe UI", sans-serif;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .tree {
    width: 1100px;
    padding: 50px;
    text-align: center;
  }

  /* BASE NODE */
  .node {
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    margin: 0 auto;
    min-width: 180px;
  }

  /* PROMPT (top instruction) */
  .prompt {
    background: rgba(8,12,25,0.95);
    border: 1px solid #3b82f6;
    box-shadow:
      0 0 14px rgba(59,130,246,0.6),
      inset 0 0 10px rgba(59,130,246,0.2);
    font-weight: 500;
  }

  /* ANSWER (choices) */
  .answer {
    background: rgba(5,8,18,0.95);
    border: 1px solid #38bdf8;
    box-shadow: 0 0 8px rgba(56,189,248,0.3);
    transition: all 0.2s ease;
  }

  .answer:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 16px rgba(56,189,248,0.6);
  }

  /* LINKS */
  .node a {
    color: #cbd5f5;
    text-decoration: none;
    display: block;
  }

  .node a:hover {
    color: #7dd3fc;
  }

  /* CONNECTOR LINES */
  .line {
    width: 2px;
    height: 28px;
    background: rgba(59,130,246,0.7);
    margin: 0 auto;
  }

  .horizontal {
    height: 2px;
    width: 90%;
    background: rgba(59,130,246,0.7);
    margin: 0 auto 20px;
  }

  /* ROW OF BRANCHES */
  .row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
  }

  /* EACH BRANCH */
  .branch {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

</style>
</head>

<body>

<div class="tree">

  <!-- TOP PROMPT -->
  <div class="node prompt">
    Review scenario and select research design
  </div>

  <div class="line"></div>
  <div class="horizontal"></div>

  <!-- BRANCHES -->
  <div class="row">

    <!-- OBSERVATIONAL -->
    <div class="branch">
      <div class="node answer">Observational</div>
      <div class="line"></div>
      <div class="node answer">
        <a href="code/chi_gof.html">Chi‑Square Goodness of Fit</a>
      </div>
    </div>

    <!-- CORRELATIONAL -->
    <div class="branch">
      <div class="node answer">Correlational</div>
      <div class="line"></div>

      <div class="node answer">
        <a href="code/chi_independence.html">Chi‑Square Test of Independence</a>
      </div>

      <div class="line"></div>

      <div class="node answer">
        <a href="code/correlations.html">Pearson / Spearman Correlations</a>
      </div>
    </div>

    <!-- QUASI EXPERIMENT -->
    <div class="branch">
      <div class="node answer">Quasi‑experiment</div>
      <div class="line"></div>

      <div class="node answer">
        <a href="code/ttest_ind.html">Independent t‑test</a>
      </div>

      <div class="line"></div>

      <div class="node answer">
        <a href="code/mann_whitney.html">Mann‑Whitney U</a>
      </div>
    </div>

    <!-- TRUE EXPERIMENT -->
    <div class="branch">
      <div class="node answer">True experiment</div>
      <div class="line"></div>

      <div class="node answer">
        <a href="code/ttest_dep.html">Dependent t‑test</a>
      </div>

      <div class="line"></div>

      <div class="node answer">
        <a href="code/wilcoxon.html">Wilcoxon Signed Rank</a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
