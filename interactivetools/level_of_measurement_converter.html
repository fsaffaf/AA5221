<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level of Measurement Converter</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #f4f6f9;
  color: #222222;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

.measurement-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  box-sizing: border-box;
}

.glass {
  width: 100%;
  max-width: 900px;
  padding: 2.5rem;
  box-sizing: border-box;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
}

.glass h2 {
  margin: 0 0 1.5rem;
  text-align: center;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1.2;
  color: #0e68b3;
}

.measurement-note {
  max-width: 700px;
  margin: -0.5rem auto 1.5rem;
  color: #555555;
  font-size: 0.9rem;
  line-height: 1.6;
  text-align: center;
}

.converter-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1.25rem;
  align-items: stretch;
}

.converter-panel {
  min-width: 0;
  padding: 1.5rem;
  box-sizing: border-box;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  background: #ffffff;
}

.converter-panel.output-panel {
  background: #f0f7fc;
  border-color: #b9d8ef;
}

.panel-title {
  margin: 0 0 1rem;
  color: #0e68b3;
  font-size: 1.05rem;
  font-weight: 650;
  line-height: 1.5;
}

.input-group select {
  display: block;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 0.9rem;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  background: #ffffff;
  color: #222222;
  font-family: inherit;
  font-size: 1rem;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s ease,
              box-shadow 0.2s ease;
}

.input-group select:focus {
  border-color: #0e68b3;
  box-shadow: 0 0 0 3px rgba(14, 104, 179, 0.12);
}

.answer-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 150px;
  text-align: center;
}

.answer-label {
  margin-bottom: 0.5rem;
  color: #444444;
  font-size: 0.9rem;
  line-height: 1.5;
}

.answer-number {
  color: #0e68b3;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 650;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.definition-box {
  width: 100%;
  box-sizing: border-box;
  margin-top: 1.25rem;
  padding: 1rem;
  border: 1px solid #b9d8ef;
  border-radius: 10px;
  background: #ffffff;
  text-align: left;
}

.definition-heading {
  margin: 0 0 0.4rem;
  color: #0e68b3;
  font-size: 0.95rem;
  font-weight: 700;
}

.answer-description {
  margin: 0;
  color: #444444;
  font-size: 0.9rem;
  line-height: 1.6;
}

.answer-placeholder {
  color: #7a8794;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
}

.reset-btn {
  display: block;
  width: 100%;
  margin-top: 1.5rem;
  padding: 0.9rem 1rem;
  box-sizing: border-box;
  border: 1px solid #0e68b3;
  border-radius: 999px;
  background: #0e68b3;
  color: #ffffff;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.2s ease,
              border-color 0.2s ease,
              transform 0.2s ease;
}

.reset-btn:hover {
  background: #2b6cb0;
  border-color: #2b6cb0;
  transform: translateY(-1px);
}

.reset-btn:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.answer-area.updated {
  animation: fadeIn 0.25s ease;
}

@media (max-width: 600px) {
  .measurement-wrapper {
    padding: 1rem;
    align-items: flex-start;
  }

  .glass {
    padding: 1.25rem;
  }

  .converter-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
  }

  .converter-panel {
    padding: 1.25rem;
  }

  .answer-area {
    min-height: 120px;
  }
}
</style>
</head>

<body>

<div class="measurement-wrapper">
  <main class="glass">

    <h2>Level of Measurement Converter</h2>

    <p class="measurement-note">
      These classifications are common examples. The correct level of measurement
      depends on how a variable is defined and recorded in your study.
    </p>

    <div class="converter-grid">

      <!-- LEFT: VARIABLE DROPDOWN -->

      <section class="converter-panel">

        <h3 class="panel-title">Select a Variable</h3>

        <div class="input-group">
          <select
            id="variableSelect"
            onchange="updateAnswer()"
            aria-label="Select a variable">

            <option value="">Select a variable...</option>

            <option value="ACT_Score">ACT Score</option>
            <option value="Blood_Type">Blood Type</option>
            <option value="Calendar_Year">Calendar Year</option>
            <option value="Centimeters">Centimeters</option>
            <option value="City">City</option>
            <option value="Class_Rank">Class Rank</option>
            <option value="Country">Country</option>
            <option value="Days">Days</option>
            <option value="Department">Department</option>
            <option value="Education_Level">Education Level</option>
            <option value="Employee_ID">Employee ID</option>
            <option value="Employment_Status">Employment Status</option>
            <option value="Ethnicity">Ethnicity</option>
            <option value="Eye_Color">Eye Color</option>
            <option value="Frequency_Category">Frequency Category</option>
            <option value="Gallons">Gallons</option>
            <option value="Gender">Gender</option>
            <option value="Grams">Grams</option>
            <option value="Hair_Color">Hair Color</option>
            <option value="Hours">Hours</option>
            <option value="Income_Bracket">Income Bracket</option>
            <option value="IQ_Score">IQ Score</option>
            <option value="Inches">Inches</option>
            <option value="Job_Title">Job Title</option>
            <option value="Kilograms">Kilograms</option>
            <option value="Kilometers">Kilometers</option>
            <option value="Letter_Grade">Letter Grade</option>
            <option value="Major">Major</option>
            <option value="Marital_Status">Marital Status</option>
            <option value="Miles">Miles</option>
            <option value="Millimeters">Millimeters</option>
            <option value="Minutes">Minutes</option>
            <option value="Months">Months</option>
            <option value="Multiple_Item_Scale_on_Agreement">Multiple-Item Scale on Agreement</option>
            <option value="Multiple_Item_Scale_on_Satisfaction">Multiple-Item Scale on Satisfaction</option>
            <option value="Multiple_Item_Scale_on_Stress">Multiple-Item Scale on Stress</option>
            <option value="Nationality">Nationality</option>
            <option value="Number_of_">Number of ...</option>
            <option value="Ounces">Ounces</option>
            <option value="Pain_Level">Pain Level</option>
            <option value="Performance_Rating">Performance Rating</option>
            <option value="Pounds">Pounds</option>
            <option value="Political_Party">Political Party</option>
            <option value="Priority_Level">Priority Level</option>
            <option value="Product_Category">Product Category</option>
            <option value="Race">Race</option>
            <option value="Religion">Religion</option>
            <option value="Research_Group">Research Group</option>
            <option value="Risk_Level">Risk Level</option>
            <option value="SAT_Score">SAT Score</option>
            <option value="School">School</option>
            <option value="Seconds">Seconds</option>
            <option value="Single_Question_on_Agreement">Single Question on Agreement</option>
            <option value="Single_Question_on_Satisfaction">Single Question on Satisfaction</option>
            <option value="Single_Question_on_Stress">Single Question on Stress</option>
            <option value="Socioeconomic_Status">Socioeconomic Status</option>
            <option value="Standardized_Test_Score">Standardized Test Score</option>
            <option value="State">State</option>
            <option value="Stress_Level">Stress Level</option>
            <option value="Student_ID">Student ID</option>
            <option value="Temperature_Celsius">Temperature (Celsius)</option>
            <option value="Temperature_Fahrenheit">Temperature (Fahrenheit)</option>
            <option value="TShirt_Size">T-shirt Size</option>
            <option value="University">University</option>
            <option value="USD">USD</option>
            <option value="Weeks">Weeks</option>
            <option value="Yards">Yards</option>
            <option value="Years">Years</option>
            <option value="Yes_or_No">Yes or No</option>

          </select>
        </div>

        <button
          type="button"
          class="reset-btn"
          onclick="resetConverter()">
          Reset
        </button>

      </section>

      <!-- RIGHT: ANSWER -->

      <section
        class="converter-panel output-panel"
        aria-live="polite"
        aria-atomic="true">

        <h3 class="panel-title">Level of Measurement</h3>

        <div class="answer-area" id="answerArea">

          <div
            class="answer-number answer-placeholder"
            id="answerNumber">
            —
          </div>

          <div class="definition-box" id="definitionBox">
            <div class="definition-heading">Definition</div>
            <p class="answer-description" id="answerDescription">
              Select a variable to see why it belongs to its level of measurement.
            </p>
          </div>

        </div>

      </section>

    </div>
  </main>
</div>

<script>
const answerKey = {
  // Ratio
  Seconds: "Ratio",
  Minutes: "Ratio",
  Hours: "Ratio",
  Days: "Ratio",
  Weeks: "Ratio",
  Months: "Ratio",
  Years: "Ratio",
  Inches: "Ratio",
  Yards: "Ratio",
  Miles: "Ratio",
  Ounces: "Ratio",
  Gallons: "Ratio",
  Pounds: "Ratio",
  Millimeters: "Ratio",
  Centimeters: "Ratio",
  Kilograms: "Ratio",
  Kilometers: "Ratio",
  Grams: "Ratio",
  Number_of_: "Ratio",
  USD: "Ratio",

  // Nominal
  Gender: "Nominal",
  Race: "Nominal",
  Ethnicity: "Nominal",
  Nationality: "Nominal",
  Religion: "Nominal",
  Political_Party: "Nominal",
  Marital_Status: "Nominal",
  Employment_Status: "Nominal",
  Department: "Nominal",
  Major: "Nominal",
  Job_Title: "Nominal",
  School: "Nominal",
  University: "Nominal",
  Country: "Nominal",
  State: "Nominal",
  City: "Nominal",
  Eye_Color: "Nominal",
  Hair_Color: "Nominal",
  Blood_Type: "Nominal",
  Yes_or_No: "Nominal",
  Student_ID: "Nominal",
  Employee_ID: "Nominal",
  Product_Category: "Nominal",
  Research_Group: "Nominal",

  // Ordinal
  Single_Question_on_Agreement: "Ordinal",
  Single_Question_on_Stress: "Ordinal",
  Single_Question_on_Satisfaction: "Ordinal",
  Education_Level: "Ordinal",
  Class_Rank: "Ordinal",
  Letter_Grade: "Ordinal",
  Performance_Rating: "Ordinal",
  Pain_Level: "Ordinal",
  Stress_Level: "Ordinal",
  Income_Bracket: "Ordinal",
  Socioeconomic_Status: "Ordinal",
  Frequency_Category: "Ordinal",
  Risk_Level: "Ordinal",
  Priority_Level: "Ordinal",
  TShirt_Size: "Ordinal",

  // Interval
  Multiple_Item_Scale_on_Agreement: "Interval",
  Multiple_Item_Scale_on_Stress: "Interval",
  Multiple_Item_Scale_on_Satisfaction: "Interval",
  Temperature_Celsius: "Interval",
  Temperature_Fahrenheit: "Interval",
  Calendar_Year: "Interval",
  IQ_Score: "Interval",
  Standardized_Test_Score: "Interval",
  SAT_Score: "Interval",
  ACT_Score: "Interval"
};

const definitionKey = {
  Seconds: "Zero means no elapsed time. The difference between each unit is equal.",
  Minutes: "Zero means no elapsed time. The difference between each unit is equal.",
  Hours: "Zero means no elapsed time. The difference between each unit is equal.",
  Days: "Zero means no elapsed time. The difference between each unit is equal.",
  Weeks: "Zero means no elapsed time. The difference between each unit is equal.",
  Months: "Zero means no elapsed time. The difference between each unit is equal.",
  
  Millimeters: "Zero means no length. The difference between each unit is equal.",
  Centimeters: "Zero means no length. The difference between each unit is equal.",
  Inches: "Zero means no length. The difference between each unit is equal.",
  Kilometers: "Zero means no distance. The difference between each unit is equal.",
  Yards: "Zero means no distance. The difference between each unit is equal.",
  Miles: "Zero means no distance. The difference between each unit is equal.",
  
  Pounds:  "Zero means no mass. The difference between each unit is equal.",
  Kilograms: "Zero means no mass. The difference between each unit is equal.",

  Number_of_: "A count (for example, number of courses or number of employees) is ratio because zero means none and counts can be compared with meaningful ratios. Replace the example with the specific thing being counted.",
  
  USD: "An amount of money in U.S. dollars is ratio because $0 means no money and differences and ratios of amounts are meaningful.",
  
  Gender: "Gender (e.g., woman, man, nonbinary) is nominal when responses are recorded as categories. The categories identify groups but do not have a required numerical order.",
  Race: "Race (e.g., Black, White, Asian) is nominal when recorded as categories because the categories are labels, not ranked levels.",
  Country: "Nationality (e.g., USA, India, Zimbabwe) is nominal because country-based nationality categories are labels and have no inherent order.",
  Religion: "Religion (e.g., Christianity, Islam, Hinduism) is nominal when recorded as categories because the responses do not have a natural ranking.",
  Political_Party: "Political party (e.g., Democrat, Republican, Independent) is nominal because party names are categories, not ordered levels.",
  Marital_Status: "Marital status (e.g., single, married, divorced) is nominal when categories such as single, married, or divorced are used; these categories do not form a single meaningful ranking.",
  Employment_Status: "Employment status (e.g., employed, unemployed, retired) is nominal when categories such as employed, unemployed, or retired are used. The categories are labels rather than ranked levels.",
  Department: "Department (e.g., Human Resources, Finance, Marketing) is nominal because department names identify groups and have no inherent order.",
  Major: "Academic major (e.g., Psychology, Computer Science, Biology) is nominal because major names are categories without a natural ranking.",
  Job_Title: "Job title (e.g., analyst, manager, director) is nominal when titles are treated as category labels. If the variable is explicitly coded as ordered job grades or ranks, its measurement level may differ.",
  School: "School (e.g., School of Business, School of Education, School of Public Health) is nominal when it identifies a school by name or category; the names do not have a natural order.",
  University: "University (e.g., Saint Louis University, University of Missouri, Washington University in St. Louis) is nominal when it identifies an institution by name or category, rather than measuring an ordered ranking.",
  City: "City (e.g.,St. Louis, Chicago, New York City) is nominal because city names are categories, not ordered values.",
  Color: "Color (e.g., brown, blue, green) is nominal because colors are categories without a natural ranking.",
  Blood_Type: "Blood type (e.g., A, B, AB, O) is nominal because categories such as A, B, AB, and O identify types but are not ranked.",
  Yes_or_No: "A yes/no response is nominal when it represents two categories. Coding Yes as 1 and No as 0 does not by itself make it a ratio variable.",
  Employee_ID: "Employee ID (e.g., E104, E105, E106) is nominal because it identifies a person. Differences between ID numbers are not meaningful measurements.",
  Product_Category: "Product category (e.g., electronics, clothing, furniture) is nominal because category labels identify types of products without ranking them.",
  Research_Group: "Research group (e.g., control group, treatment group, comparison group) is nominal when it labels the group a participant belongs to. The group labels themselves are not ranked.",
  Single_Question_on_Agreement: A single agreement item (for example, strongly disagree to strongly agree) is ordinal because responses have an order, but the distance between adjacent response options cannot be assumed equal.",
  Single_Question_on_Stress: " A single stress-rating item (for example, very high stress to very low stress) with ordered response choices is ordinal because responses can be ranked from lower to higher stress, but the gaps between choices are not known to be equal.",
  Single_Question_on_Satisfaction: "Examples: very dissatisfied, neutral, very satisfied. A single satisfaction item with ordered response choices is ordinal because responses have a meaningful order, but the spacing between response options is not guaranteed to be equal.",
  Education_Level: "Examples: high school, bachelor's degree, master's degree, doctorate. Education level is ordinal when categories progress from lower to higher attainment (for example, high school, bachelor's, master's, doctorate). The gaps between categories are not equal units.",
  Class_Rank: "Examples: first, second, third. Class rank is ordinal because it indicates order (first, second, third, and so on). The ranking does not tell you that the differences in performance between ranks are equal.",
  Letter_Grade: "Examples: A, B, C, D, F. Letter grades are ordinal because A is generally higher than B, and B higher than C, but the difference between adjacent grades is not necessarily equal.",
  Performance_Rating: "Examples: needs improvement, meets expectations, exceeds expectations. A performance rating is ordinal when categories such as needs improvement, meets expectations, and exceeds expectations are ordered but the gaps between them are not known to be equal.",
  Pain_Level: "Examples: no pain, mild pain, moderate pain, severe pain. A pain rating using ordered categories is ordinal because one response indicates more pain than another, but the difference between levels is not necessarily equal.",
  Stress_Level: "Examples: low, moderate, high. Stress level is ordinal when recorded as ordered categories (for example, low, moderate, high) because the categories have an order but not equal, measured intervals.",
  Income_Bracket: "Examples: under $25,000, $25,000–$49,999, $50,000 or more. Income brackets are ordinal because the categories are ordered from lower to higher income, but each category represents a range rather than an exact income amount.",
  Socioeconomic_Status: "Examples: low, middle, high. Socioeconomic status is ordinal when recorded in ranked categories such as low, middle, and high. The categories have an order, but the distances between them are not equal units.",
  Frequency_Category: "Examples: never, rarely, sometimes, often, always. Frequency categories such as never, rarely, sometimes, often, and always are ordinal because they are ordered, but the differences between adjacent categories are not necessarily equal.",
  Risk_Level: "Examples: low, moderate, high. Risk level is ordinal when categories such as low, moderate, and high have a clear order but do not represent equal numerical intervals.",
  Priority_Level: "Examples: low, medium, high. Priority level is ordinal when categories such as low, medium, and high are ranked. The order is meaningful, but the gaps between levels are not necessarily equal.",
  TShirt_Size: "Examples: XS, S, M, L, XL. T-shirt size is ordinal because sizes such as XS, S, M, L, and XL have a natural order, but the differences between sizes are not equal numerical units.",
  Multiple_Item_Scale_on_Agreement: "Examples: a total agreement score of 12, 18, or 24 across several survey items. A summed or averaged score from multiple agreement items is often treated as approximately interval when the items form a coherent scale. This assumes the combined score behaves like equal steps; it is not automatically interval just because multiple items are used.",
  Multiple_Item_Scale_on_Stress: "Examples: a total stress score of 8, 16, or 24 across several survey items. A summed or averaged score from multiple stress items is often treated as approximately interval when the items form a reliable, coherent scale. The classification depends on how the scale is constructed and validated.",
  Multiple_Item_Scale_on_Satisfaction: "Examples: an average satisfaction score of 2.4, 3.6, or 4.8 across several survey items. A summed or averaged score from multiple satisfaction items is often treated as approximately interval when the items form a coherent scale. This is an analytical convention, not a guarantee that every score increment is exactly equal.",
  Temperature_Celsius: "Examples: 0°C, 10°C, 20°C. Temperature in Celsius is interval because equal differences represent equal temperature changes, but 0°C does not mean there is no temperature. Therefore, ratios such as 20°C being twice as hot as 10°C are not meaningful.",
  Temperature_Fahrenheit: "Examples: 32°F, 50°F, 68°F. Temperature in Fahrenheit is interval because equal differences represent equal temperature changes, but 0°F is not an absence of temperature. Ratios are not meaningful.",
  Calendar_Year: "Examples: 2024, 2025, 2026. Calendar year is interval because differences between years are meaningful and equally spaced, but year zero is not a true absence of time, so ratios of calendar years are not meaningful.",
  IQ_Score: "Examples: IQ scores of 85, 100, 120. IQ scores are generally treated as interval because score differences are interpreted as comparable across the scale. A score of 120 is not meaningfully twice the intelligence of a score of 60.",
  Standardized_Test_Score: "Examples: scores of 40, 60, 80 on a standardized scale. A standardized test score is often treated as interval when score differences are designed to be comparable across the scale. A score of 80 is not necessarily twice the ability represented by a score of 40.",
  SAT_Score: "Examples: SAT scores of 1000, 1200, 1400. SAT scores are commonly treated as approximately interval for many analyses because score differences are designed to have interpretable meaning across the scale. A score twice as large does not mean twice the ability.",
  ACT_Score: "Examples: ACT scores of 18, 24, 30. ACT scores are commonly treated as approximately interval for many analyses because score differences are intended to be interpretable across the scale. A score twice as large does not mean twice the ability."
};

function updateAnswer() {
  const selectedVariable = document.getElementById("variableSelect").value;
  const answerNumber = document.getElementById("answerNumber");
  const answerDescription = document.getElementById("answerDescription");
  const answerArea = document.getElementById("answerArea");

  // Restart the animation whenever the selection changes.
  answerArea.classList.remove("updated");

  if (!selectedVariable) {
    answerNumber.textContent = "—";
    answerNumber.classList.add("answer-placeholder");
    answerDescription.textContent =
      "Select a variable to see examples and why it belongs to its level of measurement.";
    return;
  }

  const level = answerKey[selectedVariable];
  const definition = definitionKey[selectedVariable];

  if (!level) {
    answerNumber.textContent = "Not found";
    answerNumber.classList.add("answer-placeholder");
    answerDescription.textContent =
      "The measurement level is not available for this selection. Please check the answer key.";
    return;
  }

  answerNumber.textContent = level;
  answerNumber.classList.remove("answer-placeholder");

  answerDescription.textContent = definition ||
    "A definition has not yet been added for this variable.";

  // Force a reflow so the fade-in animation can run again.
  void answerArea.offsetWidth;
  answerArea.classList.add("updated");
}
function resetConverter() {
  document.getElementById("variableSelect").selectedIndex = 0;
  updateAnswer();
}
</script>

</body>
</html>
