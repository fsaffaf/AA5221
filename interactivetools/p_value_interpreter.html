<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>p-Value Decision Tool</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #f4f6f9;
  color: #222222;
  box-sizing: border-box;
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before,
body::after {
  content: none;
}

/* =========================================
   MAIN LAYOUT
   ========================================= */

.wrapper {
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
  padding: 2rem;
}

.card {
  width: 100%;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
  overflow: hidden;
}

.content {
  padding: 2.5rem;
}

/* =========================================
   HEADER
   ========================================= */

.header {
  text-align: center;
  margin-bottom: 2rem;
}

.pill {
  display: inline-block;
  padding: 0.45rem 1rem;
  border-radius: 999px;
  background: #f0f7fc;
  border: 1px solid #d9eaf7;
  color: #0e68b3;
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
}

.header h1 {
  margin: 0 0 0.75rem;
  font-size: clamp(2rem, 5vw, 3.25rem);
  font-weight: 500;
  letter-spacing: -0.03em;
  color: #0e68b3;
  line-height: 1.2;
}

.header p {
  color: #444444;
  max-width: 620px;
  margin: 0 auto;
  line-height: 1.8;
  font-size: 1.05rem;
}

/* =========================================
   CHOICE BUTTONS
   ========================================= */

.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 2rem;
}

.choice {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 1.5rem;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  background: #ffffff;
  color: #222222;
  text-align: left;
  cursor: pointer;
  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.choice.nonsig {
  background: #ffffff;
  border-color: #d9e2ec;
}

.choice.sig {
  background: #f3f9fe;
  border-color: #b9d8ef;
}

.choice:hover {
  background: #f0f7fc;
  border-color: #0e68b3;
  transform: translateY(-1px);
}

.choice.active {
  background: #f0f7fc;
  border-color: #0e68b3;
  box-shadow: 0 0 0 2px rgba(14, 104, 179, 0.12);
}

.choice:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

.choice-title {
  display: block;
  font-size: 1.15rem;
  font-weight: 650;
  color: #0e68b3;
  line-height: 1.5;
}

.choice-sub {
  display: block;
  font-size: 0.9rem;
  color: #555555;
  margin-top: 0.4rem;
  line-height: 1.6;
}

/* =========================================
   RESULTS
   ========================================= */

.result {
  display: none;
  margin-top: 1.5rem;
  padding: 1.75rem;
  border-radius: 12px;
  background: #f0f7fc;
  border: 1px solid #b9d8ef;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
  animation: fadeIn 0.3s ease;
}

.result.sig {
  background: #f0f7fc;
  border-color: #b9d8ef;
}

.result.nonsig {
  background: #f4f6f9;
  border-color: #d9e2ec;
}

.result h2 {
  margin: 0 0 0.75rem;
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 650;
  color: #0e68b3;
  line-height: 1.3;
}

.result p {
  color: #444444;
  margin: 0 0 1.2rem;
  line-height: 1.8;
}

/* =========================================
   RESULT ITEMS
   ========================================= */

.list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.item {
  padding: 1rem;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  color: #333333;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

/* =========================================
   ANIMATION
   ========================================= */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================
   TABLET AND MOBILE
   ========================================= */

@media (max-width: 700px) {
  .wrapper {
    padding: 1rem;
  }

  .content {
    padding: 1.5rem;
  }

  .choice-grid {
    grid-template-columns: 1fr;
  }

  .result {
    padding: 1.25rem;
  }
}

@media (max-width: 420px) {
  .wrapper {
    padding: 0.75rem;
  }

  .content {
    padding: 1.25rem;
  }

  .choice {
    padding: 1.15rem;
  }

  .result {
    padding: 1rem;
  }

  .header p {
    font-size: 0.95rem;
  }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="card">
    <div class="content">

      <div class="header">
        <h1>P-Value Interpreter</h1>
        <p>
          What is your obtained p-value?
        </p>
      </div>

      <div class="choice-grid">

        <div
          class="choice nonsig"
          onclick="showResult('nonsig')"
          id="btnNonsig"
        >
          <div class="choice-title">p ≥ .05</div>
          <div class="choice-sub">
            GREATER THAN or equal to .05
          </div>
        </div>

        <div
          class="choice sig"
          onclick="showResult('sig')"
          id="btnSig"
        >
          <div class="choice-title">p &lt; .05</div>
          <div class="choice-sub">
            LESS THAN .05
          </div>
        </div>

      </div>

      <div id="result" class="result">

        <h2 id="resultTitle"></h2>

        <p id="resultSubtitle"></p>

        <div class="list" id="resultList"></div>

      </div>

    </div>
  </div>
</div>

<script>

function showResult(type) {

  const result = document.getElementById("result");
  const list = document.getElementById("resultList");

  const btnNonsig = document.getElementById("btnNonsig");
  const btnSig = document.getElementById("btnSig");

  /* Remove active state from both buttons */
  btnNonsig.classList.remove("active");
  btnSig.classList.remove("active");

  /* Clear previous results */
  list.innerHTML = "";

  /* Non-significant result */
  if (type === "nonsig") {

    btnNonsig.classList.add("active");

    result.className = "result nonsig";

    document.getElementById("resultTitle").textContent =
      "Results";

    document.getElementById("resultSubtitle").textContent =
      "Your p-value is greater than or equal to .05.";

    [
      "The null hypothesis is supported.",
      "The results are NOT statistically significant.",
      "Do not calculate the effect size."
    ].forEach(function(text) {

      const div = document.createElement("div");

      div.className = "item";

      div.textContent = text;

      list.appendChild(div);

    });
  }

  /* Significant result */
  if (type === "sig") {

    btnSig.classList.add("active");

    result.className = "result sig";

    document.getElementById("resultTitle").textContent =
      "Results";

    document.getElementById("resultSubtitle").textContent =
      "Your p-value is less than .05.";

    [
      "The alternative hypothesis is supported.",
      "The results ARE statistically significant.",
      "Proceed with calculating the effect size."
    ].forEach(function(text) {

      const div = document.createElement("div");

      div.className = "item";

      div.textContent = text;

      list.appendChild(div);

    });
  }

  /* Show result */
  result.style.display = "block";
}

</script>

</body>
</html>
