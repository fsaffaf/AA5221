<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analysis Pipeline</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 40px;

  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color: rgba(255,255,255,0.92);

  background: radial-gradient(circle at 50% 0%, #0a1022 0%, #020617 70%);
}

/* ✅ GLASS LECTURE TITLE */
.title-box {
  max-width: 900px;
  width: 90%;
  padding: 2rem;
  margin-bottom: 25px;

  background: rgba(15,23,42,.65);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;

  backdrop-filter: blur(18px);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);

  text-align: center;
}

/* MAIN TITLE */
.title-box h1 {
  margin: 0;
  font-size: 2rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;

  background: linear-gradient(180deg, #ffffff, #7dd3fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow: 0 0 20px rgba(56,189,248,.3);
}

/* SUBTITLE */
.title-box .subtitle {
  margin-top: 10px;
  font-size: 0.9rem;
  letter-spacing: 0.25em;
  opacity: 0.85;
}


/* ================= FLOW ================= */

.flow-wrapper {
  position: relative;
  width: 1000px;
  height: 260px;
}

/* CURVE */
svg {
  position: absolute;
  top: 0;
  left: 0;
}

path {
  fill: none;
  stroke: #38bdf8;
  stroke-width: 4;
  filter: drop-shadow(0 0 6px rgba(56,189,248,0.6));
}

/* DOTS */
.dot {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow: 0 0 8px rgba(56,189,248,0.8);
}

/* STEP BOX */
.step {
  position: absolute;
  width: 170px;
  height: 95px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;

  background: rgba(10,15,30,0.75);
  border: 1px solid rgba(56,189,248,0.5);
  border-radius: 12px;

  backdrop-filter: blur(10px);

  box-shadow:
    0 6px 15px rgba(0,0,0,0.6),
    0 0 8px rgba(56,189,248,0.2);

  transform: translate(-50%, -50%);
}

/* TEXT */
.step a {
  color: #e2e8f0;
  text-decoration: none;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  height: 100%;
  width: 100%;
}

.step-number {
  font-size: 11px;
  letter-spacing: 0.1em;
  opacity: 0.7;
  margin-bottom: 4px;
}

.step-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
}

/* FINAL */
.final {
  border-color: #7dd3fc;
}

</style>
</head>

<body>

<!-- ✅ LECTURE-STYLE TITLE -->
<div class="title-box">
  <h1>Research Methods & Statistics I</h1>
  <div class="subtitle">ANALYSIS PIPELINE OVERVIEW</div>
</div>

<!-- ✅ FLOW -->
<div class="flow-wrapper">

  <svg width="1000" height="260">
    <path d="M 40 160 Q 250 20, 500 160 T 960 140" />
  </svg>

  <!-- dots -->
  <div class="dot" style="left:40px; top:160px;"></div>
  <div class="dot" style="left:300px; top:60px;"></div>
  <div class="dot" style="left:600px; top:160px;"></div>
  <div class="dot" style="left:960px; top:140px;"></div>

  <!-- steps -->

  <div class="step" style="left:40px; top:160px;">
    #
      <div class="step-number">STEP 1</div>
      <div class="step-title">Select Research Design</div>
    </a>
  </div>

  <div class="step" style="left:300px; top:60px;">
    #
      <div class="step-number">STEP 2</div>
      <div class="step-title">Select Inferential Test</div>
    </a>
  </div>

  <div class="step" style="left:600px; top:160px;">
    #
      <div class="step-number">STEP 3</div>
      <div class="step-title">Run Code in R</div>
    </a>
  </div>

  <div class="step final" style="left:960px; top:140px;">
    #
      <div class="step-number">STEP 4</div>
      <div class="step-title">Report Results (R Markdown)</div>
    </a>
  </div>

</div>

</body>
</html>
