<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decision Tree</title>
<style>
  body {
    background: linear-gradient(135deg, #0a192f, #112e4a);
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .tree {
    text-align: center;
  }

  .node {
    display: inline-block;
    padding: 12px 20px;
    margin: 10px auto;
    border-radius: 12px;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(0, 150, 255, 0.6);
    box-shadow: 0 4px 12px rgba(0, 150, 255, 0.15);
  }

  .branch {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .line {
    width: 2px;
    height: 30px;
    background: rgba(0, 150, 255, 0.6);
    margin: 0 auto;
  }

  .horizontal {
    height: 2px;
    width: 80%;
    background: rgba(0, 150, 255, 0.6);
    margin: 0 auto 10px auto;
  }

  .options {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 10px;
  }

  .option {
    flex: 1;
  }
</style>
</head>
<body>

<div class="tree">

  <!-- Top Node -->
  <div class="node">Review the scenario</div>

  <div class="line"></div>

  <!-- Second Node -->
  <div class="node">Determine the research design</div>

  <div class="line"></div>
  <div class="horizontal"></div>

  <!-- Options -->
  <div class="options">
    <div class="option">
      <div class="node">1) Observational</div>
    </div>
    <div class="option">
      <div class="node">2) Correlational</div>
    </div>
    <div class="option">
      <div class="node">3) Quasi-experimental</div>
    </div>
    <div class="option">
      <div class="node">4) True Experiment</div>
    </div>
  </div>

</div>

</body>
</html>
