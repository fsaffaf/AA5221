<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Curved Flow</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at 50% 0%, #0a1022 0%, #020617 70%);
  font-family: "Segoe UI", sans-serif;
  color: #e2e8f0;
}

/* WRAPPER */
.flow-wrapper {
  position: relative;
  width: 1000px;
  height: 250px;
}

/* SVG CURVE */
svg {
  position: absolute;
  top: 0;
  left: 0;
}

path {
  fill: none;
  stroke: #38bdf8;
  stroke-width: 4;
  filter: drop-shadow(0 0 8px rgba(56,189,248,0.7));
}

/* STEP */
.step {
  position: absolute;
  width: 160px;
  height: 90px;

  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  background: rgba(10,15,30,0.75);
  border: 1px solid rgba(56,189,248,0.6);
  border-radius: 12px;

  backdrop-filter: blur(12px);

  box-shadow:
    0 8px 20px rgba(0,0,0,0.6),
    0 0 10px rgba(56,189,248,0.25);

  transition: 0.2s;
}

.step:hover {
  transform: translateY(-6px);
  box-shadow:
    0 15px 30px rgba(0,0,0,0.8),
    0 0 20px rgba(56,189,248,0.7);
}

/* LINK */
.step a {
  color: #e2e8f0;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.3;
}

/* STEP POSITIONS ALONG CURVE */
.step1 { top: 110px; left: 20px; }
.step2 { top: 40px; left: 300px; }
.step3 { top: 120px; left: 580px; }
.step4 { top: 50px; left: 840px; }

/* FINAL HIGHLIGHT */
.final {
  border-color: #7dd3fc;
  box-shadow:
    0 0 20px rgba(125,211,252,0.7),
    inset 0 0 10px rgba(125,211,252,0.25);
}

</style>
</head>

<body>

<div class="flow-wrapper">

  <!-- CURVED LINE -->
  <svg width="1000" height="250">
    <path d="M 20 150 Q 250 20, 500 150 T 980 150" />
  </svg>

  <!-- STEPS -->
  <div class="step step1">
    #
      Select Research Design
    </a>
  </div>

  <div class="step step2">
    #
      Select Inferential Test
    </a>
  </div>

  <div class="step step3">
    #
      Run Code in R
    </a>
  </div>

  <div class="step step4 final">
    #
      Report Results (R Markdown)
    </a>
  </div>

</div>

</body>
</html>
