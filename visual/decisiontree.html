<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decision Tree</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #05070f, #020617 80%);
    font-family: "Segoe UI", sans-serif;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    padding: 50px;
  }

  .tree {
    width: 950px;
    text-align: center;
  }

  /* BASE NODE */
  .node {
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  /* PROMPT (decision steps) */
  .prompt {
    background: rgba(10, 15, 30, 0.85);
    border: 1px solid rgba(59,130,246,0.6);
    box-shadow:
      0 0 10px rgba(59,130,246,0.35),
      inset 0 0 10px rgba(59,130,246,0.15);
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  /* ANSWER (choices/results) */
  .answer {
    background: rgba(8, 12, 22, 0.9);
    border: 1px solid rgba(56,189,248,0.4);
    box-shadow:
      0 0 6px rgba(56,189,248,0.15);
  }

  .answer:hover {
    transform: translateY(-2px);
    box-shadow:
      0 0 12px rgba(56,189,248,0.4);
  }

  .node a {
    text-decoration: none;
    color: #cbd5f5;
    display: block;
  }

  .node a:hover {
    color: #7dd3fc;
  }

  /* CONNECTOR LINES */
  .line {
    width: 2px;
    height: 32px;
    background: rgba(59,130,246,0.5);
    margin: 0 auto;
  }

  .horizontal {
    height: 2px;
    width: 100%;
    background: rgba(59,130,246,0.5);
    margin: 0 auto 15px auto;
  }

  /* GRID ROWS */
  .row {
    display: grid;
    gap: 18px;
    margin-top: 15px;
  }
