<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Research Methods & Statistics Overview</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 40px;

  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color: rgba(255,255,255,0.92);

  background: radial-gradient(circle at 50% 0%, #0a1022 0%, #020617 70%);
}

/* ✅ GLASS TITLE */
.title-box {
  max-width: 950px;
  width: 90%;
  padding: 2rem;
  margin-bottom: 25px;

  background: rgba(15,23,42,.65);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;

  backdrop-filter: blur(18px);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);

  text-align: center;
}

.title-box h1 {
  margin: 0;
  font-size: 2.4rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;

  background: linear-gradient(180deg, #ffffff, #7dd3fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow: 0 0 22px rgba(56,189,248,.35);
}


/* ================= FLOW ================= */

.flow-wrapper {
  position: relative;
  width: 1000px;
  height: 260px;
}

svg {
  position: absolute;
  top: 0;
  left: 0;
}

path {
  fill: none;
  stroke: #38bdf8;
  stroke-width: 4;
  filter: drop-shadow(0 0 6px rgba(56,189,248,0.6));
}

/* DOTS */
.dot {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow: 0 0 10px rgba(56,189,248,0.9);
}

/* STEP BOX */
.step {
  position: absolute;
  width: 200px;
  height: 110px;
  transform: translate(-50%, -50%);
}

/* CLICKABLE BOX */
.step a {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  width: 100%;
  height: 100%;

  text-align: center;
  text-decoration: none;
  color: #e2e8f0;

  background: rgba(10,15,30,0.8);
  border: 1px solid rgba(56,189,248,0.5);
  border-radius: 14px;

  backdrop-filter: blur(12px);

  box-shadow:
    0 8px 20px rgba(0,0,0,0.6),
    0 0 10px rgba(56,189,248,0.25);

  transition: 0.25s;
}

.step a:hover {
  transform: translateY(-6px);
  box-shadow:
    0 15px 30px rgba(0,0,0,0.8),
    0 0 20px rgba(56,189,248,0.7);
}

/* TEXT */
.step-number {
  font-size: 13px;
  letter-spacing: 0.12em;
  opacity: 0.75;
  margin-bottom: 6px;
}

.step-title {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.4;
}

/* INSTRUCTION TEXT */
.step-instruction {
  margin-top: 6px;
  font-size: 12px;
  opacity: 0.7;
}

/* FINAL */
.final a {
  border-color: #7dd3fc;
}

</style>
</head>

<body>

<!-- ✅ TITLE -->
<div class="title-box">
  <h1>RESEARCH METHODS & STATISTICS OVERVIEW</h1>
</div>

<!-- ✅ FLOW -->
<div class="flow-wrapper">

  <svg width="1000" height="260">
    <path d="M 40 160 Q 250 20, 500 160 T 960 140" />
  </svg>

  <!-- dots -->
  <div class="dot" style="left:40px; top:160px;"></div>
  <div class="dot" style="left:300px; top:60px;"></div>
  <div class="dot" style="left:600px; top:160px;"></div>
  <div class="dot" style="left:960px; top:140px;"></div>

  <!-- steps -->

  <div class="step" style="left:40px; top:160px;">
    <a href="#">
      <div class="step-number">STEP 1</div>
      <div class="step-title">Select Research Design</div>
      <div class="step-instruction">Click for more info</div>
    </a>
  </div>

  <div class="step" style="left:300px; top:60px;">
    <a href="#">
      <div class="step-number">STEP 2</div>
      <div class="step-title">Select Inferential Test</div>
      <div class="step-instruction">Click for more info</div>
    </a>
  </div>

  <div class="step" style="left:600px; top:160px;">
    <a href="#">
      <div class="step-number">STEP 3</div>
      <div class="step-title">Run Analysis in R</div>
      <div class="step-instruction">Click for more info</div>
    </a>
  </div>

  <div class="step final" style="left:960px; top:140px;">
    <a href="#">
      <div class="step-number">STEP 4</div>
      <div class="step-title">Report Results (R Markdown)</div>
      <div class="step-instruction">Click for more info</div>
    </a>
  </div>

</div>

</body>
</html>
``
