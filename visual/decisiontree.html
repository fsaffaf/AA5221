<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decision Tree</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #05070f, #020617 80%);
  font-family: "Segoe UI", sans-serif;
  color: #e2e8f0;
  display: flex;
  justify-content: center;
  padding: 50px;
}

.tree {
  width: 1100px;
  text-align: center;
}

/* BOXES */
.node {
  padding: 12px 16px;
  border-radius: 14px;
  min-width: 170px;
  margin: 0 auto;
  text-align: center;
}

/* PROMPT */
.prompt {
  background: rgba(10,15,30,0.95);
  border: 1px solid #3b82f6;
  box-shadow: 0 0 10px rgba(59,130,246,0.6);
  font-weight: 500;
}

/* ANSWERS */
.answer {
  background: rgba(6,10,20,0.95);
  border: 1px solid #38bdf8;
  box-shadow: 0 0 6px rgba(56,189,248,0.35);
  transition: 0.2s;
}

.answer:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 12px rgba(56,189,248,0.6);
}

/* LINKS */
.node a {
  display: block;
  text-decoration: none;
  color: #e2e8f0;
}

.node a:hover {
  color: #7dd3fc;
}

/* LINES */
.line {
  width: 2px;
  height: 26px;
  background: rgba(59,130,246,0.7);
  margin: 0 auto;
}

.horizontal {
  height: 2px;
  background: rgba(59,130,246,0.7);
  margin: 0 auto 20px;
  width: 90%;
}

/* ROWS */
.row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

/* BRANCH */
.branch {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* SMALL ROW (correlations split) */
.small-row {
  display: flex;
  gap: 12px;
  margin-top: 5px;
}

/* MERGE SECTION */
.merge-container {
  position: relative;
  width: 500px;
  margin: 40px auto 0;
}

/* ANGLED LINES */
.merge-line-left,
.merge-line-right {
  position: absolute;
  width: 2px;
  height: 60px;
  background: rgba(59,130,246,0.7);
  top: -60px;
}

.merge-line-left {
  left: 25%;
  transform: rotate(40deg);
  transform-origin: bottom center;
}

.merge-line-right {
  right: 25%;
  transform: rotate(-40deg);
  transform-origin: bottom center;
}

</style>
</head>

<body>

<div class="tree">

  <!-- TOP -->
  <div class="node prompt">
    Review scenario and select research design
  </div>

  <div class="line"></div>
  <div class="horizontal"></div>

  <!-- FIRST ROW -->
  <div class="row">

    <!-- OBSERVATIONAL -->
    <div class="branch">
      <div class="node answer">Observational</div>
      <div class="line"></div>
      <div class="node prompt">Select inferential test</div>
      <div class="line"></div>
      <div class="node answer">
        <a href="code/chi_gof.html">Chi‑Square Goodness of Fit</a>
      </div>
    </div>

    <!-- CORRELATIONAL -->
    <div class="branch">
      <div class="node answer">Correlational</div>
      <div class="line"></div>
      <div class="node prompt">Select inferential test</div>
      <div class="line"></div>

      <div class="small-row">
        <div class="node answer">
          <a href="code/chi_independence.html">Chi‑Square Independence</a>
        </div>

        <div class="node answer">
          <a href="code/correlations.html">Pearson / Spearman</a>
        </div>
      </div>
    </div>

    <!-- SPACERS -->
    <div class="branch"></div>
    <div class="branch"></div>

  </div>

  <!-- EXPERIMENT ROW -->
  <div class="row" style="margin-top:50px; width:600px; margin-left:auto; margin-right:auto;">

    <div class="branch">
      <div class="node answer">Quasi‑experiment</div>
    </div>

    <div class="branch">
      <div class="node answer">True experiment</div>
    </div>

  </div>

  <!-- MERGE -->
  <div class="merge-container">

    <!-- angled lines -->
    <div class="merge-line-left"></div>
    <div class="merge-line-right"></div>

    <div class="node prompt">Select inferential test</div>

    <div class="line"></div>

    <div class="node answer">
      <a href="code/ttest_ind.html">t‑tests</a>
    </div>

  </div>

</div>

</body>
</html>
