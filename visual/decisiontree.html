<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decision Tree</title>

<style>
  body {
    margin: 0;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    font-family: "Segoe UI", sans-serif;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    padding: 50px;
  }

  .tree {
    width: 900px;
    text-align: center;
  }

  /* Glass node */
  .node {
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(96, 165, 250, 0.5);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    font-size: 14px;
  }

  /* Vertical line */
  .line {
    width: 2px;
    height: 30px;
    background: rgba(96, 165, 250, 0.6);
    margin: 0 auto;
  }

  /* Horizontal connector */
  .horizontal {
    height: 2px;
    width: 100%;
    background: rgba(96, 165, 250, 0.6);
    margin: 0 auto 15px auto;
  }

  /* Row container */
  .row {
    display: grid;
    gap: 20px;
    margin-top: 15px;
  }

  /* 4 equal columns */
  .row.four {
    grid-template-columns: repeat(4, 1fr);
  }

  /* Center single nodes */
  .center {
    display: flex;
    justify-content: center;
  }

</style>
</head>
<body>

<div class="tree">

  <!-- Top -->
  <div class="center">
    <div class="node">Review the scenario</div>
  </div>

  <div class="line"></div>

  <!-- Second -->
  <div class="center">
    <div class="node">Determine the research design</div>
  </div>

  <div class="line"></div>
  <div class="horizontal"></div>

  <!-- Options -->
  <div class="row four">
    <div class="node">1) Observational</div>
    <div class="node">2) Correlational</div>
    <div class="node">3) Quasi-experimental</div>
    <div class="node">4) True experiment</div>
  </div>

</div>

</body>
</html>
