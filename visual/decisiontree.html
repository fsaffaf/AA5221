<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analysis Flow</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Segoe UI", sans-serif;
  color: #e2e8f0;

  background:
    radial-gradient(circle at 50% 0%, #0a1022 0%, #020617 70%);
}

/* WRAPPER */
.flow-wrapper {
  position: relative;
  width: 1000px;
}

/* MAIN LINE */
.flow-line {
  position: absolute;
  top: 70px;
  width: 100%;
  height: 4px;
  background: linear-gradient(
    to right,
    rgba(56,189,248,0.3),
    rgba(56,189,248,0.9),
    rgba(56,189,248,0.3)
  );

  box-shadow:
    0 0 15px rgba(56,189,248,0.7);

  z-index: 0;
}

/* STEP ROW */
.flow {
  display: flex;
  justify-content: space-between;
  position: relative;
  z-index: 2;
}

/* EACH STEP */
.step {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 220px;
}

/* CONNECTOR */
.connector {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow:
    0 0 10px rgba(56,189,248,0.8),
    0 0 20px rgba(56,189,248,0.5);
  margin-bottom: 10px;
}

/* ✅ EQUAL-SIZED BOX */
.box {
  width: 220px;
  height: 120px;   /* forces equal height */
  padding: 16px;
  border-radius: 16px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background: rgba(10,15,30,0.7);
  border: 1px solid rgba(56,189,248,0.6);
  backdrop-filter: blur(14px);

  box-shadow:
    0 10px 25px rgba(0,0,0,0.6),
    0 0 12px rgba(56,189,248,0.25),
    inset 0 0 10px rgba(56,189,248,0.12);

  transition: 0.25s;
}

/* HOVER */
.box:hover {
  transform: translateY(-6px);
  box-shadow:
    0 15px 35px rgba(0,0,0,0.8),
    0 0 25px rgba(56,189,248,0.7);
}

/* LINKS */
.box a {
  color: #e2e8f0;
  text-decoration: none;
}

/* TEXT */
.title {
  font-size: 12px;
  letter-spacing: 0.08em;
  opacity: 0.7;
  margin-bottom: 6px;
}

.main {
  font-weight: 600;
  font-size: 15px;
  text-align: center;
}

/* FINAL */
.final .box {
  border-color: #7dd3fc;
  box-shadow:
    0 0 18px rgba(125,211,252,0.7),
    inset 0 0 10px rgba(125,211,252,0.2);
}

</style>
</head>

<body>

<div class="flow-wrapper">

  <div class="flow-line"></div>

  <div class="flow">

    <!-- STEP 1 -->
    <div class="step">
      <div class="connector"></div>
      <div class="box">
        <a href="#">
          <div class="title">STEP 1</div>
          <div class="main">Select Research Design</div>
        </a>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="step">
      <div class="connector"></div>
      <div class="box">
        <a href="#">
          <div class="title">STEP 2</div>
          <div class="main">Select Inferential Test</div>
        </a>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step">
      <div class="connector"></div>
      <div class="box">
        <a href="#">
          <div class="title">STEP 3</div>
          <div class="main">Run Code in R</div>
        </a>
      </div>
    </div>

    <!-- STEP 4 -->
    <div class="step final">
      <div class="connector"></div>
      <div class="box">
        <a href="#">
          <div class="title">STEP 4</div>
          <div class="main">Report Results (R Markdown)</div>
        </a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
