<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decision Tree</title>

<style>
  body {
    margin: 0;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    font-family: "Segoe UI", sans-serif;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    padding: 50px;
  }

  .tree {
    width: 900px;
    text-align: center;
  }

  .node {
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(96, 165, 250, 0.5);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    font-size: 14px;
  }

  .line {
    width: 2px;
    height: 30px;
    background: rgba(96, 165, 250, 0.6);
    margin: 0 auto;
  }

  .horizontal {
    height: 2px;
    width: 100%;
    background: rgba(96, 165, 250, 0.6);
    margin: 0 auto 15px auto;
  }

  .row {
    display: grid;
    gap: 20px;
    margin-top: 15px;
  }

  .row.four {
    grid-template-columns: repeat(4, 1fr);
  }

  .center {
    display: flex;
    justify-content: center;
  }
</style>
</head>

<body>

<div class="tree">

  <!-- Combined Top Node -->
  <div class="center">
    <div class="node">
      Review the scenario<br><br>
      Determine the research design
    </div>
  </div>

  <div class="line"></div>
  <div class="horizontal"></div>

  <!-- Research Design Options -->
  <div class="row four">
    <div class="node">Observational</div>
    <div class="node">Correlational</div>
    <div class="node">Quasi-experimental</div>
    <div class="node">True experiment</div>
  </div>

  <div class="line"></div>

  <!-- Inferential Test Hub -->
  <div class="center">
    <div class="node">Select the correct inferential test</div>
  </div>

  <div class="line"></div>
  <div class="horizontal"></div>

  <!-- Placeholder for test options -->
  <div class="row four">
    <div class="node">Test Option</div>
    <div class="node">Test Option</div>
    <div class="node">Test Option</div>
    <div class="node">Test Option</div>
  </div>

</div>

</body>
</html>
