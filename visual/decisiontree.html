<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decision Tree</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #05070f, #020617 80%);
  font-family: "Segoe UI", sans-serif;
  color: #e2e8f0;
  display: flex;
  justify-content: center;
  padding: 50px;
}

.tree {
  width: 1000px;
  text-align: center;
}

/* BOXES */
.node {
  padding: 12px 16px;
  border-radius: 14px;
  min-width: 170px;
}

/* PROMPT */
.prompt {
  background: rgba(10,15,30,0.95);
  border: 1px solid #3b82f6;
  box-shadow: 0 0 10px rgba(59,130,246,0.6);
  font-weight: 500;
}

/* ANSWERS */
.answer {
  background: rgba(6,10,20,0.95);
  border: 1px solid #38bdf8;
  box-shadow: 0 0 6px rgba(56,189,248,0.35);
  transition: 0.2s;
}

.answer:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 12px rgba(56,189,248,0.6);
}

/* LINKS */
.node a {
  display: block;
  text-decoration: none;
  color: #e2e8f0;
}

.node a:hover {
  color: #7dd3fc;
}

/* LINES */
.line {
  width: 2px;
  height: 28px;
  background: rgba(59,130,246,0.7);
  margin: 0 auto;
}

.horizontal {
  height: 2px;
  background: rgba(59,130,246,0.7);
  margin: 0 auto 20px;
  width: 90%;
}

/* LAYOUT */
.row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

.branch {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
</style>
</head>

<body>

<div class="tree">

  <!-- TOP -->
  <div class="node prompt">
    Review scenario and select research design
  </div>

  <div class="line"></div>
  <div class="horizontal"></div>

  <div class="row">

    <!-- OBSERVATIONAL -->
    <div class="branch">
      <div class="node answer">Observational</div>
      <div class="line"></div>
      <div class="node answer">
        <a href="code/chi_gof.html">Chi‑Square Goodness of Fit</a>
      </div>
    </div>

    <!-- CORRELATIONAL -->
    <div class="branch">
      <div class="node answer">Correlation</div>
      <div class="line"></div>

      <div class="node answer">
        <a href="code/chi_independence.html">Chi‑Square Test of Independence</a>
      </div>

      <div class="line"></div>

      <div class="node answer">
        <a href="code/correlations.html">Pearson / Spearman Correlations</a>
      </div>
    </div>

    <!-- QUASI -->
    <div class="branch">
      <div class="node answer">Quasi-experiment</div>
      <div class="line"></div>
      <div class="node answer">
        <a href="code/ttest_ind.html">t‑tests</a>
      </div>
    </div>

    <!-- TRUE -->
    <div class="branch">
      <div class="node answer">True experiment</div>
      <div class="line"></div>
      <div class="node answer">
        <a href="code/ttest_dep.html">t‑tests</a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
