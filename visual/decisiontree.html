<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analysis Workflow</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #05070f, #020617 80%);
  font-family: "Segoe UI", sans-serif;
  color: #e2e8f0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CONTAINER */
.flow {
  display: flex;
  align-items: center;
  gap: 25px;
}

/* STEP BOX */
.step {
  background: rgba(10,15,30,0.9);
  border: 1px solid #3b82f6;
  padding: 18px 22px;
  border-radius: 16px;
  min-width: 220px;
  text-align: center;
  backdrop-filter: blur(12px);

  box-shadow:
    0 0 10px rgba(59,130,246,0.4),
    inset 0 0 10px rgba(59,130,246,0.15);

  transition: all 0.2s ease;
}

/* HOVER EFFECT */
.step:hover {
  transform: translateY(-4px);
  box-shadow:
    0 0 18px rgba(56,189,248,0.6);
}

/* LINKS */
.step a {
  color: #e2e8f0;
  text-decoration: none;
  display: block;
}

.step a:hover {
  color: #7dd3fc;
}

/* ARROW */
.arrow {
  font-size: 28px;
  color: #60a5fa;
  text-shadow: 0 0 10px rgba(96,165,250,0.6);
}
</style>
</head>

<body>

<div class="flow">

  <div class="step">
    <a href="#">
      Select scenario’s research design
    </a>
  </div>

  <div class="arrow">→</div>

  <div class="step">
    <a href="#">
      Select the correct inferential test
    </a>
  </div>

  <div class="arrow">→</div>

  <div class="step">
    <a href="#">
      Run code in R
    </a>
  </div>

  <div class="arrow">→</div>

  <div class="step">
    <a href="#">
      Report results in replicable file (R Markdown)
    </a>
  </div>

</div>

</body>
</html>
