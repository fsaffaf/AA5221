<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decision Tree</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #05070f, #020617 80%);
    font-family: "Segoe UI", sans-serif;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    padding: 50px;
  }

  .tree {
    width: 1100px;
    text-align: center;
  }

  .node {
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 14px;
    margin: 0 auto;
    width: fit-content;
    min-width: 170px;
  }

  /* PROMPT */
  .prompt {
    background: rgba(8, 12, 25, 0.95);
    border: 1px solid rgba(59,130,246,0.9);
    box-shadow:
      0 0 12px rgba(59,130,246,0.5),
      inset 0 0 10px rgba(59,130,246,0.2);
    font-weight: 500;
  }

  /* ANSWER */
  .answer {
    background: rgba(5, 8, 18, 0.95);
    border: 1px solid rgba(56,189,248,0.45);
    box-shadow: 0 0 6px rgba(56,189,248,0.15);
    transition: all 0.2s ease;
  }

  .answer:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 14px rgba(56,189,248,0.4);
  }

  .node a {
    color: #cbd5f5;
    text-decoration: none;
    display: block;
  }

  .node a:hover {
    color: #7dd3fc;
  }

  /* LINES */
  .line {
    width: 2px;
    height: 30px;
    background: rgba(59,130,246,0.6);
    margin: 0 auto;
  }

  .horizontal {
    height: 2px;
    width: 90%;
    background: rgba(59,130,246,0.6);
    margin: 0 auto 20px;
  }

  /* TOP ROW */
  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
  }

  /* EACH BRANCH COLUMN */
  .branch {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

</style>
</head>

<body>

<div class="tree">

  <!-- TOP -->
  <div class="node prompt">
    Review the scenario<br><br>
    Determine the research design
  </div>

  <div class="line"></div>
  <div class="horizontal"></div>

  <!-- DESIGN ROW -->
  <div class="row">

    <!-- OBSERVATIONAL -->
    <div class="branch">
      <div class="node answer">Observational</div>
      <div class="line"></div>
      <div class="node answer">
        <a href="code/chi_gof.html">Chi‑Square Goodness of Fit</a>
      </div>
    </div>

    <!-- CORRELATIONAL -->
    <div class="branch">
      <div class="node answer">Correlational</div>
      <div class="line"></div>

      <div class="node answer">
        <a href="code/correlations.html">Pearson Correlation</a>
      </div>

      <div class="line"></div>

      <div class="node answer">
        <a href="code/correlations.html">Spearman Correlation</a>
      </div>

      <div class="line"></div>

      <div class="node answer">
        <a href="code/chi_independence.html">Chi‑Square Independence</a>
      </div>
    </div>

    <!-- QUASI-EXPERIMENT -->
    <div class="branch">
      <div class="node answer">Quasi-experimental</div>
      <div class="line"></div>

      <div class="node answer">
        <a href="code/ttest_ind.html">Independent t‑test</a>
      </div>

      <div class="line"></div>

      <div class="node answer">
        <a href="code/mann_whitney.html">Mann‑Whitney U</a>
      </div>
    </div>

    <!-- TRUE EXPERIMENT -->
    <div class="branch">
      <div class="node answer">True experiment</div>
      <div class="line"></div>

      <div class="node answer">
        <a href="code/ttest_dep.html">Dependent t‑test</a>
      </div>

      <div class="line"></div>

      <div class="node answer">
        <a href="code/wilcoxon.html">Wilcoxon Signed Rank</a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
