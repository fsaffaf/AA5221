```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hypothesis Writer</title>

<style>

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #020617;
  color: white;
}

body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top, rgba(125,211,252,0.16), transparent 35%),
    radial-gradient(circle at bottom, rgba(99,102,241,0.14), transparent 40%);
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  opacity: 0.3;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 42px 42px;
  z-index: -1;
}


/* =========================================
   MAIN LAYOUT
   ========================================= */

.measurement-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.glass {
  width: 100%;
  max-width: 720px;
  padding: 2.5rem;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 24px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.45);
}

.glass h2 {
  margin: 0 0 0.75rem;
  text-align: center;
  font-size: clamp(2rem, 5vw, 3.25rem);
  font-weight: 650;
  letter-spacing: -0.03em;
  color: white;
}

.glass p {
  margin: 0 0 2rem;
  text-align: center;
  color: rgb(203,213,225);
  font-size: 1.05rem;
  line-height: 1.6;
}


/* =========================================
   QUESTION ROWS
   ========================================= */

.question-row {
  margin-bottom: 1.5rem;
  animation: fadeIn 0.3s ease;
}

.question-row.hidden {
  display: none;
}

.question-title {
  margin-bottom: 0.75rem;
  font-size: 1.05rem;
  font-weight: 650;
  color: white;
}

.question-number {
  color: rgb(125,211,252);
  margin-right: 0.4rem;
}


/* =========================================
   OPTIONS
   ========================================= */

.feature-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.feature-option {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 1rem 1.15rem;
  border-radius: 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgb(241,245,249);
  cursor: pointer;
  transition: 0.25s ease;
}

.feature-option:hover {
  background: rgba(255,255,255,0.13);
  transform: translateY(-1px);
}

.feature-option input {
  width: 1.1rem;
  height: 1.1rem;
  accent-color: #38bdf8;
  cursor: pointer;
}

.feature-title {
  font-weight: 600;
  color: white;
}

.feature-subtitle {
  font-size: 0.85rem;
  color: rgb(203,213,225);
  margin-top: 6px;
  display: block;
}


/* =========================================
   QUESTION 2 INPUT PANEL
   ========================================= */

.input-panel {
  display: none;
  margin-bottom: 2rem;
  animation: fadeIn 0.3s ease;
}

.input-grid {
  display: grid;
  gap: 1rem;
}

.input-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: rgb(226,232,240);
  font-size: 0.95rem;
}

.input-group input {
  width: 100%;
  box-sizing: border-box;
  padding: 1rem;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 1rem;
  outline: none;
}

.input-group input:focus {
  border-color: rgba(125,211,252,0.65);
}

.generate-btn {
  margin-top: 1.25rem;
  width: 100%;
  padding: 1rem;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: white;
  font-size: 1rem;
  font-weight: 650;
  cursor: pointer;
  transition: 0.25s ease;
}

.generate-btn:hover {
  transform: translateY(-2px);
}


/* =========================================
   RESULTS
   ========================================= */

.result-panel {
  display: none;
  border-radius: 20px;
  border: 1px solid rgba(125,211,252,0.30);
  background: linear-gradient(
    135deg,
    rgba(3,105,161,0.70),
    rgba(49,46,129,0.80)
  );
  padding: 1.75rem;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  animation: fadeIn 0.3s ease;
}

.result-panel.groups-style {
  border-color: rgba(148,163,184,0.25);
  background: linear-gradient(
    135deg,
    rgba(51,65,85,0.85),
    rgba(15,23,42,0.90)
  );
}

.result-top {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.result-title {
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 650;
}

.hypothesis-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.hypothesis-item {
  display: flex;
  gap: 0.75rem;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  padding: 1rem;
  color: rgb(241,245,249);
  line-height: 1.5;
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 700px) {

  .measurement-wrapper {
    padding: 1rem;
  }

  .glass {
    padding: 1.5rem;
  }

  .feature-list {
    grid-template-columns: 1fr;
  }

}


/* =========================================
   ANIMATION
   ========================================= */

@keyframes fadeIn {

  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

</style>
</head>


<body>

<div class="measurement-wrapper">

  <div class="glass">

    <h2>Hypothesis Writer</h2>

    <p>
      Answer each question to turn a research question into hypotheses.
    </p>


    <!-- ========================================= -->
    <!-- QUESTION 1 -->
    <!-- ========================================= -->

    <div class="question-row" id="question1">

      <div class="question-title">
        <span class="question-number">1.</span>
        What is your research design?
      </div>


      <div class="feature-list">


        <!-- ========================================= -->
        <!-- CORRELATION -->
        <!-- ========================================= -->

        <label class="feature-option">

          <input
            type="radio"
            name="design"
            id="correlationBtn"
            onchange="selectDesign('correlation')"
          >

          <span>

            <span class="feature-title">
              Correlation
            </span>

            <br>

            <span class="feature-subtitle">
              Testing if there is a relationship between two variables.
              <br>
              <br>
              Example: Is there a relationship between Variable 1 and Variable 2?
            </span>

          </span>

        </label>


        <!-- ========================================= -->
        <!-- QUASI / TRUE EXPERIMENT -->
        <!-- ========================================= -->

        <label class="feature-option">

          <input
            type="radio"
            name="design"
            id="groupsBtn"
            onchange="selectDesign('groups')"
          >

          <span>

            <span class="feature-title">
              Quasi-Experiment or True Experiment
            </span>

            <br>

            <span class="feature-subtitle">
              Testing if there is a difference between groups.
              <br>
              <br>
              Example: Is there a difference between Group A and Group B?
            </span>

          </span>

        </label>


      </div>

    </div>


    <!-- ========================================= -->
    <!-- QUESTION 2: VARIABLE NAMES -->
    <!-- ========================================= -->

    <div id="inputPanel" class="input-panel">

      <div class="question-title">
        <span class="question-number">2.</span>
        What are your variable names?
      </div>


      <div class="input-grid">


        <!-- VARIABLE 1 -->

        <div class="input-group">

          <label id="label1">
            Variable 1
          </label>

          <input
            type="text"
            id="input1"
            placeholder="Enter variable name"
          >

        </div>


        <!-- VARIABLE 2 -->

        <div class="input-group">

          <label id="label2">
            Variable 2
          </label>

          <input
            type="text"
            id="input2"
            placeholder="Enter variable name"
          >

        </div>


      </div>


      <button
        class="generate-btn"
        onclick="generateHypotheses()"
      >
        Write My Hypotheses
      </button>

    </div>


    <!-- ========================================= -->
    <!-- RESULTS -->
    <!-- ========================================= -->

    <div
      id="resultPanel"
      class="result-panel"
    >

      <div class="result-top">

        <div>

          <div
            class="result-title"
            id="resultTitle"
          >
            Results
          </div>

        </div>

      </div>


      <div class="hypothesis-list">


        <!-- NULL HYPOTHESIS -->

        <div class="hypothesis-item">

          <span id="nullHypothesis">
            Null hypothesis
          </span>

        </div>


        <!-- ALTERNATIVE HYPOTHESIS -->

        <div class="hypothesis-item">

          <span id="altHypothesis">
            Alternative hypothesis
          </span>

        </div>


      </div>

    </div>

  </div>

</div>


<script>


/* =========================================
   TRACK SELECTED DESIGN
   ========================================= */

let selectedDesign = "";


/* =========================================
   SELECT RESEARCH DESIGN
   ========================================= */

function selectDesign(type) {

  selectedDesign = type;


  const inputPanel =
    document.getElementById("inputPanel");

  const correlationBtn =
    document.getElementById("correlationBtn");

  const groupsBtn =
    document.getElementById("groupsBtn");

  const label1 =
    document.getElementById("label1");

  const label2 =
    document.getElementById("label2");

  const input1 =
    document.getElementById("input1");

  const input2 =
    document.getElementById("input2");

  const resultPanel =
    document.getElementById("resultPanel");


  /* =========================================
     RESET RESULTS
     ========================================= */

  resultPanel.style.display = "none";

  resultPanel.classList.remove("groups-style");


  /* Clear previous variable names */

  input1.value = "";
  input2.value = "";


  /* =========================================
     CORRELATION
     ========================================= */

  if (type === "correlation") {

    correlationBtn.classList.add("active");

    groupsBtn.classList.remove("active");


    label1.textContent =
      "Variable 1";

    label2.textContent =
      "Variable 2";


    input1.placeholder =
      "Enter your first variable";

    input2.placeholder =
      "Enter your second variable";

  }


  /* =========================================
     GROUP DIFFERENCE
     ========================================= */

  if (type === "groups") {

    groupsBtn.classList.add("active");

    correlationBtn.classList.remove("active");


    label1.textContent =
      "Independent Variable (Grouping Variable)";

    label2.textContent =
      "Dependent Variable";


    input1.placeholder =
      "Enter your grouping variable";

    input2.placeholder =
      "Enter your outcome variable";

  }


  /* =========================================
     SHOW QUESTION 2
     ========================================= */

  inputPanel.style.display = "block";


  /* Scroll Question 2 into view */

  setTimeout(function() {

    inputPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}


/* =========================================
   GENERATE HYPOTHESES
   ========================================= */

function generateHypotheses() {

  const var1 =
    document.getElementById("input1").value.trim();

  const var2 =
    document.getElementById("input2").value.trim();


  /* =========================================
     VALIDATE INPUTS
     ========================================= */

  if (!selectedDesign) {

    alert("Please select a research design.");

    return;

  }


  if (!var1 || !var2) {

    alert("Please enter both variable names.");

    return;

  }


  /* =========================================
     GET RESULT ELEMENTS
     ========================================= */

  const resultPanel =
    document.getElementById("resultPanel");

  const resultTitle =
    document.getElementById("resultTitle");

  const nullHypothesis =
    document.getElementById("nullHypothesis");

  const altHypothesis =
    document.getElementById("altHypothesis");


  /* Show result panel */

  resultPanel.style.display = "block";


  /* =========================================
     CORRELATION RESULTS
     ========================================= */

  if (selectedDesign === "correlation") {

    resultPanel.classList.remove("groups-style");


    resultTitle.textContent =
      "Testing Relationships";


    nullHypothesis.textContent =
      `Null hypothesis: There is no relationship between ${var1} and ${var2}.`;


    altHypothesis.textContent =
      `Alternative hypothesis: There is a relationship between ${var1} and ${var2}.`;

  }


  /* =========================================
     GROUP DIFFERENCE RESULTS
     ========================================= */

  if (selectedDesign === "groups") {

    resultPanel.classList.add("groups-style");


    resultTitle.textContent =
      "Testing Group Differences";


    nullHypothesis.textContent =
      `Null hypothesis: There is no statistically significant difference in ${var2} between the two ${var1} groups.`;


    altHypothesis.textContent =
      `Alternative hypothesis: There is a statistically significant difference in ${var2} between the two ${var1} groups.`;

  }


  /* Scroll to results */

  setTimeout(function() {

    resultPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}

</script>

</body>
</html>
```
