<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hypothesis Writer</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #f4f6f9;
  color: #222222;
}

body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before,
body::after {
  content: none;
}

/* =========================================
   MAIN LAYOUT
   ========================================= */

.measurement-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.glass {
  width: 100%;
  max-width: 720px;
  padding: 2.5rem;
  box-sizing: border-box;

  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
}

.glass h2 {
  margin: 0 0 0.75rem;
  text-align: center;
  font-size: clamp(2rem, 5vw, 3.25rem);
  font-weight: 500;
  letter-spacing: -0.03em;
  color: #0e68b3;
}

.glass p {
  margin: 0 0 2rem;
  text-align: center;
  color: #444444;
  font-size: 1.05rem;
  line-height: 1.8;
}

/* =========================================
   QUESTION ROWS
   ========================================= */

.question-row {
  margin-bottom: 1.5rem;
  animation: fadeIn 0.3s ease;
}

.question-row.hidden {
  display: none;
}

.question-title {
  margin-bottom: 0.75rem;
  font-size: 1.05rem;
  font-weight: 650;
  color: #0e68b3;
}

.question-number {
  color: #0e68b3;
  margin-right: 0.4rem;
}

/* =========================================
   OPTIONS
   ========================================= */

.feature-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.feature-option {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 1rem 1.15rem;
  border-radius: 12px;

  background: #ffffff;
  border: 1px solid #d9e2ec;
  color: #222222;

  cursor: pointer;
  transition: 0.25s ease;
}

.feature-option:hover {
  background: #f0f7fc;
  border-color: #0e68b3;
  transform: translateY(-1px);
}

.feature-option input {
  width: 1.1rem;
  height: 1.1rem;
  accent-color: #0e68b3;
  cursor: pointer;
  flex-shrink: 0;
}

.feature-title {
  font-weight: 600;
  color: #0e68b3;
}

.feature-subtitle {
  font-size: 0.85rem;
  color: #555555;
  margin-top: 0.15rem;
  display: block;
}

/* =========================================
   QUESTION 2 INPUT PANEL
   ========================================= */

.input-panel {
  display: none;
  margin-bottom: 2rem;
  animation: fadeIn 0.3s ease;
}

.input-grid {
  display: grid;
  gap: 1rem;
}

.input-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: #333333;
  font-size: 0.95rem;
}

.input-group input {
  width: 100%;
  box-sizing: border-box;
  padding: 1rem;
  border-radius: 12px;

  border: 1px solid #d9e2ec;
  background: #ffffff;
  color: #222222;

  font-family: inherit;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-group input:focus {
  border-color: #0e68b3;
  box-shadow: 0 0 0 3px rgba(14, 104, 179, 0.12);
}

/* GENERATE BUTTON */

.generate-btn {
  margin-top: 1.25rem;
  width: 100%;
  box-sizing: border-box;
  padding: 1rem;

  border: 1px solid #0e68b3;
  border-radius: 999px;

  background: #0e68b3;
  color: #ffffff;

  font-family: inherit;
  font-size: 1rem;
  font-weight: 650;

  cursor: pointer;
  transition: 0.25s ease;
}

.generate-btn:hover {
  background: #2b6cb0;
  border-color: #2b6cb0;
  transform: translateY(-1px);
}

.generate-btn:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

/* =========================================
   RESULTS
   ========================================= */

.result-panel {
  display: none;
  margin-top: 1.5rem;
  padding: 1.5rem;

  border-radius: 12px;
  border: 1px solid #b9d8ef;
  background: #f0f7fc;

  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
  animation: fadeIn 0.3s ease;
}

.result-panel.groups-style {
  border-color: #d9e2ec;
  background: #f4f6f9;
}

.result-top {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.result-title {
  margin: 0;
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 650;
  color: #0e68b3;
}

.hypothesis-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.hypothesis-item {
  display: flex;
  gap: 0.75rem;

  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  padding: 1rem;

  color: #333333;
  line-height: 1.8;
}

/* =========================================
   ANIMATION
   ========================================= */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 700px) {
  .measurement-wrapper {
    padding: 1rem;
  }

  .glass {
    padding: 1.5rem;
  }

  .feature-list {
    grid-template-columns: 1fr;
  }

  .result-panel {
    padding: 1.25rem;
  }

  .result-top {
    align-items: flex-start;
  }
}
</style>

</head>


<body>

<div class="measurement-wrapper">

  <div class="glass">

    <h2>Hypothesis Writer</h2>

    <p>
      Answer each question to turn a research question into hypotheses.
    </p>


    <!-- ========================================= -->
    <!-- QUESTION 1 -->
    <!-- ========================================= -->

    <div class="question-row" id="question1">

      <div class="question-title">
        <span class="question-number">1.</span>
        What is your research design?
      </div>


      <div class="feature-list">


        <!-- ========================================= -->
        <!-- CORRELATION -->
        <!-- ========================================= -->

        <label class="feature-option">

          <input
            type="radio"
            name="design"
            id="correlationBtn"
            onchange="selectDesign('correlation')"
          >

          <span>

            <span class="feature-title">
              Correlation
            </span>

            <br>

            <span class="feature-subtitle">
              Testing if there is a relationship between two variables.
              <br>
              <br>
              Example: Is there a relationship between Variable 1 and Variable 2?
            </span>

          </span>

        </label>


        <!-- ========================================= -->
        <!-- QUASI / TRUE EXPERIMENT -->
        <!-- ========================================= -->

        <label class="feature-option">

          <input
            type="radio"
            name="design"
            id="groupsBtn"
            onchange="selectDesign('groups')"
          >

          <span>

            <span class="feature-title">
              Quasi-Experiment or True Experiment
            </span>

            <br>

            <span class="feature-subtitle">
              Testing if there is a difference between groups.
              <br>
              <br>
              Example: Is there a difference between Group A and Group B?
            </span>

          </span>

        </label>


      </div>

    </div>


    <!-- ========================================= -->
    <!-- QUESTION 2: VARIABLE NAMES -->
    <!-- ========================================= -->

    <div id="inputPanel" class="input-panel">

      <div class="question-title">
        <span class="question-number">2.</span>
        What are your variable names?
      </div>


      <div class="input-grid">


        <!-- VARIABLE 1 -->

        <div class="input-group">

          <label id="label1">
            Variable 1
          </label>

          <input
            type="text"
            id="input1"
            placeholder="Enter variable name"
          >

        </div>


        <!-- VARIABLE 2 -->

        <div class="input-group">

          <label id="label2">
            Variable 2
          </label>

          <input
            type="text"
            id="input2"
            placeholder="Enter variable name"
          >

        </div>


      </div>


      <button
        class="generate-btn"
        onclick="generateHypotheses()"
      >
        Write My Hypotheses
      </button>

    </div>


    <!-- ========================================= -->
    <!-- RESULTS -->
    <!-- ========================================= -->

    <div
      id="resultPanel"
      class="result-panel"
    >

      <div class="result-top">

        <div>

          <div
            class="result-title"
            id="resultTitle"
          >
            Results
          </div>

        </div>

      </div>


      <div class="hypothesis-list">


        <!-- NULL HYPOTHESIS -->

        <div class="hypothesis-item">

          <span id="nullHypothesis">
            Null hypothesis
          </span>

        </div>


        <!-- ALTERNATIVE HYPOTHESIS -->

        <div class="hypothesis-item">

          <span id="altHypothesis">
            Alternative hypothesis
          </span>

        </div>


      </div>

    </div>

  </div>

</div>


<script>


/* =========================================
   TRACK SELECTED DESIGN
   ========================================= */

let selectedDesign = "";


/* =========================================
   SELECT RESEARCH DESIGN
   ========================================= */

function selectDesign(type) {

  selectedDesign = type;


  const inputPanel =
    document.getElementById("inputPanel");

  const correlationBtn =
    document.getElementById("correlationBtn");

  const groupsBtn =
    document.getElementById("groupsBtn");

  const label1 =
    document.getElementById("label1");

  const label2 =
    document.getElementById("label2");

  const input1 =
    document.getElementById("input1");

  const input2 =
    document.getElementById("input2");

  const resultPanel =
    document.getElementById("resultPanel");


  /* =========================================
     RESET RESULTS
     ========================================= */

  resultPanel.style.display = "none";

  resultPanel.classList.remove("groups-style");


  /* Clear previous variable names */

  input1.value = "";
  input2.value = "";


  /* =========================================
     CORRELATION
     ========================================= */

  if (type === "correlation") {

    correlationBtn.classList.add("active");

    groupsBtn.classList.remove("active");


    label1.textContent =
      "Variable 1";

    label2.textContent =
      "Variable 2";


    input1.placeholder =
      "Enter your first variable (Example: Phone Use (Hours)";

    input2.placeholder =
      "Enter your second variable (Example: Sleep (Hours)";

  }


  /* =========================================
     GROUP DIFFERENCE
     ========================================= */

  if (type === "groups") {

    groupsBtn.classList.add("active");

    correlationBtn.classList.remove("active");


    label1.textContent =
      "Independent Variable (Grouping Variable)";

    label2.textContent =
      "Dependent Variable";


    input1.placeholder =
      "Enter your grouping variable (Example: Diet (Diet A vs Diet B)";

    input2.placeholder =
      "Enter your outcome variable (Example: Weight (Kilograms)";

  }


  /* =========================================
     SHOW QUESTION 2
     ========================================= */

  inputPanel.style.display = "block";


  /* Scroll Question 2 into view */

  setTimeout(function() {

    inputPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}


/* =========================================
   GENERATE HYPOTHESES
   ========================================= */

function generateHypotheses() {

  const var1 =
    document.getElementById("input1").value.trim();

  const var2 =
    document.getElementById("input2").value.trim();


  /* =========================================
     VALIDATE INPUTS
     ========================================= */

  if (!selectedDesign) {

    alert("Please select a research design.");

    return;

  }


  if (!var1 || !var2) {

    alert("Please enter both variable names.");

    return;

  }


  /* =========================================
     GET RESULT ELEMENTS
     ========================================= */

  const resultPanel =
    document.getElementById("resultPanel");

  const resultTitle =
    document.getElementById("resultTitle");

  const nullHypothesis =
    document.getElementById("nullHypothesis");

  const altHypothesis =
    document.getElementById("altHypothesis");


  /* Show result panel */

  resultPanel.style.display = "block";


  /* =========================================
     CORRELATION RESULTS
     ========================================= */

  if (selectedDesign === "correlation") {

    resultPanel.classList.remove("groups-style");


    resultTitle.textContent =
      "Testing Relationships";


    nullHypothesis.textContent =
      `Null hypothesis: There is no relationship between ${var1} and ${var2}.`;


    altHypothesis.textContent =
      `Alternative hypothesis: There is a relationship between ${var1} and ${var2}.`;

  }


  /* =========================================
     GROUP DIFFERENCE RESULTS
     ========================================= */

  if (selectedDesign === "groups") {

    resultPanel.classList.add("groups-style");


    resultTitle.textContent =
      "Testing Group Differences";


    nullHypothesis.textContent =
      `Null hypothesis: There is no statistically significant difference in ${var2} between the two ${var1} groups.`;


    altHypothesis.textContent =
      `Alternative hypothesis: There is a statistically significant difference in ${var2} between the two ${var1} groups.`;

  }


  /* Scroll to results */

  setTimeout(function() {

    resultPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}

</script>

</body>
</html>
