
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hypothesis Writer</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #f4f6f9;
  color: #222222;
}

body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before,
body::after {
  content: none;
}

/* =========================================
   MAIN LAYOUT
   ========================================= */

.measurement-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.glass {
  width: 100%;
  max-width: 720px;
  padding: 2.5rem;
  box-sizing: border-box;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
}

.glass h2 {
  margin: 0 0 0.75rem;
  text-align: center;
  font-size: clamp(2rem, 5vw, 3.25rem);
  font-weight: 500;
  letter-spacing: -0.03em;
  color: #0e68b3;
}

.glass p {
  margin: 0 0 2rem;
  text-align: center;
  color: #444444;
  font-size: 1.05rem;
  line-height: 1.8;
}

/* =========================================
   QUESTION ROWS
   ========================================= */

.question-row {
  margin-bottom: 1.5rem;
  animation: fadeIn 0.3s ease;
}

.question-row.hidden {
  display: none;
}

.question-title {
  margin-bottom: 0.75rem;
  font-size: 1.05rem;
  font-weight: 650;
  color: #0e68b3;
}

.question-number {
  color: #0e68b3;
  margin-right: 0.4rem;
}

/* =========================================
   RESEARCH DESIGN SELECTOR LINK
   ========================================= */

.selector-help {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.65rem;
  margin: 0 0 1.25rem;
  padding: 1rem;
  border: 1px solid #d9eaf7;
  border-radius: 12px;
  background: #f3f9fe;
}

.selector-help-text {
  margin: 0;
  color: #444444;
  font-size: 0.9rem;
  line-height: 1.5;
}

.selector-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  padding: 0.65rem 1rem;
  border: 1px solid #0e68b3;
  border-radius: 999px;
  background: #0e68b3;
  color: #ffffff;
  font-size: 0.88rem;
  font-weight: 650;
  line-height: 1.4;
  text-decoration: none;
  transition: background 0.2s ease,
              border-color 0.2s ease,
              transform 0.2s ease,
              box-shadow 0.2s ease;
}

.selector-pill:hover {
  background: #2b6cb0;
  border-color: #2b6cb0;
  color: #ffffff;
  text-decoration: none;
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(14, 104, 179, 0.2);
}

.selector-pill:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

.selector-arrow {
  font-size: 1rem;
  line-height: 1;
}

/* =========================================
   RESEARCH DESIGN OPTIONS
   ========================================= */

.feature-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.feature-option {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 1rem 1.15rem;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  color: #222222;
  cursor: pointer;
  transition: 0.25s ease;
}

.feature-option:hover {
  background: #f0f7fc;
  border-color: #0e68b3;
  transform: translateY(-1px);
}

.feature-option:has(input:checked) {
  background: #f0f7fc;
  border-color: #0e68b3;
}

.feature-option input {
  width: 1.1rem;
  height: 1.1rem;
  accent-color: #0e68b3;
  cursor: pointer;
  flex-shrink: 0;
}

.feature-title {
  font-weight: 600;
  color: #0e68b3;
}

.feature-subtitle {
  font-size: 0.85rem;
  color: #555555;
  margin-top: 0.15rem;
  display: block;
  line-height: 1.6;
}

/* =========================================
   VARIABLE AND UNIT INPUT PANEL
   ========================================= */

.input-panel {
  display: none;
  margin-bottom: 2rem;
  animation: fadeIn 0.3s ease;
}

/* Two-column layout:
   Variable 1 name | Variable 1 unit
   Variable 2 name | Variable 2 unit
*/

.input-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1.25rem 1rem;
  align-items: start;
}

.input-group {
  min-width: 0;
}

.input-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: #333333;
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.5;
}

.input-group input {
  display: block;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 0.9rem;
  border-radius: 12px;
  border: 1px solid #d9e2ec;
  background: #ffffff;
  color: #222222;
  font-family: inherit;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-group input::placeholder {
  color: #777777;
  opacity: 1;
}

.input-group input:focus {
  border-color: #0e68b3;
  box-shadow: 0 0 0 3px rgba(14, 104, 179, 0.12);
}

/* =========================================
   GENERATE BUTTON
   ========================================= */

.generate-btn {
  margin-top: 1.5rem;
  width: 100%;
  box-sizing: border-box;
  padding: 1rem;
  border: 1px solid #0e68b3;
  border-radius: 999px;
  background: #0e68b3;
  color: #ffffff;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 650;
  cursor: pointer;
  transition: 0.25s ease;
}

.generate-btn:hover {
  background: #2b6cb0;
  border-color: #2b6cb0;
  transform: translateY(-1px);
}

.generate-btn:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

/* =========================================
   RESULTS
   ========================================= */

.result-panel {
  display: none;
  margin-top: 1.5rem;
  padding: 1.5rem;
  border-radius: 12px;
  border: 1px solid #b9d8ef;
  background: #f0f7fc;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
  animation: fadeIn 0.3s ease;
}

.result-panel.groups-style {
  border-color: #d9e2ec;
  background: #f4f6f9;
}

.result-top {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.result-title {
  margin: 0;
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 650;
  color: #0e68b3;
}

.hypothesis-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.hypothesis-item {
  display: flex;
  gap: 0.75rem;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  padding: 1rem;
  color: #333333;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

/* =========================================
   ANIMATION
   ========================================= */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 700px) {
  .measurement-wrapper {
    padding: 1rem;
  }

  .glass {
    padding: 1.5rem;
  }

  .feature-list {
    grid-template-columns: 1fr;
  }

  .input-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
  }

  .selector-help {
    align-items: flex-start;
    flex-direction: column;
  }

  .result-panel {
    padding: 1.25rem;
  }

  .result-top {
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<div class="measurement-wrapper">

  <div class="glass">

    <h2>Hypothesis Writer</h2>

    <p>
      Answer each question to turn a research question into hypotheses.
    </p>

    <!-- ========================================= -->
    <!-- QUESTION 1: RESEARCH DESIGN -->
    <!-- ========================================= -->


<div class="question-row" id="question1">

  <div class="question-header">

    <div class="question-title">
      <span class="question-number">1.</span>
      What is your research design?
    </div>

    <a
      class="selector-pill"
      href="https://fsaffaf.github.io/AA5221/tools/research_design_selector.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open the Research Design Selector in a new tab"
    >Try the Research Design Selector</a>

  </div>

  <div class="feature-list">

    <!-- CORRELATION -->

    <label class="feature-option">

      <input
        type="radio"
        name="design"
        id="correlationBtn"
        onchange="selectDesign('correlation')"
      >

      <span>
        <span class="feature-title">
          Correlation
        </span>
      </span>

    </label>

    <!-- QUASI-EXPERIMENT OR TRUE EXPERIMENT -->

    <label class="feature-option">

      <input
        type="radio"
        name="design"
        id="groupsBtn"
        onchange="selectDesign('groups')"
      >

      <span>
        <span class="feature-title">
          Quasi-Experiment or
          <br> True Experiment
        </span>
      </span>

    </label>

  </div>

</div>


    <!-- ========================================= -->
    <!-- QUESTION 2: VARIABLE NAMES AND UNITS -->
    <!-- ========================================= -->

    <div id="inputPanel" class="input-panel">

      <div class="question-title">
        <span class="question-number">2.</span>
        Enter your variable names and unit of measurement.
      </div>

      <div class="input-grid">

        <!-- VARIABLE 1 NAME -->

        <div class="input-group">

          <label id="label1" for="input1">
            Variable 1 Name
          </label>

          <input
            type="text"
            id="input1"
            placeholder="Example: Study Time"
          >

        </div>

        <!-- VARIABLE 1 UNIT -->

        <div class="input-group">

          <label id="unitLabel1" for="unit1">
            Unit for Variable 1 (optional)
          </label>

          <input
            type="text"
            id="unit1"
            placeholder="Example: Hours"
          >

        </div>

        <!-- VARIABLE 2 NAME -->

        <div class="input-group">

          <label id="label2" for="input2">
            Variable 2 Name
          </label>

          <input
            type="text"
            id="input2"
            placeholder="Example: Test Score"
          >

        </div>

        <!-- VARIABLE 2 UNIT -->

        <div class="input-group">

          <label id="unitLabel2" for="unit2">
            Unit for Variable 2 (optional)
          </label>

          <input
            type="text"
            id="unit2"
            placeholder="Example: Points"
          >

        </div>

      </div>

      <button
        type="button"
        class="generate-btn"
        onclick="generateHypotheses()"
      >
        Write My Hypotheses
      </button>

    </div>

    <!-- ========================================= -->
    <!-- RESULTS -->
    <!-- ========================================= -->

    <div id="resultPanel" class="result-panel">

      <div class="result-top">

        <div
          class="result-title"
          id="resultTitle"
        >
          Results
        </div>

      </div>

      <div class="hypothesis-list">

        <!-- NULL HYPOTHESIS -->

        <div class="hypothesis-item">

          <span id="nullHypothesis">
            Null hypothesis
          </span>

        </div>

        <!-- ALTERNATIVE HYPOTHESIS -->

        <div class="hypothesis-item">

          <span id="altHypothesis">
            Alternative hypothesis
          </span>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

/* =========================================
   TRACK SELECTED DESIGN
   ========================================= */

let selectedDesign = "";


/* =========================================
   SELECT RESEARCH DESIGN
   ========================================= */

function selectDesign(type) {

  selectedDesign = type;

  const inputPanel =
    document.getElementById("inputPanel");

  const label1 =
    document.getElementById("label1");

  const label2 =
    document.getElementById("label2");

  const input1 =
    document.getElementById("input1");

  const input2 =
    document.getElementById("input2");

  const unit1 =
    document.getElementById("unit1");

  const unit2 =
    document.getElementById("unit2");

  const unitLabel1 =
    document.getElementById("unitLabel1");

  const unitLabel2 =
    document.getElementById("unitLabel2");

  const resultPanel =
    document.getElementById("resultPanel");


  /* =========================================
     RESET RESULTS AND PREVIOUS INPUTS
     ========================================= */

  resultPanel.style.display = "none";
  resultPanel.classList.remove("groups-style");

  input1.value = "";
  input2.value = "";
  unit1.value = "";
  unit2.value = "";


  /* =========================================
     CORRELATION
     ========================================= */

  if (type === "correlation") {

    label1.textContent =
      "Variable 1 Name";

    label2.textContent =
      "Variable 2 Name";

    unitLabel1.textContent =
      "Unit for Variable 1 (optional)";

    unitLabel2.textContent =
      "Unit for Variable 2 (optional)";

    input1.placeholder =
      "Example: Training Time";

    input2.placeholder =
      "Example: Communication Score";

    unit1.placeholder =
      "Example: Hours";

    unit2.placeholder =
      "Example: Scale of 1-10";

  }


  /* =========================================
     GROUP DIFFERENCE
     ========================================= */

  if (type === "groups") {

    label1.textContent =
      "Independent Variable (Grouping Variable)";

    label2.textContent =
      "Dependent Variable (Outcome)";

    unitLabel1.textContent =
      "Unit for Grouping Variable (optional)";

    unitLabel2.textContent =
      "Unit for Outcome Variable (optional)";

    input1.placeholder =
      "Example: Service Type";

    input2.placeholder =
      "Example: Satisfaction";

    unit1.placeholder =
      "Example: AI vs. Human";

    unit2.placeholder =
      "Example: Percentage";

  }


  /* =========================================
     SHOW QUESTION 2
     ========================================= */

  inputPanel.style.display = "block";


  /* SCROLL QUESTION 2 INTO VIEW */

  setTimeout(function() {

    inputPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}


/* =========================================
   GENERATE HYPOTHESES
   ========================================= */

function generateHypotheses() {

  const var1 =
    document.getElementById("input1").value.trim();

  const var2 =
    document.getElementById("input2").value.trim();

  const unit1 =
    document.getElementById("unit1").value.trim();

  const unit2 =
    document.getElementById("unit2").value.trim();


  /* =========================================
     VALIDATE INPUTS
     ========================================= */

  if (!selectedDesign) {

    alert("Please select a research design.");

    return;

  }

  if (!var1 || !var2) {

    alert("Please enter both variable names.");

    return;

  }


  /* =========================================
     COMBINE VARIABLE NAMES AND UNITS
     ========================================= */

  const variable1 = unit1
    ? `${var1} (${unit1})`
    : var1;

  const variable2 = unit2
    ? `${var2} (${unit2})`
    : var2;


  /* =========================================
     GET RESULT ELEMENTS
     ========================================= */

  const resultPanel =
    document.getElementById("resultPanel");

  const resultTitle =
    document.getElementById("resultTitle");

  const nullHypothesis =
    document.getElementById("nullHypothesis");

  const altHypothesis =
    document.getElementById("altHypothesis");


  /* SHOW RESULT PANEL */

  resultPanel.style.display = "block";


  /* =========================================
     CORRELATION RESULTS
     ========================================= */

  if (selectedDesign === "correlation") {

    resultPanel.classList.remove("groups-style");

    resultTitle.textContent =
      "Testing Relationships";

    nullHypothesis.textContent =
      `Null hypothesis: There is no relationship between ${variable1} and ${variable2}.`;

    altHypothesis.textContent =
      `Alternative hypothesis: There is a relationship between ${variable1} and ${variable2}.`;

  }


  /* =========================================
     GROUP DIFFERENCE RESULTS
     ========================================= */

  if (selectedDesign === "groups") {

    resultPanel.classList.add("groups-style");

    resultTitle.textContent =
      "Testing Group Differences";

    const groupingVariable = unit1
      ? `${var1} (measured in ${unit1})`
      : var1;

    nullHypothesis.textContent =
      `Null hypothesis: There is no statistically significant difference in ${variable2} between the two ${groupingVariable} groups.`;

    altHypothesis.textContent =
      `Alternative hypothesis: There is a statistically significant difference in ${variable2} between the two ${groupingVariable} groups.`;

  }


  /* =========================================
     SCROLL TO RESULTS
     ========================================= */

  setTimeout(function() {

    resultPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}

</script>

</body>
</html>
