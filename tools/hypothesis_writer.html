<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hypothesis Writer</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #f4f6f9;
  color: #222222;
}

body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before,
body::after {
  content: none;
}

/* =========================================
   MAIN LAYOUT
   ========================================= */

.measurement-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  box-sizing: border-box;
}

.glass {
  width: 100%;
  max-width: 720px;
  padding: 2.5rem;
  box-sizing: border-box;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
}

.glass h2 {
  margin: 0 0 0.75rem;
  text-align: center;
  font-size: clamp(2rem, 5vw, 3.25rem);
  font-weight: 500;
  letter-spacing: -0.03em;
  color: #0e68b3;
}

.glass p {
  margin: 0 0 2rem;
  text-align: center;
  color: #444444;
  font-size: 1.05rem;
  line-height: 1.8;
}

/* =========================================
   QUESTION ROWS
   ========================================= */

.question-row {
  margin-bottom: 1.5rem;
  animation: fadeIn 0.3s ease;
}

.question-row.hidden {
  display: none;
}

.question-title {
  margin-bottom: 0.75rem;
  font-size: 1.05rem;
  font-weight: 650;
  color: #0e68b3;
}

.question-number {
  color: #0e68b3;
  margin-right: 0.4rem;
}

/* =========================================
   QUESTION 1: TWO-COLUMN HEADER
   ========================================= */

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.25rem;
}

.question-header .question-title {
  flex: 1;
  min-width: 0;
  margin-bottom: 0;
  text-align: left;
}

/* =========================================
   RESEARCH DESIGN SELECTOR LINK
   ========================================= */

.selector-help {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.65rem;
  margin: 0 0 1.25rem;
  padding: 1rem;
  border: 1px solid #d9eaf7;
  border-radius: 12px;
  background: #f3f9fe;
}

.selector-help-text {
  margin: 0;
  color: #444444;
  font-size: 0.9rem;
  line-height: 1.5;
}

.selector-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  padding: 0.65rem 1rem;
  border: 1px solid #0e68b3;
  border-radius: 999px;
  background: #0e68b3;
  color: #ffffff;
  font-size: 0.88rem;
  font-weight: 650;
  line-height: 1.4;
  text-decoration: none;
  transition: background 0.2s ease,
              border-color 0.2s ease,
              transform 0.2s ease,
              box-shadow 0.2s ease;
  box-sizing: border-box;
  flex-shrink: 0;
  white-space: nowrap;
}

.selector-pill:hover {
  background: #2b6cb0;
  border-color: #2b6cb0;
  color: #ffffff;
  text-decoration: none;
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(14, 104, 179, 0.2);
}

.selector-pill:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

.selector-arrow {
  font-size: 1rem;
  line-height: 1;
}

/* =========================================
   RESEARCH DESIGN OPTIONS
   ========================================= */

.feature-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.feature-option {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 1rem 1.15rem;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  color: #222222;
  cursor: pointer;
  transition: 0.25s ease;
  min-width: 0;
  box-sizing: border-box;
}

.feature-option:hover {
  background: #f0f7fc;
  border-color: #0e68b3;
  transform: translateY(-1px);
}

.feature-option:has(input:checked) {
  background: #f0f7fc;
  border-color: #0e68b3;
}

.feature-option input {
  width: 1.1rem;
  height: 1.1rem;
  accent-color: #0e68b3;
  cursor: pointer;
  flex-shrink: 0;
}

.feature-title {
  font-weight: 600;
  color: #0e68b3;
}

.feature-subtitle {
  font-size: 0.85rem;
  color: #555555;
  margin-top: 0.15rem;
  display: block;
  line-height: 1.6;
}


/* =========================================
   VARIABLE AND UNIT INPUT PANEL
   ========================================= */

.input-panel {
  display: none;
  margin-bottom: 2rem;
  animation: fadeIn 0.3s ease;
}

.input-grid {
  display: grid;
  grid-template-columns: minmax(105px, 0.8fr) minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 0.75rem 1rem;
  align-items: center;
}

.input-column-header {
  color: #0e68b3;
  font-size: 0.9rem;
  font-weight: 700;
  text-align: left;
  padding-bottom: 0.2rem;
}

.variable-row-label {
  color: #333333;
  font-size: 0.9rem;
  font-weight: 600;
  line-height: 1.4;
}

.input-group {
  min-width: 0;
}

.input-group input {
  display: block;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 0.75rem;
  border-radius: 8px;
  border: 1px solid #d9e2ec;
  background: #ffffff;
  color: #222222;
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-group input::placeholder {
  color: #777777;
  opacity: 1;
}

.input-group input:focus {
  border-color: #0e68b3;
  box-shadow: 0 0 0 3px rgba(14, 104, 179, 0.12);
}

/* MOBILE LAYOUT */

@media (max-width: 520px) {
  .input-grid {
    grid-template-columns: 85px minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 0.75rem 0.5rem;
  }

  .variable-row-label {
    font-size: 0.78rem;
  }

  .input-column-header {
    font-size: 0.8rem;
  }

  .input-group input {
    padding: 0.65rem 0.4rem;
    font-size: 0.85rem;
  }
}


/* =========================================
   GENERATE BUTTON
   ========================================= */

.generate-btn {
  margin-top: 1.5rem;
  width: 100%;
  box-sizing: border-box;
  padding: 1rem;
  border: 1px solid #0e68b3;
  border-radius: 999px;
  background: #0e68b3;
  color: #ffffff;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 650;
  cursor: pointer;
  transition: 0.25s ease;
}

.generate-btn:hover {
  background: #2b6cb0;
  border-color: #2b6cb0;
  transform: translateY(-1px);
}

.generate-btn:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

/* =========================================
   RESULTS
   ========================================= */

.result-panel {
  display: none;
  margin-top: 1.5rem;
  padding: 1.5rem;
  border-radius: 12px;
  border: 1px solid #b9d8ef;
  background: #f0f7fc;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
  animation: fadeIn 0.3s ease;
}

.result-panel.groups-style {
  border-color: #d9e2ec;
  background: #f4f6f9;
}

.result-top {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.result-title {
  margin: 0;
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 650;
  color: #0e68b3;
}

.hypothesis-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.hypothesis-item {
  display: flex;
  gap: 0.75rem;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  padding: 1rem;
  color: #333333;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

/* =========================================
   ANIMATION
   ========================================= */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================
   TABLET AND MOBILE
   ========================================= */

@media (max-width: 700px) {
  .measurement-wrapper {
    padding: 1rem;
  }

  .glass {
    padding: 1.5rem;
  }

  .feature-list {
    grid-template-columns: 1fr;
  }

  .input-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
  }

  .selector-help {
    align-items: flex-start;
    flex-direction: column;
  }

  .result-panel {
    padding: 1.25rem;
  }

  .result-top {
    align-items: flex-start;
  }
}

/* Stack Question 1 on narrow screens */

@media (max-width: 520px) {
  .question-header {
    align-items: flex-start;
    flex-direction: column;
    gap: 0.75rem;
  }

  .question-header .selector-pill {
    white-space: normal;
  }
}

</style>
</head>

<body>

<div class="measurement-wrapper">

  <div class="glass">

    <h2>Hypothesis Writer</h2>

    <p>
      Answer each question to turn a research question into hypotheses.
    </p>

    <!-- ========================================= -->
    <!-- QUESTION 1: RESEARCH DESIGN -->
    <!-- ========================================= -->

    <div class="question-row" id="question1">

      <div class="question-header">

        <div class="question-title">
          <span class="question-number">1.</span>
          What is your research design?
        </div>

        <a
          class="selector-pill"
          href="https://fsaffaf.github.io/AA5221/tools/research_design_selector.html"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open the Research Design Selector in a new tab"
        >Try the Research Design Selector</a>

      </div>

      <div class="feature-list">

        <!-- CORRELATION -->

        <label class="feature-option">

          <input
            type="radio"
            name="design"
            id="correlationBtn"
            onchange="selectDesign('correlation')"
          >

          <span>
            <span class="feature-title">
              Correlation
            </span>
          </span>

        </label>

        <!-- QUASI-EXPERIMENT OR TRUE EXPERIMENT -->

        <label class="feature-option">

          <input
            type="radio"
            name="design"
            id="groupsBtn"
            onchange="selectDesign('groups')"
          >

          <span>
            <span class="feature-title">
              Quasi-Experiment or<br>True Experiment
            </span>
          </span>

        </label>

      </div>

    </div>

    <!-- ========================================= -->
    <!-- QUESTION 2: VARIABLE NAMES AND UNITS -->
    <!-- ========================================= -->

    
<div id="inputPanel" class="input-panel">

  <div class="question-title">
    <span class="question-number">2.</span>
    Enter your variable names and units of measurement.
  </div>

  <div class="input-grid">

    <!-- COLUMN HEADERS -->

    <div></div>

    <div class="input-column-header">
      Name
    </div>

    <div class="input-column-header">
      Unit
    </div>

    <!-- VARIABLE 1 -->

    <div class="variable-row-label" id="label1">
      Variable 1:
    </div>

    <div class="input-group">
      <input
        type="text"
        id="input1"
        aria-label="Variable 1 name"
        placeholder="Study Time"
      >
    </div>

    <div class="input-group">
      <input
        type="text"
        id="unit1"
        aria-label="Variable 1 unit"
        placeholder="Hours"
      >
    </div>

    <!-- VARIABLE 2 -->

    <div class="variable-row-label" id="label2">
      Variable 2:
    </div>

    <div class="input-group">
      <input
        type="text"
        id="input2"
        aria-label="Variable 2 name"
        placeholder="Test Score"
      >
    </div>

    <div class="input-group">
      <input
        type="text"
        id="unit2"
        aria-label="Variable 2 unit"
        placeholder="Points"
      >
    </div>

  </div>

  <button
    type="button"
    class="generate-btn"
    onclick="generateHypotheses()"
  >
    Write My Hypotheses
  </button>

</div>


    <!-- ========================================= -->
    <!-- RESULTS -->
    <!-- ========================================= -->

    <div id="resultPanel" class="result-panel">

      <div class="result-top">

        <div
          class="result-title"
          id="resultTitle"
        >
          Results
        </div>

      </div>

      <div class="hypothesis-list">

        <!-- NULL HYPOTHESIS -->

        <div class="hypothesis-item">

          <span id="nullHypothesis">
            Null hypothesis
          </span>

        </div>

        <!-- ALTERNATIVE HYPOTHESIS -->

        <div class="hypothesis-item">

          <span id="altHypothesis">
            Alternative hypothesis
          </span>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

let selectedDesign = "";

/* =========================================
   SELECT RESEARCH DESIGN
========================================= */

function selectDesign(type) {

  selectedDesign = type;

  const inputPanel = document.getElementById("inputPanel");
  const resultPanel = document.getElementById("resultPanel");

  const label1 = document.getElementById("label1");
  const label2 = document.getElementById("label2");

  const input1 = document.getElementById("input1");
  const input2 = document.getElementById("input2");

  const unit1 = document.getElementById("unit1");
  const unit2 = document.getElementById("unit2");

  document
    .querySelectorAll(".feature-option")
    .forEach(option => option.classList.remove("selected"));

  const selectedRadio =
    document.querySelector(`input[onchange="selectDesign('${type}')"]`);

  if (selectedRadio) {
    selectedRadio.closest(".feature-option")
      .classList.add("selected");
  }

  resultPanel.style.display = "none";
  resultPanel.classList.remove("groups-style");

  input1.value = "";
  input2.value = "";
  unit1.value = "";
  unit2.value = "";

  if (type === "correlation") {

    label1.textContent = "Variable 1";
    label2.textContent = "Variable 2";

    input1.placeholder = "Example: Study Time";
    input2.placeholder = "Example: Test Score";

    unit1.placeholder = "Example: Hours";
    unit2.placeholder = "Example: Points";

  }

  if (type === "groups") {

    label1.textContent = "Independent Variable";
    label2.textContent = "Dependent Variable";

    input1.placeholder = "Example: Service Type";
    input2.placeholder = "Example: Satisfaction";

    unit1.placeholder = "Example: AI vs Human";
    unit2.placeholder = "Example: Percentage";

  }

  inputPanel.style.display = "block";

  setTimeout(() => {

    inputPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}


/* =========================================
   GENERATE HYPOTHESES
========================================= */

function generateHypotheses() {

  const var1 =
    document.getElementById("input1").value.trim();

  const var2 =
    document.getElementById("input2").value.trim();

  const unit1 =
    document.getElementById("unit1").value.trim();

  const unit2 =
    document.getElementById("unit2").value.trim();

  if (!selectedDesign) {

    alert("Please select a research design.");
    return;

  }

  if (!var1 || !var2) {

    alert("Please enter both variable names.");
    return;

  }

  const variable1 =
    unit1 ? `${var1} (${unit1})` : var1;

  const variable2 =
    unit2 ? `${var2} (${unit2})` : var2;

  const resultPanel =
    document.getElementById("resultPanel");

  const resultTitle =
    document.getElementById("resultTitle");

  const nullHypothesis =
    document.getElementById("nullHypothesis");

  const altHypothesis =
    document.getElementById("altHypothesis");

  resultPanel.style.display = "block";

  if (selectedDesign === "correlation") {

    resultPanel.classList.remove("groups-style");

    resultTitle.textContent =
      "Testing Relationships";

    nullHypothesis.textContent =
      `Null hypothesis: There is no statistically significant relationship between ${variable1} and ${variable2}.`;

    altHypothesis.textContent =
      `Alternative hypothesis: There is a statistically significant relationship between ${variable1} and ${variable2}.`;

  }

  if (selectedDesign === "groups") {

    resultPanel.classList.add("groups-style");

    resultTitle.textContent =
      "Testing Group Differences";

    const groupLabel = unit1 || var1;

    nullHypothesis.textContent =
      `Null hypothesis: There is no statistically significant difference in ${variable2} between the ${groupLabel} groups.`;

    altHypothesis.textContent =
      `Alternative hypothesis: There is a statistically significant difference in ${variable2} between the ${groupLabel} groups.`;

  }

  setTimeout(() => {

    resultPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}

</script>

</body>
</html>
