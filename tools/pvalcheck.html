<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-Value Checker</title>

<!-- Libraries -->
https://cdn.plot.ly/plotly-2.35.2.min.js</script>
https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.6/jstat.min.jsscript>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#090b13;
    color:white;
    font-family:system-ui,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:min(1000px,95%);
    padding:2rem;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
}

h1{
    text-align:center;
    color:#7dd3fc;
    margin-top:0;
}

.controls{
    display:flex;
    gap:1rem;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:1rem;
}

input{
    padding:.6rem;
    border-radius:8px;
    border:none;
    width:140px;
    text-align:center;
}

button{
    padding:.6rem 1rem;
    border:none;
    border-radius:8px;
    background:#38bdf8;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#7dd3fc;
}

#result{
    text-align:center;
    margin:1rem 0;
    line-height:1.8;
}

#plot{
    width:100%;
    height:550px;
}
</style>
</head>

<body>

<div class="card">

    <h1>P-Value Checker</h1>

    <div class="controls">
        <label for="pvalue">Enter P-Value:</label>

        <input
            type="number"
            id="pvalue"
            value="0.05"
            min="0.0001"
            max="0.9999"
            step="0.001">

        <button onclick="updatePlot()">Check</button>
    </div>

    <div id="result"></div>

    <div id="plot"></div>

</div>

<script>

function updatePlot() {

    const p = parseFloat(document.getElementById("pvalue").value);

    if (isNaN(p) || p <= 0 || p >= 1) {
        document.getElementById("result").innerHTML =
            "Please enter a p-value between 0 and 1.";
        return;
    }

    const alpha = 0.05;

    const zAlpha = jStat.normal.inv(1 - alpha / 2, 0, 1);
    const zUser  = jStat.normal.inv(1 - p / 2, 0, 1);

    const x = [];
    const y = [];

    for (let i = -4; i <= 4; i += 0.01) {
        x.push(i);
        y.push(jStat.normal.pdf(i,0,1));
    }

    const alphaLeftX = [];
    const alphaLeftY = [];

    const alphaRightX = [];
    const alphaRightY = [];

    const pAreaX = [];
    const pAreaY = [];

    for (let i = -4; i <= 4; i += 0.01) {

        const density = jStat.normal.pdf(i,0,1);

        if (i <= -zAlpha) {
            alphaLeftX.push(i);
            alphaLeftY.push(density);
        }

        if (i >= zAlpha) {
            alphaRightX.push(i);
            alphaRightY.push(density);
        }

        if (i <= -zUser || i >= zUser) {
            pAreaX.push(i);
            pAreaY.push(density);
        }
    }

    const alphaLeft = {
        x: alphaLeftX,
        y: alphaLeftY,
        fill: "tozeroy",
        type: "scatter",
        mode: "none",
        fillcolor: "rgba(255,0,0,0.25)",
        name: "α = .05 Rejection Region"
    };

    const alphaRight = {
        x: alphaRightX,
        y: alphaRightY,
        fill: "tozeroy",
        type: "scatter",
        mode: "none",
        fillcolor: "rgba(255,0,0,0.25)",
        showlegend: false
    };

    const pRegion = {
        x: pAreaX,
        y: pAreaY,
        fill: "tozeroy",
        type: "scatter",
        mode: "none",
        fillcolor: "rgba(56,189,248,0.55)",
        name: "Observed P-Value Area"
    };

    const curve = {
        x: x,
        y: y,
        type: "scatter",
        mode: "lines",
        line: {
            color: "white",
            width: 3
        },
        name: "Normal Curve"
    };

    const layout = {
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",

        font: {
            color: "white"
        },

        title: "Standard Normal Distribution",

        xaxis: {
            title: "Z Score",
            gridcolor: "rgba(255,255,255,0.1)"
        },

        yaxis: {
            title: "Density",
            gridcolor: "rgba(255,255,255,0.1)"
        },

        shapes: [
            {
                type: "line",
                x0: -zAlpha,
                x1: -zAlpha,
                y0: 0,
                y1: 0.42,
                line: {
                    color: "red",
                    dash: "dash",
                    width: 3
                }
            },
            {
                type: "line",
                x0: zAlpha,
                x1: zAlpha,
                y0: 0,
                y1: 0.42,
                line: {
                    color: "red",
                    dash: "dash",
                    width: 3
                }
            },
            {
                type: "line",
                x0: -zUser,
                x1: -zUser,
                y0: 0,
                y1: 0.42,
                line: {
                    color: "#38bdf8",
                    width: 4
                }
            },
            {
                type: "line",
                x0: zUser,
                x1: zUser,
                y0: 0,
                y1: 0.42,
                line: {
                    color: "#38bdf8",
                    width: 4
                }
            }
        ]
    };

    Plotly.newPlot(
        "plot",
        [alphaLeft, alphaRight, pRegion, curve],
        layout,
        { responsive: true }
    );

    document.getElementById("result").innerHTML = `
        <strong>P-Value:</strong> ${p.toFixed(4)}<br>
        <strong>Equivalent |Z|:</strong> ${zUser.toFixed(3)}<br><br>

        ${
            p < alpha
            ? '<span style="color:#22c55e;font-size:1.15rem;">✓ Significant at α = .05</span>'
            : '<span style="color:#ef4444;font-size:1.15rem;">✗ Not Significant at α = .05</span>'
        }

        <br><br>

        <span style="color:#cbd5e1;">
        Red = α=.05 rejection region<br>
        Blue = probability area represented by the entered p-value
        </span>
    `;
}

window.onload = updatePlot;

</script>

</body>
</html>
