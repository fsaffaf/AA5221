<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Level of Measurement Identifier</title>

<style>

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #020617;
  color: white;
}

body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    radial-gradient(circle at top, rgba(125,211,252,0.16), transparent 35%),
    radial-gradient(circle at bottom, rgba(99,102,241,0.14), transparent 40%);

  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  opacity: 0.3;

  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

  background-size: 42px 42px;
  z-index: -1;
}

/* =========================================
   MAIN LAYOUT
   ========================================= */

.measurement-wrapper {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 2rem;
}

.glass {
  width: 100%;
  max-width: 720px;
  padding: 2.5rem;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  border-radius: 24px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.45);
}

.glass h2 {
  margin: 0 0 0.75rem;
  text-align: center;

  font-size: clamp(2rem, 5vw, 3.25rem);
  font-weight: 650;
  letter-spacing: -0.03em;

  color: white;
}

.glass p {
  margin: 0 0 2rem;
  text-align: center;

  color: rgb(203,213,225);
  font-size: 1.05rem;
  line-height: 1.6;
}

/* =========================================
   QUESTION ROWS
   ========================================= */

.question-row {
  margin-bottom: 1.5rem;
  animation: fadeIn 0.3s ease;
}

.question-row.hidden {
  display: none;
}

.question-title {
  margin-bottom: 0.75rem;

  font-size: 1.05rem;
  font-weight: 650;

  color: white;
}

.question-number {
  color: rgb(125,211,252);
  margin-right: 0.4rem;
}

/* =========================================
   OPTIONS
   ========================================= */

.feature-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.feature-option {
  display: flex;
  align-items: center;
  gap: 0.85rem;

  padding: 1rem 1.15rem;
  border-radius: 16px;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);

  color: rgb(241,245,249);

  cursor: pointer;
  transition: 0.25s ease;
}

.feature-option:hover {
  background: rgba(255,255,255,0.13);
  transform: translateY(-1px);
}

.feature-option input {
  width: 1.1rem;
  height: 1.1rem;

  accent-color: #38bdf8;
  cursor: pointer;
}

.feature-title {
  font-weight: 600;
  color: white;
}

.feature-subtitle {
  font-size: 0.85rem;
  color: rgb(203,213,225);
  margin-top: 0.15rem;
}

/* =========================================
   RESULT PANEL
   ========================================= */

.result-panel {
  display: none;

  margin-top: 1.5rem;
  padding: 1.5rem;

  border-radius: 20px;
  border: 1px solid rgba(125,211,252,0.30);

  background: linear-gradient(
    135deg,
    rgba(3,105,161,0.70),
    rgba(49,46,129,0.80)
  );

  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  animation: fadeIn 0.3s ease;
}

.result-label {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.22em;

  color: rgb(203,213,225);
  margin-bottom: 0.4rem;
}

.result-title {
  margin: 0;

  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 650;

  color: white;
}

.result-description {
  margin-top: 0.75rem;

  color: rgb(226,232,240);
  line-height: 1.6;
}

/* =========================================
   RESET BUTTON
   ========================================= */

.reset-button {
  display: none;

  width: 100%;
  margin-top: 1rem;

  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 18px;

  padding: 0.9rem 1.25rem;

  background: rgba(255,255,255,0.08);
  color: white;

  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;

  cursor: pointer;
  transition: 0.25s ease;
}

.reset-button:hover {
  background: rgba(255,255,255,0.14);
}

/* =========================================
   ANIMATION
   ========================================= */

@keyframes fadeIn {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 700px) {

  .measurement-wrapper {
    padding: 1rem;
  }

  .glass {
    padding: 1.5rem;
  }

  .feature-list {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<div class="measurement-wrapper">

  <div class="glass">

    <h2>Level of Measurement Identifier</h2>

    <p>
      Answer each question to identify the level of measurement.
    </p>


    <!-- ========================================= -->
    <!-- QUESTION 1 -->
    <!-- ========================================= -->

    <div class="question-row" id="question1">

      <div class="question-title">
        <span class="question-number">1.</span>
        Do you have categories?
      </div>

      <div class="feature-list">

        <label class="feature-option">

          <input
            type="radio"
            name="categories"
            id="categoriesYes"
            onchange="handleCategories()"
          >

          <span>
            <span class="feature-title">Yes</span>
            <br>

            <span class="feature-subtitle">
              The variable places observations into distinct categories or groups.
            </span>
          </span>

        </label>


        <label class="feature-option">

          <input
            type="radio"
            name="categories"
            id="categoriesNo"
            onchange="handleCategories()"
          >

          <span>
            <span class="feature-title">No</span>
            <br>

            <span class="feature-subtitle">
              The variable is measured using numerical values rather than categories.
            </span>
          </span>

        </label>

      </div>

    </div>


    <!-- ========================================= -->
    <!-- QUESTION 2A: CATEGORICAL -->
    <!-- ========================================= -->

    <div class="question-row hidden" id="question2Categories">

      <div class="question-title">
        <span class="question-number">2.</span>
        Do the categories have a meaningful order or ranking?
      </div>

      <div class="feature-list">

        <label class="feature-option">

          <input
            type="radio"
            name="ranking"
            id="rankingYes"
            onchange="handleRanking()"
          >

          <span>
            <span class="feature-title">Yes</span>
            <br>

            <span class="feature-subtitle">
              The categories can be meaningfully ranked, such as low, medium, and high.
            </span>
          </span>

        </label>


        <label class="feature-option">

          <input
            type="radio"
            name="ranking"
            id="rankingNo"
            onchange="handleRanking()"
          >

          <span>
            <span class="feature-title">No</span>
            <br>

            <span class="feature-subtitle">
              The categories are labels only and cannot be meaningfully ranked.
            </span>
          </span>

        </label>

      </div>

    </div>


    <!-- ========================================= -->
    <!-- QUESTION 2B: NUMERICAL -->
    <!-- ========================================= -->

    <div class="question-row hidden" id="question2Numbers">

      <div class="question-title">
        <span class="question-number">2.</span>
        Does the scale have a meaningful zero point?
      </div>

      <div class="feature-list">

        <label class="feature-option">

          <input
            type="radio"
            name="zero"
            id="zeroYes"
            onchange="handleZero()"
          >

          <span>
            <span class="feature-title">Yes</span>
            <br>

            <span class="feature-subtitle">
              A value of zero represents the complete absence of the quantity being measured.
            </span>
          </span>

        </label>


        <label class="feature-option">

          <input
            type="radio"
            name="zero"
            id="zeroNo"
            onchange="handleZero()"
          >

          <span>
            <span class="feature-title">No</span>
            <br>

            <span class="feature-subtitle">
              Zero does not represent the complete absence of the quantity being measured.
            </span>
          </span>

        </label>

      </div>

    </div>


    <!-- ========================================= -->
    <!-- RESULT -->
    <!-- ========================================= -->

    <div id="resultPanel" class="result-panel">

      <div class="result-label">
        Level of Measurement
      </div>

      <h3 id="result" class="result-title"></h3>

      <div
        id="resultDescription"
        class="result-description"
      ></div>

    </div>


    <!-- ========================================= -->
    <!-- RESET -->
    <!-- ========================================= -->

    <button
      id="resetButton"
      class="reset-button"
      onclick="resetSelector()"
    >
      Start Over
    </button>

  </div>

</div>


<script>

/* =========================================
   QUESTION 1
   CATEGORIES?
   ========================================= */

function handleCategories() {

  const categoriesYes =
    document.getElementById("categoriesYes").checked;

  const categoriesNo =
    document.getElementById("categoriesNo").checked;


  const question2Categories =
    document.getElementById("question2Categories");

  const question2Numbers =
    document.getElementById("question2Numbers");

  const resultPanel =
    document.getElementById("resultPanel");


  /*
    Reset all later answers whenever
    Question 1 changes.
  */

  document.getElementById("rankingYes").checked = false;
  document.getElementById("rankingNo").checked = false;

  document.getElementById("zeroYes").checked = false;
  document.getElementById("zeroNo").checked = false;


  /*
    Hide previous results.
  */

  resultPanel.style.display = "none";

  document.getElementById("resetButton").style.display = "none";


  /*
    YES = Categorical pathway
  */

  if (categoriesYes) {

    question2Categories.classList.remove("hidden");

    question2Numbers.classList.add("hidden");

  }


  /*
    NO = Numerical pathway
  */

  if (categoriesNo) {

    question2Numbers.classList.remove("hidden");

    question2Categories.classList.add("hidden");

  }

}


/* =========================================
   QUESTION 2A
   CATEGORIES HAVE ORDER?
   ========================================= */

function handleRanking() {

  const rankingYes =
    document.getElementById("rankingYes").checked;

  const rankingNo =
    document.getElementById("rankingNo").checked;


  /*
    Categories with meaningful order
    = ORDINAL
  */

  if (rankingYes) {

    showResult(
      "Ordinal",
      "This variable is measured at the ordinal level. The values represent distinct categories that have a meaningful order or ranking, but the exact distance between categories is not necessarily equal."
    );

  }


  /*
    Categories without meaningful order
    = NOMINAL
  */

  if (rankingNo) {

    showResult(
      "Nominal",
      "This variable is measured at the nominal level. The values represent distinct categories or labels, but the categories do not have a meaningful order or ranking."
    );

  }

}


/* =========================================
   QUESTION 2B
   MEANINGFUL ZERO?
   ========================================= */

function handleZero() {

  const zeroYes =
    document.getElementById("zeroYes").checked;

  const zeroNo =
    document.getElementById("zeroNo").checked;


  /*
    Meaningful zero
    = RATIO
  */

  if (zeroYes) {

    showResult(
      "Ratio",
      "This variable is measured at the ratio level. The values have equal intervals, and zero represents the complete absence of the quantity being measured. This allows meaningful ratio comparisons."
    );

  }


  /*
    No meaningful zero
    = INTERVAL
  */

  if (zeroNo) {

    showResult(
      "Interval",
      "This variable is measured at the interval level. The values have meaningful and equal intervals, but zero does not represent the complete absence of the quantity being measured."
    );

  }

}


/* =========================================
   SHOW RESULT
   ========================================= */

function showResult(title, descriptionText) {

  const resultPanel =
    document.getElementById("resultPanel");

  const result =
    document.getElementById("result");

  const description =
    document.getElementById("resultDescription");


  /*
    Insert result.
  */

  result.textContent = title;

  description.textContent = descriptionText;


  /*
    Show result panel.
  */

  resultPanel.style.display = "block";


  /*
    Show reset button.
  */

  document
    .getElementById("resetButton")
    .style.display = "block";


  /*
    Scroll to result.
  */

  setTimeout(function() {

    resultPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }, 100);

}


/* =========================================
   RESET SELECTOR
   ========================================= */

function resetSelector() {


  /*
    Clear all selections.
  */

  document
    .querySelectorAll('input[type="radio"]')
    .forEach(function(input) {

      input.checked = false;

    });


  /*
    Hide both Question 2 pathways.
  */

  document
    .getElementById("question2Categories")
    .classList.add("hidden");

  document
    .getElementById("question2Numbers")
    .classList.add("hidden");


  /*
    Hide result.
  */

  document
    .getElementById("resultPanel")
    .style.display = "none";


  /*
    Hide reset button.
  */

  document
    .getElementById("resetButton")
    .style.display = "none";


  /*
    Return to top.
  */

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

</script>

</body>
</html>
