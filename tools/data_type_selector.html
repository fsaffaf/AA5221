<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit of Measurement to Level of Measurement Converter</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #f4f6f9;
  color: #222222;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

/* =========================================
   MAIN LAYOUT
   ========================================= */

.measurement-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  box-sizing: border-box;
}

.glass {
  width: 100%;
  max-width: 800px;
  padding: 2.5rem;
  box-sizing: border-box;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
}

/* =========================================
   TITLE AND DESCRIPTION
   ========================================= */

.glass h2 {
  margin: 0 0 0.75rem;
  text-align: center;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1.2;
  color: #0e68b3;
}

.glass > p {
  margin: 0 0 2rem;
  text-align: center;
  color: #444444;
  font-size: 1rem;
  line-height: 1.8;
}

/* =========================================
   CONVERTER LAYOUT
   ========================================= */

.converter-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1.25rem;
  align-items: stretch;
}

/* =========================================
   INPUT AND OUTPUT PANELS
   ========================================= */

.converter-panel {
  min-width: 0;
  padding: 1.5rem;
  box-sizing: border-box;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  background: #ffffff;
}

.converter-panel.output-panel {
  background: #f0f7fc;
  border-color: #b9d8ef;
}

.panel-title {
  margin: 0 0 1rem;
  color: #0e68b3;
  font-size: 1.05rem;
  font-weight: 650;
  line-height: 1.5;
}

/* =========================================
   DROPDOWN
   ========================================= */

.input-group label {
  display: block;
  margin-bottom: 0.6rem;
  color: #333333;
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.5;
}

.input-group select {
  display: block;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 0.9rem;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  background: #ffffff;
  color: #222222;
  font-family: inherit;
  font-size: 1rem;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s ease,
              box-shadow 0.2s ease;
}

.input-group select:focus {
  border-color: #0e68b3;
  box-shadow: 0 0 0 3px rgba(14, 104, 179, 0.12);
}

.helper-text {
  margin: 0.75rem 0 0;
  color: #555555;
  font-size: 0.85rem;
  line-height: 1.6;
}

/* =========================================
   NUMERICAL ANSWER
   ========================================= */

.answer-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 150px;
  text-align: center;
}

.answer-label {
  margin-bottom: 0.5rem;
  color: #444444;
  font-size: 0.9rem;
  line-height: 1.5;
}

.answer-number {
  color: #0e68b3;
  font-size: clamp(3rem, 7vw, 4.5rem);
  font-weight: 650;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.answer-description {
  margin: 0.75rem 0 0;
  color: #555555;
  font-size: 0.9rem;
  line-height: 1.6;
}

.answer-placeholder {
  color: #7a8794;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
}

/* =========================================
   RESET BUTTON
   ========================================= */

.reset-btn {
  display: block;
  width: 100%;
  margin-top: 1.5rem;
  padding: 0.9rem 1rem;
  box-sizing: border-box;
  border: 1px solid #0e68b3;
  border-radius: 999px;
  background: #0e68b3;
  color: #ffffff;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.2s ease,
              border-color 0.2s ease,
              transform 0.2s ease;
}

.reset-btn:hover {
  background: #2b6cb0;
  border-color: #2b6cb0;
  transform: translateY(-1px);
}

.reset-btn:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

/* =========================================
   ANIMATION
   ========================================= */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.answer-area.updated {
  animation: fadeIn 0.25s ease;
}

/* =========================================
   TABLET AND MOBILE
   ========================================= */

@media (max-width: 600px) {
  .measurement-wrapper {
    padding: 1rem;
    align-items: flex-start;
  }

  .glass {
    padding: 1.25rem;
  }

  .converter-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
  }

  .converter-panel {
    padding: 1.25rem;
  }

  .answer-area {
    min-height: 120px;
  }
}
</style>
</head>

<body>

<div class="measurement-wrapper">

  <main class="glass">

    <h2>Unit of Measurement to Level of Measurement Converter</h2>

    <p>
      Select an option from the dropdown menu to display its corresponding
      numerical answer.
    </p>

    <div class="converter-grid">

      <!-- ========================================= -->
      <!-- LEFT: DROPDOWN -->
      <!-- ========================================= -->

      <section class="converter-panel">

        <h3 class="panel-title">Select an Option</h3>

        <div class="input-group">

          <label for="letterSelect">
            Choose a letter
          </label>

          <select
            id="letterSelect"
            onchange="updateAnswer()"
          >

            <option value="">Select a letter...</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="G">G</option>
            <option value="H">H</option>
            <option value="I">I</option>
            <option value="J">J</option>
            <option value="K">K</option>
            <option value="L">L</option>
            <option value="M">M</option>
            <option value="N">N</option>
            <option value="O">O</option>
            <option value="P">P</option>
            <option value="Q">Q</option>
            <option value="R">R</option>
            <option value="S">S</option>
            <option value="T">T</option>
            <option value="U">U</option>
            <option value="V">V</option>
            <option value="W">W</option>
            <option value="X">X</option>
            <option value="Y">Y</option>
            <option value="Z">Z</option>

          </select>

        </div>

        <p class="helper-text">
          Choose a letter to see its assigned numerical answer.
        </p>

        <button
          type="button"
          class="reset-btn"
          onclick="resetConverter()"
        >
          Reset
        </button>

      </section>

      <!-- ========================================= -->
      <!-- RIGHT: NUMERICAL ANSWER -->
      <!-- ========================================= -->

      <section
        class="converter-panel output-panel"
        aria-live="polite"
        aria-atomic="true"
      >

        <h3 class="panel-title">Numerical Answer</h3>

        <div class="answer-area" id="answerArea">

          <div class="answer-label">
            Your answer will appear here
          </div>

          <div
            class="answer-number answer-placeholder"
            id="answerNumber"
          >
            —
          </div>

          <p
            class="answer-description"
            id="answerDescription"
          >
            Select a letter to begin.
          </p>

        </div>

      </section>

    </div>

  </main>

</div>

<script>

/* =========================================
   ANSWER KEY
   ========================================= */

/*
   PLACEHOLDER ANSWERS

   Replace these numerical values with your own answers.

   Example:
   A: 1
   B: 2
   C: 3

   You can also change individual values independently.
*/

const answerKey = {
  A: 1,
  B: 2,
  C: 3,
  D: 4,
  E: 5,
  F: 6,
  G: 7,
  H: 8,
  I: 9,
  J: 10,
  K: 11,
  L: 12,
  M: 13,
  N: 14,
  O: 15,
  P: 16,
  Q: 17,
  R: 18,
  S: 19,
  T: 20,
  U: 21,
  V: 22,
  W: 23,
  X: 24,
  Y: 25,
  Z: 26
};


/* =========================================
   UPDATE THE ANSWER
   ========================================= */

function updateAnswer() {

  const selectedLetter =
    document.getElementById("letterSelect").value;

  const answerNumber =
    document.getElementById("answerNumber");

  const answerDescription =
    document.getElementById("answerDescription");

  const answerArea =
    document.getElementById("answerArea");


  /* NO SELECTION */

  if (!selectedLetter) {

    answerNumber.textContent = "—";

    answerNumber.classList.add("answer-placeholder");

    answerDescription.textContent =
      "Select a letter to begin.";

    return;

  }


  /* DISPLAY THE ASSIGNED NUMBER */

  answerNumber.textContent =
    answerKey[selectedLetter];

  answerNumber.classList.remove("answer-placeholder");

  answerDescription.textContent =
    "Selected option: " + selectedLetter;


  /* REPLAY THE ANIMATION */

  answerArea.classList.remove("updated");

  void answerArea.offsetWidth;

  answerArea.classList.add("updated");

}


/* =========================================
   RESET THE CONVERTER
   ========================================= */

function resetConverter() {

  document.getElementById("letterSelect").value = "";

  updateAnswer();

}

</script>

</body>
</html>
