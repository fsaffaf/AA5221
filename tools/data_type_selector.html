<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level of Measurement Converter</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #f4f6f9;
  color: #222222;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

.measurement-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  box-sizing: border-box;
}

.glass {
  width: 100%;
  max-width: 900px;
  padding: 2.5rem;
  box-sizing: border-box;
  background: #ffffff;
  border: 1px solid #d9e2ec;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
}

.glass h2 {
  margin: 0 0 0.75rem;
  text-align: center;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1.2;
  color: #0e68b3;
}

.glass > p {
  margin: 0 0 2rem;
  text-align: center;
  color: #444444;
  font-size: 1rem;
  line-height: 1.8;
}

.converter-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1.25rem;
  align-items: stretch;
}

.converter-panel {
  min-width: 0;
  padding: 1.5rem;
  box-sizing: border-box;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  background: #ffffff;
}

.converter-panel.output-panel {
  background: #f0f7fc;
  border-color: #b9d8ef;
}

.panel-title {
  margin: 0 0 1rem;
  color: #0e68b3;
  font-size: 1.05rem;
  font-weight: 650;
  line-height: 1.5;
}

.input-group label {
  display: block;
  margin-bottom: 0.6rem;
  color: #333333;
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.5;
}

.input-group select {
  display: block;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 0.9rem;
  border: 1px solid #d9e2ec;
  border-radius: 12px;
  background: #ffffff;
  color: #222222;
  font-family: inherit;
  font-size: 1rem;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s ease,
              box-shadow 0.2s ease;
}

.input-group select:focus {
  border-color: #0e68b3;
  box-shadow: 0 0 0 3px rgba(14, 104, 179, 0.12);
}

.helper-text {
  margin: 0.75rem 0 0;
  color: #555555;
  font-size: 0.85rem;
  line-height: 1.6;
}

.answer-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 150px;
  text-align: center;
}

.answer-label {
  margin-bottom: 0.5rem;
  color: #444444;
  font-size: 0.9rem;
  line-height: 1.5;
}

.answer-number {
  color: #0e68b3;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 650;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.answer-description {
  margin: 0.75rem 0 0;
  color: #555555;
  font-size: 0.9rem;
  line-height: 1.6;
}

.answer-placeholder {
  color: #7a8794;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
}

.reset-btn {
  display: block;
  width: 100%;
  margin-top: 1.5rem;
  padding: 0.9rem 1rem;
  box-sizing: border-box;
  border: 1px solid #0e68b3;
  border-radius: 999px;
  background: #0e68b3;
  color: #ffffff;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.2s ease,
              border-color 0.2s ease,
              transform 0.2s ease;
}

.reset-btn:hover {
  background: #2b6cb0;
  border-color: #2b6cb0;
  transform: translateY(-1px);
}

.reset-btn:focus-visible {
  outline: 3px solid rgba(14, 104, 179, 0.3);
  outline-offset: 3px;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.answer-area.updated {
  animation: fadeIn 0.25s ease;
}

@media (max-width: 600px) {
  .measurement-wrapper {
    padding: 1rem;
    align-items: flex-start;
  }

  .glass {
    padding: 1.25rem;
  }

  .converter-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
  }

  .converter-panel {
    padding: 1.25rem;
  }

  .answer-area {
    min-height: 120px;
  }
}
</style>
</head>

<body>

<div class="measurement-wrapper">
  <main class="glass">

    <h2>Level of Measurement Converter</h2>

    <p>
      Select a variable from the dropdown menu to identify its
      level of measurement.
    </p>

    <div class="converter-grid">

      <!-- LEFT: VARIABLE DROPDOWN -->

      <section class="converter-panel">

        <h3 class="panel-title">Select a Variable</h3>

        <div class="input-group">
          <select id="variableSelect" onchange="updateAnswer()">
            <option value="">Select a variable...</option>
            <option value="ACT_Score">ACT Score</option>
            <option value="Age">Age</option>
            <option value="Agreement_Level">Agreement Level</option>
            <option value="Blood_Type">Blood Type</option>
            <option value="Calendar_Year">Calendar Year</option>
            <option value="City">City</option>
            <option value="Class_Rank">Class Rank</option>
            <option value="Country">Country</option>
            <option value="Days">Days</option>
            <option value="Department">Department</option>
            <option value="Distance">Distance</option>
            <option value="Education_Level">Education Level</option>
            <option value="Employee_ID">Employee ID</option>
            <option value="Employment_Status">Employment Status</option>
            <option value="Ethnicity">Ethnicity</option>
            <option value="Elevation_Above_Sea_Level">Elevation Above Sea Level</option>
            <option value="Expenses">Expenses</option>
            <option value="Eye_Color">Eye Color</option>
            <option value="Frequency_Category">Frequency Category</option>
            <option value="Gender">Gender</option>
            <option value="Hair_Color">Hair Color</option>
            <option value="Height">Height</option>
            <option value="Hours">Hours</option>
            <option value="Hours_Worked">Hours Worked</option>
            <option value="Income">Income</option>
            <option value="Income_Bracket">Income Bracket</option>
            <option value="IQ_Score">IQ Score</option>
            <option value="Job_Title">Job Title</option>
            <option value="Letter_Grade">Letter Grade</option>
            <option value="Major">Major</option>
            <option value="Marital_Status">Marital Status</option>
            <option value="Minutes">Minutes</option>
            <option value="Months">Months (Elapsed Time)</option>
            <option value="Nationality">Nationality</option>
            <option value="Number_of_Absences">Number of Absences</option>
            <option value="Number_of_Children">Number of Children</option>
            <option value="Number_of_Courses">Number of Courses</option>
            <option value="Number_of_Employees">Number of Employees</option>
            <option value="Number_of_Students">Number of Students</option>
            <option value="Pain_Level">Pain Level</option>
            <option value="Performance_Rating">Performance Rating</option>
            <option value="Political_Party">Political Party</option>
            <option value="Priority_Level">Priority Level</option>
            <option value="Product_Category">Product Category</option>
            <option value="Race">Race</option>
            <option value="Religion">Religion</option>
            <option value="Revenue">Revenue</option>
            <option value="Research_Group">Research Group</option>
            <option value="Risk_Level">Risk Level</option>
            <option value="SAT_Score">SAT Score</option>
            <option value="Salary">Salary</option>
            <option value="Satisfaction_Level">Satisfaction Level</option>
            <option value="School">School</option>
            <option value="Seconds">Seconds</option>
            <option value="Socioeconomic_Status">Socioeconomic Status</option>
            <option value="Standardized_Test_Score">Standardized Test Score</option>
            <option value="State">State</option>
            <option value="Stress_Level">Stress Level</option>
            <option value="Student_ID">Student ID</option>
            <option value="Survey_Response_Rating">Survey Response Rating</option>
            <option value="T_Score">T Score</option>
            <option value="Temperature_Celsius">Temperature (Celsius)</option>
            <option value="Temperature_Fahrenheit">Temperature (Fahrenheit)</option>
            <option value="TShirt_Size">T-shirt Size</option>
            <option value="Tuition">Tuition</option>
            <option value="University">University</option>
            <option value="Weeks">Weeks (Elapsed Time)</option>
            <option value="Weight">Weight</option>
            <option value="Years">Years (Elapsed Time)</option>
            <option value="Years_of_Experience">Years of Experience</option>
            <option value="Yes_No">Yes/No Response</option>
            <option value="Z_Score">Z Score</option>
          </select>
        </div>

        <button
          type="button"
          class="reset-btn"
          onclick="resetConverter()">
          Reset
        </button>

      </section>

      <!-- RIGHT: ANSWER -->

      <section
        class="converter-panel output-panel"
        aria-live="polite"
        aria-atomic="true">

        <h3 class="panel-title">Level of Measurement</h3>

        <div class="answer-area" id="answerArea">

          <div class="answer-label" id="answerLabel">
            Your answer will appear here
          </div>

          <div
            class="answer-number answer-placeholder"
            id="answerNumber">
            —
          </div>

          <p class="answer-description" id="answerDescription">
            Select a variable to begin.
          </p>

        </div>

      </section>

    </div>
  </main>
</div>

<script>
const answerKey = {
  // Ratio
  Seconds: "Ratio",
  Minutes: "Ratio",
  Hours: "Ratio",
  Days: "Ratio",
  Weeks: "Ratio",
  Months: "Ratio",
  Years: "Ratio",
  Age: "Ratio",
  Income: "Ratio",
  Salary: "Ratio",
  Height: "Ratio",
  Weight: "Ratio",
  Distance: "Ratio",
  Number_of_Children: "Ratio",
  Number_of_Employees: "Ratio",
  Number_of_Courses: "Ratio",
  Number_of_Absences: "Ratio",
  Tuition: "Ratio",
  Expenses: "Ratio",
  Revenue: "Ratio",
  Hours_Worked: "Ratio",
  Years_of_Experience: "Ratio",
  Number_of_Students: "Ratio",

  // Nominal
  Gender: "Nominal",
  Race: "Nominal",
  Ethnicity: "Nominal",
  Nationality: "Nominal",
  Religion: "Nominal",
  Political_Party: "Nominal",
  Marital_Status: "Nominal",
  Employment_Status: "Nominal",
  Department: "Nominal",
  Major: "Nominal",
  Job_Title: "Nominal",
  School: "Nominal",
  University: "Nominal",
  Country: "Nominal",
  State: "Nominal",
  City: "Nominal",
  Eye_Color: "Nominal",
  Hair_Color: "Nominal",
  Blood_Type: "Nominal",
  Yes_No: "Nominal",
  Student_ID: "Nominal",
  Employee_ID: "Nominal",
  Product_Category: "Nominal",
  Research_Group: "Nominal",

  // Ordinal
  Satisfaction_Level: "Ordinal",
  Agreement_Level: "Ordinal",
  Education_Level: "Ordinal",
  Class_Rank: "Ordinal",
  Letter_Grade: "Ordinal",
  Performance_Rating: "Ordinal",
  Pain_Level: "Ordinal",
  Stress_Level: "Ordinal",
  Income_Bracket: "Ordinal",
  Socioeconomic_Status: "Ordinal",
  Frequency_Category: "Ordinal",
  Risk_Level: "Ordinal",
  Priority_Level: "Ordinal",
  TShirt_Size: "Ordinal",
  Survey_Response_Rating: "Ordinal",

  // Interval
  Temperature_Celsius: "Interval",
  Temperature_Fahrenheit: "Interval",
  Calendar_Year: "Interval",
  IQ_Score: "Interval",
  Standardized_Test_Score: "Interval",
  SAT_Score: "Interval",
  ACT_Score: "Interval",
  Z_Score: "Interval",
  T_Score: "Interval",
  Elevation_Above_Sea_Level: "Interval"
};

function updateAnswer() {
  const selectedVariable =
    document.getElementById("variableSelect").value;

  const answerNumber =
    document.getElementById("answerNumber");

  const answerDescription =
    document.getElementById("answerDescription");

  const answerLabel =
    document.getElementById("answerLabel");

  const answerArea =
    document.getElementById("answerArea");

  if (!selectedVariable) {
    answerNumber.textContent = "—";
    answerNumber.classList.add("answer-placeholder");

    answerLabel.textContent = "Your answer will appear here";
    answerDescription.textContent = "Select a variable to begin.";

    answerArea.classList.remove("updated");
    return;
  }

  const level = answerKey[selectedVariable];

  if (!level) {
    answerNumber.textContent = "Not found";
    answerNumber.classList.add("answer-placeholder");
    answerLabel.textContent = "Unable to identify level";
    answerDescription.textContent =
      "This variable is not listed in the answer key.";
    return;
  }

  answerNumber.textContent = level;
  answerNumber.classList.remove("answer-placeholder");

  answerLabel.textContent = "";
  answerDescription.textContent = "";

  answerArea.classList.remove("updated");
  void answerArea.offsetWidth;
  answerArea.classList.add("updated");
}

function resetConverter() {
  document.getElementById("variableSelect").value = "";
  updateAnswer();
}
</script>

</body>
</html>
