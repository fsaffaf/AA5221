<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Course Image Library</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f5f7fa;
}

h1{
    color:#003366;
}

.toolbar{
    margin-bottom:20px;
}

input{
    padding:8px;
    margin:5px;
}

button{
    padding:8px 12px;
    background:#003366;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:6px;
}

.category{
    color:#003366;
    font-size:12px;
    font-weight:bold;
    margin-top:5px;
}
</style>
</head>

<body>

<h1>Course Image Library</h1>

<div class="toolbar">

<input id="title" placeholder="Image Title">

<input id="category"
placeholder="Category">

<input id="url"
placeholder="OneDrive Image URL"
style="width:350px;">

<button onclick="addImage()">
Add Image
</button>

</div>

<div id="gallery" class="gallery"></div>

<script>

let images =
JSON.parse(localStorage.getItem("courseImages"))
|| [];

function saveImages(){
    localStorage.setItem(
        "courseImages",
        JSON.stringify(images)
    );
}

function addImage(){

    const title =
    document.getElementById("title").value;

    const category =
    document.getElementById("category").value;

    const url =
    document.getElementById("url").value;

    if(!title || !url){
        alert("Enter title and URL");
        return;
    }

    images.push({
        title,
        category,
        url
    });

    saveImages();
    renderGallery();

    document.getElementById("title").value="";
    document.getElementById("category").value="";
    document.getElementById("url").value="";
}

function renderGallery(){

    const gallery =
    document.getElementById("gallery");

    gallery.innerHTML="";

    images.forEach(img=>{

        gallery.innerHTML += `
            <div class="card">
                <img src="${img.url}">
                <h3>${img.title}</h3>
                <div class="category">
                    ${img.category}
                </div>
            </div>
        `;
    });
}

renderGallery();

</script>

</body>
</html>
