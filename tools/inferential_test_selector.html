<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Inferential Test Selector</title>

<style>

/* =========================================
   GENERAL
   ========================================= */

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #020617;
  color: white;
}

body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    radial-gradient(circle at top, rgba(125,211,252,0.16), transparent 35%),
    radial-gradient(circle at bottom, rgba(99,102,241,0.14), transparent 40%);

  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;

  opacity: 0.3;

  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

  background-size: 42px 42px;

  z-index: -1;
}


/* =========================================
   MAIN LAYOUT
   ========================================= */

.measurement-wrapper {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 2rem;
}

.glass {
  width: 100%;
  max-width: 1000px;

  padding: 2.5rem;

  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.15);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  border-radius: 24px;

  box-shadow: 0 25px 80px rgba(0,0,0,0.45);
}

.glass h2 {
  margin: 0 0 0.75rem;

  text-align: center;

  font-size: clamp(2rem, 5vw, 3.25rem);

  font-weight: 650;

  letter-spacing: -0.03em;

  color: white;
}

.glass > p {
  margin: 0 0 2rem;

  text-align: center;

  color: rgb(203,213,225);

  font-size: 1.05rem;

  line-height: 1.6;
}


/* =========================================
   QUESTION ROWS
   ========================================= */

.question-row {
  margin-bottom: 1.5rem;

  animation: fadeIn 0.3s ease;
}

.question-row.hidden {
  display: none;
}

.question-title {
  margin-bottom: 0.75rem;

  font-size: 1.05rem;

  font-weight: 650;

  color: white;
}

.question-number {
  color: rgb(125,211,252);

  margin-right: 0.4rem;
}


/* =========================================
   OPTIONS
   ========================================= */

.feature-list {
  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 1rem;
}


/* Question 1: three options side-by-side */

#question1 .feature-list {
  grid-template-columns: repeat(3, 1fr);
}


.feature-option {
  display: flex;

  align-items: flex-start;

  gap: 0.85rem;

  padding: 1rem 1.15rem;

  border-radius: 16px;

  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.12);

  color: rgb(241,245,249);

  cursor: pointer;

  transition: 0.25s ease;
}

.feature-option:hover {
  background: rgba(255,255,255,0.13);

  transform: translateY(-1px);
}

.feature-option input {
  width: 1.1rem;

  height: 1.1rem;

  margin-top: 0.2rem;

  flex-shrink: 0;

  accent-color: #38bdf8;

  cursor: pointer;
}

.feature-title {
  font-weight: 600;

  color: white;
}

.feature-subtitle {
  font-size: 0.85rem;

  color: rgb(203,213,225);

  margin-top: 6px;

  display: block;

  line-height: 1.5;
}


/* =========================================
   RESULT PANEL
   ========================================= */

.result-panel {
  display: none;

  margin-top: 2rem;

  padding: 1.75rem;

  border-radius: 20px;

  border: 1px solid rgba(125,211,252,0.30);

  background: linear-gradient(
    135deg,
    rgba(3,105,161,0.70),
    rgba(49,46,129,0.80)
  );

  box-shadow: 0 20px 50px rgba(0,0,0,0.35);

  animation: fadeIn 0.3s ease;
}

.result-label {
  font-size: 0.78rem;

  text-transform: uppercase;

  letter-spacing: 0.22em;

  color: rgb(203,213,225);

  margin-bottom: 0.4rem;
}

.result-title {
  margin: 0;

  font-size: clamp(1.5rem, 4vw, 2rem);

  font-weight: 650;

  color: white;
}

.result-description {
  margin-top: 0.75rem;

  color: rgb(226,232,240);

  line-height: 1.6;
}


/* =========================================
   RESET BUTTON
   ========================================= */

.reset-button {
  display: none;

  width: 100%;

  margin-top: 1rem;

  border: 1px solid rgba(255,255,255,0.18);

  border-radius: 16px;

  padding: 0.9rem 1.25rem;

  background: rgba(255,255,255,0.10);

  color: white;

  font-family: inherit;

  font-size: 1rem;

  font-weight: 600;

  cursor: pointer;

  transition: 0.25s ease;
}

.reset-button:hover {
  background: rgba(255,255,255,0.18);

  transform: translateY(-1px);
}


/* =========================================
   ANIMATION
   ========================================= */

@keyframes fadeIn {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 700px) {

  .measurement-wrapper {
    padding: 1rem;
  }

  .glass {
    padding: 1.5rem;
  }

  .feature-list,
  #question1 .feature-list {
    grid-template-columns: 1fr;
  }

}

</style>
</head>


<body>

<div class="measurement-wrapper">

  <div class="glass">

    <h2>Inferential Test Selector</h2>

    <p>
      Answer each question to identify the most appropriate inferential statistical test.
    </p>


    <!-- ========================================= -->
    <!-- QUESTION 1 -->
    <!-- ========================================= -->

    <div class="question-row" id="question1">

      <div class="question-title">

        <span class="question-number">1.</span>

        What level of measurement is the data?

      </div>


      <div class="feature-list">


        <!-- CATEGORICAL ONLY -->

        <label class="feature-option">

          <input
            type="radio"
            name="measurement"
            id="categorical"
            onchange="selectMeasurement('categorical')"
          >

          <span>

            <span class="feature-title">
              Categorical only
            </span>

            <span class="feature-subtitle">
              Example 1: Is there an association between type of drink
              purchased (coffee or tea) and season (winter or summer)?
              <br><br>
              Example 2: Were the distributions of book genres
              (true crime, romance, non-fiction, other) the same
              as last year?
            </span>

          </span>

        </label>


        <!-- CATEGORICAL + CONTINUOUS -->

        <label class="feature-option">

          <input
            type="radio"
            name="measurement"
            id="catCont"
            onchange="selectMeasurement('cat_cont')"
          >

          <span>

            <span class="feature-title">
              Categorical + Continuous
            </span>

            <span class="feature-subtitle">
              Example: Is there a difference in weight (kilograms)
              based on type of diet (Diet A vs Diet B)?
            </span>

          </span>

        </label>


        <!-- CONTINUOUS ONLY -->

        <label class="feature-option">

          <input
            type="radio"
            name="measurement"
            id="continuous"
            onchange="selectMeasurement('continuous')"
          >

          <span>

            <span class="feature-title">
              Continuous only
            </span>

            <span class="feature-subtitle">
              Example: Is there a relationship between phone use
              (hours) and sleep (hours)?
            </span>

          </span>

        </label>


      </div>

    </div>


    <!-- ========================================= -->
    <!-- QUESTION 2 -->
    <!-- ========================================= -->

    <div
      class="question-row hidden"
      id="question2"
    >

      <div class="question-title">

        <span class="question-number">2.</span>

        <span id="question2Text">
          Question 2
        </span>

      </div>


      <div
        class="feature-list"
        id="question2Options"
      >
      </div>

    </div>


    <!-- ========================================= -->
    <!-- QUESTION 3 -->
    <!-- ========================================= -->

    <div
      class="question-row hidden"
      id="question3"
    >

      <div class="question-title">

        <span class="question-number">3.</span>

        Is the research between or within subjects?

      </div>


      <div class="feature-list">


        <!-- BETWEEN -->

        <label class="feature-option">

          <input
            type="radio"
            name="design"
            onchange="selectDesign('between')"
          >

          <span>

            <span class="feature-title">
              Between subjects
            </span>

            <span class="feature-subtitle">
              Different participants are in each group.
              <br><br>
              Example: Compare stress scores between a
              treatment group and a control group.
            </span>

          </span>

        </label>


        <!-- WITHIN -->

        <label class="feature-option">

          <input
            type="radio"
            name="design"
            onchange="selectDesign('within')"
          >

          <span>

            <span class="feature-title">
              Within subjects
            </span>

            <span class="feature-subtitle">
              The same participants are measured in multiple
              conditions or at multiple time points.
              <br><br>
              Example: Compare stress scores before and after
              an intervention.
            </span>

          </span>

        </label>


      </div>

    </div>


    <!-- ========================================= -->
    <!-- RESULT -->
    <!-- ========================================= -->

    <div
      id="resultPanel"
      class="result-panel"
    >

      <div class="result-label">
        Inferential Test
      </div>


      <h3
        id="result"
        class="result-title"
      ></h3>


      <div
        id="resultDescription"
        class="result-description"
      ></div>

    </div>


    <!-- ========================================= -->
    <!-- RESET -->
    <!-- ========================================= -->

    <button
      id="resetButton"
      class="reset-button"
      onclick="resetSelector()"
    >
      Start Over
    </button>


  </div>

</div>


<script>

/* =========================================
   TRACK USER SELECTIONS
   ========================================= */

let state = {

  measurement: null,

  variableCount: null,

  normality: null,

  design: null

};


/* =========================================
   QUESTION 1
   MEASUREMENT LEVEL
   ========================================= */

function selectMeasurement(value) {

  state.measurement = value;

  state.variableCount = null;

  state.normality = null;

  state.design = null;


  /*
    Hide result.
  */

  document
    .getElementById("resultPanel")
    .style.display = "none";

  document
    .getElementById("resetButton")
    .style.display = "none";


  /*
    Hide Question 3.
  */

  document
    .getElementById("question3")
    .classList.add("hidden");


  /*
    Show Question 2.
  */

  const question2 =
    document.getElementById("question2");

  const question2Text =
    document.getElementById("question2Text");

  const question2Options =
    document.getElementById("question2Options");


  question2.classList.remove("hidden");


  /* =========================================
     CATEGORICAL ONLY
     ========================================= */

  if (value === "categorical") {

    question2Text.textContent =
      "How many categorical variables are there?";


    question2Options.innerHTML = `

      <!-- ONE VARIABLE -->

      <label class="feature-option">

        <input
          type="radio"
          name="variableCount"
          onchange="selectVariableCount('one')"
        >

        <span>

          <span class="feature-title">
            One
          </span>

          <span class="feature-subtitle">
            You have one categorical variable and are comparing
            observed frequencies to expected frequencies.
            <br><br>
            Example: Are the observed frequencies of book genres
            different from what would be expected?
          </span>

        </span>

      </label>


      <!-- TWO VARIABLES -->

      <label class="feature-option">

        <input
          type="radio"
          name="variableCount"
          onchange="selectVariableCount('two')"
        >

        <span>

          <span class="feature-title">
            Two
          </span>

          <span class="feature-subtitle">
            You have two categorical variables and are examining
            whether they are associated.
            <br><br>
            Example: Is type of drink associated with season?
          </span>

        </span>

      </label>

    `;

  }


  /* =========================================
     CATEGORICAL + CONTINUOUS
     ========================================= */

  if (value === "cat_cont") {

    question2Text.textContent =
      "How is the continuous data distributed?";


    question2Options.innerHTML = `

      <!-- NORMAL -->

      <label class="feature-option">

        <input
          type="radio"
          name="normality"
          onchange="selectNormality('normal')"
        >

        <span>

          <span class="feature-title">
            Normal
          </span>

          <span class="feature-subtitle">
            The continuous outcome is approximately normally
            distributed.
          </span>

        </span>

      </label>


      <!-- NOT NORMAL -->

      <label class="feature-option">

        <input
          type="radio"
          name="normality"
          onchange="selectNormality('not_normal')"
        >

        <span>

          <span class="feature-title">
            Not normal
          </span>

          <span class="feature-subtitle">
            The continuous outcome is not approximately
            normally distributed.
          </span>

        </span>

      </label>

    `;

  }


  /* =========================================
     CONTINUOUS ONLY
     ========================================= */

  if (value === "continuous") {

    question2Text.textContent =
      "How is the data distributed?";


    question2Options.innerHTML = `

      <!-- NORMAL -->

      <label class="feature-option">

        <input
          type="radio"
          name="normality"
          onchange="selectNormality('normal')"
        >

        <span>

          <span class="feature-title">
            Normal
          </span>

          <span class="feature-subtitle">
            The continuous data are approximately normally
            distributed.
          </span>

        </span>

      </label>


      <!-- NOT NORMAL -->

      <label class="feature-option">

        <input
          type="radio"
          name="normality"
          onchange="selectNormality('not_normal')"
        >

        <span>

          <span class="feature-title">
            Not normal
          </span>

          <span class="feature-subtitle">
            The continuous data are not approximately
            normally distributed.
          </span>

        </span>

      </label>

    `;

  }


  /*
    Scroll to Question 2.
  */

  setTimeout(function() {

    question2.scrollIntoView({

      behavior: "smooth",

      block: "nearest"

    });

  }, 100);

}


/* =========================================
   CATEGORICAL VARIABLE COUNT
   ========================================= */

function selectVariableCount(value) {

  state.variableCount = value;


  /*
    Hide any previous result.
  */

  document
    .getElementById("resultPanel")
    .style.display = "none";

  document
    .getElementById("resetButton")
    .style.display = "none";


  /*
    ONE CATEGORICAL VARIABLE
    = CHI-SQUARE GOODNESS OF FIT
  */

  if (value === "one") {

    showResult(
      "Chi-Square Goodness-of-Fit Test",
      "Use this test when you have one categorical variable and want to compare the observed frequencies with expected frequencies."
    );

    return;

  }


  /*
    TWO CATEGORICAL VARIABLES
    = CHI-SQUARE TEST OF INDEPENDENCE
  */

  if (value === "two") {

    showResult(
      "Chi-Square Test of Independence",
      "Use this test when you have two categorical variables and want to determine whether they are statistically associated."
    );

    return;

  }

}


/* =========================================
   QUESTION 2
   NORMALITY
   ========================================= */

function selectNormality(value) {

  state.normality = value;


  /*
    CONTINUOUS ONLY
    Goes directly to result.
  */

  if (state.measurement === "continuous") {

    showContinuousResult();

    return;

  }


  /*
    CATEGORICAL + CONTINUOUS
    Goes to Question 3.
  */

  if (state.measurement === "cat_cont") {

    const question3 =
      document.getElementById("question3");


    question3.classList.remove("hidden");


    /*
      Hide any previous result.
    */

    document
      .getElementById("resultPanel")
      .style.display = "none";

    document
      .getElementById("resetButton")
      .style.display = "none";


    /*
      Scroll to Question 3.
    */

    setTimeout(function() {

      question3.scrollIntoView({

        behavior: "smooth",

        block: "nearest"

      });

    }, 100);

  }

}


/* =========================================
   QUESTION 3
   BETWEEN OR WITHIN
   ========================================= */

function selectDesign(value) {

  state.design = value;

  showCatContResult();

}


/* =========================================
   CONTINUOUS-ONLY RESULT
   ========================================= */

function showContinuousResult() {

  if (state.normality === "normal") {

    showResult(
      "Pearson Correlation",
      "Use Pearson correlation to examine the strength and direction of the linear relationship between two continuous variables when the relevant assumptions are met."
    );

  }


  if (state.normality === "not_normal") {

    showResult(
      "Spearman Correlation",
      "Use Spearman correlation to examine the strength and direction of an association between two variables when the assumptions for Pearson correlation are not met."
    );

  }

}


/* =========================================
   CATEGORICAL + CONTINUOUS RESULT
   ========================================= */

function showCatContResult() {

  /*
    BETWEEN SUBJECTS
  */

  if (
    state.design === "between" &&
    state.normality === "normal"
  ) {

    showResult(
      "Independent Samples t-test",
      "Use this test to compare the means of a continuous outcome between two independent groups when the outcome is approximately normally distributed."
    );

  }


  if (
    state.design === "between" &&
    state.normality === "not_normal"
  ) {

    showResult(
      "Mann-Whitney U Test",
      "Use this nonparametric test to compare two independent groups when the continuous outcome does not meet the normality assumption."
    );

  }


  /*
    WITHIN SUBJECTS
  */

  if (
    state.design === "within" &&
    state.normality === "normal"
  ) {

    showResult(
      "Dependent Samples t-test",
      "Use this test to compare the means of a continuous outcome measured in the same participants under two conditions or at two time points when the outcome is approximately normally distributed."
    );

  }


  if (
    state.design === "within" &&
    state.normality === "not_normal"
  ) {

    showResult(
      "Wilcoxon Signed-Rank Test",
      "Use this nonparametric test to compare two related or paired measurements when the continuous outcome does not meet the normality assumption."
    );

  }

}


/* =========================================
   SHOW RESULT
   ========================================= */

function showResult(title, descriptionText) {

  const resultPanel =
    document.getElementById("resultPanel");

  const result =
    document.getElementById("result");

  const description =
    document.getElementById("resultDescription");


  result.textContent = title;

  description.textContent = descriptionText;


  resultPanel.style.display = "block";


  document
    .getElementById("resetButton")
    .style.display = "block";


  /*
    Scroll to result.
  */

  setTimeout(function() {

    resultPanel.scrollIntoView({

      behavior: "smooth",

      block: "nearest"

    });

  }, 100);

}


/* =========================================
   RESET
   ========================================= */

function resetSelector() {

  /*
    Reset state.
  */

  state.measurement = null;

  state.variableCount = null;

  state.normality = null;

  state.design = null;


  /*
    Uncheck all radio buttons.
  */

  document
    .querySelectorAll('input[type="radio"]')
    .forEach(function(input) {

      input.checked = false;

    });


  /*
    Hide Question 2.
  */

  document
    .getElementById("question2")
    .classList.add("hidden");


  /*
    Clear Question 2 options.
  */

  document
    .getElementById("question2Options")
    .innerHTML = "";


  /*
    Hide Question 3.
  */

  document
    .getElementById("question3")
    .classList.add("hidden");


  /*
    Hide result.
  */

  document
    .getElementById("resultPanel")
    .style.display = "none";


  /*
    Hide reset button.
  */

  document
    .getElementById("resetButton")
    .style.display = "none";


  /*
    Return to top.
  */

  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}

</script>

</body>
</html>
