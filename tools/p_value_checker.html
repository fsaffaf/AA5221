<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>p-Value Decision Tool</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #020617;
  color: white;
}

/* Background */
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top, rgba(125,211,252,0.16), transparent 35%),
    radial-gradient(circle at bottom, rgba(99,102,241,0.14), transparent 40%);
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  opacity: 0.3;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 42px 42px;
  z-index: -1;
}

/* Card */
.wrapper {
  width: 100%;
  max-width: 780px;
}

.card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(24px);
  border-radius: 24px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.45);
}

.content {
  padding: 2.5rem;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 2rem;
}

.pill {
  display: inline-block;
  padding: 0.45rem 1rem;
  border-radius: 999px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.15);
  font-size: 0.9rem;
  margin-bottom: 1.25rem;
}

.header h1 {
  margin: 0 0 0.75rem;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 650;
}

.header p {
  color: rgb(203,213,225);
  max-width: 620px;
  margin: 0 auto;
  line-height: 1.6;
}

/* Buttons */
.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 2rem;
}

.choice {
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 1.5rem;
  cursor: pointer;
  transition: 0.25s ease;
}

.choice.nonsig {
  background: rgba(255,255,255,0.10);
}

.choice.sig {
  background: rgba(14,165,233,0.18);
  border-color: rgba(125,211,252,0.25);
}

.choice:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.18);
}

.choice.active {
  box-shadow: 0 0 0 2px rgba(125,211,252,0.6);
}

.choice-title {
  font-size: 1.25rem;
  font-weight: 650;
}

.choice-sub {
  font-size: 0.9rem;
  color: rgb(203,213,225);
  margin-top: 0.3rem;
}

/* Result */
.empty {
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  padding: 1.5rem;
  text-align: center;
  color: rgb(203,213,225);
}

.result {
  display: none;
  border-radius: 20px;
  padding: 1.75rem;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  animation: fadeIn 0.25s ease;
}

.result.sig {
  background: linear-gradient(135deg, rgba(3,105,161,0.75), rgba(49,46,129,0.85));
  border: 1px solid rgba(125,211,252,0.35);
}

.result.nonsig {
  background: linear-gradient(135deg, rgba(51,65,85,0.85), rgba(15,23,42,0.9));
  border: 1px solid rgba(148,163,184,0.25);
}

.result h2 {
  margin: 0 0 0.4rem;
  font-size: 1.9rem;
}

.result p {
  color: rgb(226,232,240);
  margin-bottom: 1.2rem;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.item {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  padding: 1rem;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 700px) {
  .choice-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="card">
    <div class="content">

      <div class="header">
        <h1>P-Value Interpreter</h1>
        <p>
          What is your obtained p-value?
        </p>
      </div>

      <div class="choice-grid">
        <div class="choice nonsig" onclick="showResult('nonsig')" id="btnNonsig">
          <div class="choice-title">p ≥ .05</div>
          <div class="choice-sub">GREATER THAN or equal to .05</div>
        </div>

        <div class="choice sig" onclick="showResult('sig')" id="btnSig">
          <div class="choice-title">p &lt; .05</div>
          <div class="choice-sub">LESS THAN .05</div>
        </div>
      </div>

      <div id="result" class="result">
        <h2 id="resultTitle"></h2>
        <p id="resultSubtitle"></p>

        <div class="list" id="resultList"></div>
      </div>

    </div>
  </div>
</div>

<script>
function showResult(type) {
  document.getElementById("empty").style.display = "none";
  const result = document.getElementById("result");
  const list = document.getElementById("resultList");

  document.getElementById("btnNonsig").classList.remove("active");
  document.getElementById("btnSig").classList.remove("active");

  list.innerHTML = "";

  if (type === "nonsig") {
    document.getElementById("btnNonsig").classList.add("active");
    result.className = "result nonsig";

    document.getElementById("resultTitle").textContent =
      "Results";
    [
      "Null hypothesis supported.",
      "Results are NOT statistically significant.",
      "Do not calculate effect size."
    ].forEach(text => {
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = text;
      list.appendChild(div);
    });
  }

  if (type === "sig") {
    document.getElementById("btnSig").classList.add("active");
    result.className = "result sig";

    document.getElementById("resultTitle").textContent =
      "Results";
    [
      "Alternative hypothesis supported.",
      "Results ARE statistically significant.",
      "Calculate effect size."
    ].forEach(text => {
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = text;
      list.appendChild(div);
    });
  }

  result.style.display = "block";
}
</script>

</body>
</html>
