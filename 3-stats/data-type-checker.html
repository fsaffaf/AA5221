<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Type Identifierr</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #020617;
  color: white;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top, rgba(125,211,252,0.16), transparent 35%),
    radial-gradient(circle at bottom, rgba(99,102,241,0.14), transparent 40%);
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  opacity: 0.3;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 42px 42px;
  z-index: -1;
}

/* Card */
.wrapper {
  width: 100%;
  max-width: 820px;
}

.card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(24px);
  border-radius: 24px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.45);
}

.content {
  padding: 2.5rem;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 2rem;
}

.pill {
  display: inline-block;
  padding: 0.45rem 1rem;
  border-radius: 999px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.15);
  font-size: 0.9rem;
  margin-bottom: 1.25rem;
}

.header h1 {
  margin: 0 0 0.75rem;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 650;
}

.header p {
  color: rgb(203,213,225);
  max-width: 640px;
  margin: 0 auto;
  line-height: 1.6;
}

/* Buttons */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 2rem;
}

.choice {
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 1.5rem;
  cursor: pointer;
  transition: 0.25s ease;
}

.choice:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.16);
}

.choice.active {
  box-shadow: 0 0 0 2px rgba(125,211,252,0.6);
}

.choice-title {
  font-size: 1.25rem;
  font-weight: 650;
}

.choice-sub {
  font-size: 0.9rem;
  color: rgb(203,213,225);
  margin-top: 0.3rem;
}

/* Result */
.result {
  display: none;
  border-radius: 20px;
  padding: 1.75rem;
  background: linear-gradient(135deg, rgba(3,105,161,0.75), rgba(49,46,129,0.85));
  border: 1px solid rgba(125,211,252,0.35);
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

.result h2 {
  margin: 0 0 0.5rem;
  font-size: 2rem;
}

.result p {
  color: rgb(226,232,240);
  line-height: 1.6;
}

.examples {
  margin-top: 1rem;
  padding-left: 1.2rem;
  color: rgb(241,245,249);
}

@media (max-width: 700px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="card">
    <div class="content">

      <div class="header">
        <h1>Data Type Identifier</h1>
        <p>
          Select the box below that best describes your variable.
        </p>
      </div>

      <div class="grid">
        <div class="choice" onclick="showType('nominal')">
          <div class="choice-title">Named categories only</div>
          <div class="choice-sub">No order, no numbers.</div>
        </div>

        <div class="choice" onclick="showType('ordinal')">
          <div class="choice-title">Ordered categories</div>
          <div class="choice-sub">Ranked in order, unequal intervals.</div>
        </div>

        <div class="choice" onclick="showType('interval')">
          <div class="choice-title">Numbers, no true zero</div>
          <div class="choice-sub">Value of variable can go below zero.</div>
        </div>

        <div class="choice" onclick="showType('ratio')">
          <div class="choice-title">Numbers with a true zero.</div>
          <div class="choice-sub">Zero means none.</div>
        </div>
      </div>

      <div id="result" class="result">
        <h2 id="typeTitle"></h2>
        <p id="typeDescription"></p>
        <ul id="typeExamples" class="examples"></ul>
      </div>

    </div>
  </div>
</div>

<script>
function showType(type) {
  const title = document.getElementById("typeTitle");
  const desc = document.getElementById("typeDescription");
  const examples = document.getElementById("typeExamples");
  const result = document.getElementById("result");

  examples.innerHTML = "";

  const data = {
    nominal: {
      title: "Nominal Data",
      examples: [
        "Countries (Afghanistan, Brazil, China)",
        "Yes / No responses (dichotomous variables)"
      ]
    },
    ordinal: {
      title: "Ordinal Data",
      examples: [
        "Single-Item Likert Scale: Agreement (Strongly Disagree to Strongly Agree)"
        "Single-Item Likert Scale: Agreement (Very Disatisfied to Very Satisfied)"
      ]
    },
    interval: {
      title: "Interval Data",
      examples: [
        "Temperature in Celsius",
        "Multiple-Item Scale",
      ]
    },
    ratio: {
      title: "Ratio Data",
      examples: [
        "Height or length (cm)",
        "Weight (kg)"
      ]
    }
  };

  title.textContent = data[type].title;
  desc.textContent = data[type].desc;

  data[type].examples.forEach(e => {
    const li = document.createElement("li");
    li.textContent = e;
    examples.appendChild(li);
  });

  result.style.display = "block";
}
</script>

</body>
</html>
