<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hypothesis Writer</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #020617;
  color: white;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top, rgba(125,211,252,0.16), transparent 35%),
    radial-gradient(circle at bottom, rgba(99,102,241,0.14), transparent 40%);
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  opacity: 0.3;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 42px 42px;
  z-index: -1;
}

.tool-wrapper {
  width: 100%;
  max-width: 780px;
}

.tool-card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(24px);
  border-radius: 24px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.45);
  overflow: hidden;
}

.tool-content {
  padding: 2.5rem;
}

.tool-header {
  text-align: center;
  margin-bottom: 2rem;
}

.tool-pill {
  display: inline-flex;
  align-items: center;
  padding: 0.45rem 1rem;
  border-radius: 999px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgb(226,232,240);
  font-size: 0.9rem;
  margin-bottom: 1.25rem;
}

.tool-header h1 {
  margin: 0 0 0.75rem;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 650;
}

.tool-header p {
  margin: 0 auto;
  max-width: 620px;
  color: rgb(203,213,225);
  font-size: 1.05rem;
  line-height: 1.6;
}

.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 2rem;
}

.choice-button {
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 1.5rem;
  min-height: 110px;
  text-align: left;
  cursor: pointer;
  color: white;
  transition: 0.25s ease;
  font-family: inherit;
}

.choice-button.relationships {
  background: rgba(14,165,233,0.15);
  border-color: rgba(125,211,252,0.22);
}

.choice-button.groups {
  background: rgba(255,255,255,0.10);
}

.choice-button:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.16);
}

.choice-button.active.relationships {
  box-shadow: 0 0 0 2px rgba(125,211,252,0.75);
}

.choice-button.active.groups {
  box-shadow: 0 0 0 2px rgba(203,213,225,0.55);
}

.choice-title {
  font-size: 1.25rem;
  font-weight: 650;
  margin-bottom: 0.35rem;
}

.choice-subtitle {
  font-size: 0.9rem;
  color: rgb(203,213,225);
}

/* Inputs */
.input-panel {
  display: none;
  margin-bottom: 2rem;
}

.input-grid {
  display: grid;
  gap: 1rem;
}

.input-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: rgb(226,232,240);
  font-size: 0.95rem;
}

.input-group input {
  width: 100%;
  box-sizing: border-box;
  padding: 1rem;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 1rem;
  outline: none;
}

.input-group input:focus {
  border-color: rgba(125,211,252,0.65);
}

.generate-btn {
  margin-top: 1.25rem;
  width: 100%;
  padding: 1rem;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: white;
  font-size: 1rem;
  font-weight: 650;
  cursor: pointer;
  transition: 0.25s ease;
}

.generate-btn:hover {
  transform: translateY(-2px);
}

/* Results */
.result-panel {
  display: none;
  border-radius: 20px;
  border: 1px solid rgba(125,211,252,0.30);
  background: linear-gradient(135deg, rgba(3,105,161,0.70), rgba(49,46,129,0.80));
  padding: 1.75rem;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

.result-panel.groups-style {
  border-color: rgba(148,163,184,0.25);
  background: linear-gradient(135deg, rgba(51,65,85,0.85), rgba(15,23,42,0.90));
}

.result-top {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.result-icon {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
}

.result-title {
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 650;
}

.hypothesis-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.hypothesis-item {
  display: flex;
  gap: 0.75rem;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  padding: 1rem;
  color: rgb(241,245,249);
  line-height: 1.5;
}

.check {
  color: #bae6fd;
  font-weight: bold;
}

@media (max-width: 700px) {
  body {
    padding: 1rem;
  }

  .tool-content {
    padding: 1.5rem;
  }

  .choice-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<main class="tool-wrapper">

<section class="tool-card">

<div class="tool-content">

<div class="tool-header">

<h1>
Hypothesis Writer
</h1>

<p>
What is your research design?
</p>

</div>

<div class="choice-grid">

<button
class="choice-button relationships"
onclick="selectDesign('correlation')"
id="correlationBtn"
>
<div class="choice-title">
Correlation
</div>

<div class="choice-subtitle">
Testing relationships.
</div>
</button>

<button
class="choice-button groups"
onclick="selectDesign('groups')"
id="groupsBtn"
>
<div class="choice-title">
Quasi-Experiment or True Experiment
</div>

<div class="choice-subtitle">
Testing group differences.
</div>
</button>

</div>

<!-- STEP 2 -->
<div id="inputPanel" class="input-panel">

<div class="input-grid">
<div class="input-group">
<label id="label1">Variable 1</label>
<input type="text" id="input1" placeholder="Enter variable name">
</div>

<div class="input-group">
<label id="label2">Variable 2</label>
<input type="text" id="input2" placeholder="Enter variable name">
</div>

</div>

<button class="generate-btn" onclick="generateHypotheses()">
Write My Hypotheses
</button>

</div>

<!-- RESULTS -->
<div id="resultPanel" class="result-panel">

<div class="result-top">

<div>

<div class="result-title" id="resultTitle">
Results
</div>

</div>

</div>

<div class="hypothesis-list">

<div class="hypothesis-item">
  
<span id="nullHypothesis">
Null hypothesis
</span>
</div>

<div class="hypothesis-item">

<span id="altHypothesis">
Alternative hypothesis
</span>
</div>

</div>

</div>

</div>

</section>

</main>

<script>

let selectedDesign = "";

function selectDesign(type) {

selectedDesign = type;

const inputPanel = document.getElementById("inputPanel");

const correlationBtn = document.getElementById("correlationBtn");
const groupsBtn = document.getElementById("groupsBtn");

const label1 = document.getElementById("label1");
const label2 = document.getElementById("label2");

const input1 = document.getElementById("input1");
const input2 = document.getElementById("input2");

correlationBtn.classList.remove("active");
groupsBtn.classList.remove("active");

if (type === "correlation") {

correlationBtn.classList.add("active");

label1.textContent = "Variable 1";
label2.textContent = "Variable 2";

input1.placeholder = "Enter Variable 1";
input2.placeholder = "Enter Variable 2";
}

if (type === "groups") {

groupsBtn.classList.add("active");

label1.textContent = "Independent Variable (IV)";
label2.textContent = "Dependent Variable (DV)";

input1.placeholder = "Enter IV";
input2.placeholder = "Enter DV";
}

inputPanel.style.display = "block";
}

function generateHypotheses() {

const var1 = document.getElementById("input1").value.trim();
const var2 = document.getElementById("input2").value.trim();

if (!var1 || !var2) {
alert("Please complete both fields.");
return;
}

const resultPanel = document.getElementById("resultPanel");

const resultIcon = document.getElementById("resultIcon");
const resultTitle = document.getElementById("resultTitle");

const nullHypothesis = document.getElementById("nullHypothesis");
const altHypothesis = document.getElementById("altHypothesis");

resultPanel.style.display = "block";

resultPanel.classList.remove("groups-style");

if (selectedDesign === "correlation") {

resultTitle.textContent = "Testing Relationships";

nullHypothesis.textContent =
`1) Null hypothesis: There is no relationship between ${var1} and ${var2}.`;

altHypothesis.textContent =
`2) Alternative hypothesis: There is a relationship between ${var1} and ${var2}.`;
}

if (selectedDesign === "groups") {

resultTitle.textContent = "Testing Group Differences";

resultPanel.classList.add("groups-style");

nullHypothesis.textContent =
`1) Null hypothesis: There is no statistically significant difference in ${var2} based on ${var1}.`;

altHypothesis.textContent =
`2) Alternative hypothesis: There is a statistically significant difference in ${var2} based on ${var1}.`;
}

}

</script>

</body>
</html>
