<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RScript Files</title>

<style>

body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:#f4f6f9;
    color:#222222;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:50px 20px;
}

h1{
    text-align:left;
    color:#666666;
    font-size:2.75rem;
    font-weight:200;
    letter-spacing:.08em;
    text-transform:none;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    text-transform:uppercase;
    letter-spacing:.15em;
    margin-bottom:40px;
    font-size:.95rem;
}

h2,
h3{
    color:#0e68b3;
    position:relative;
    font-weight:500;
    display:inline-block;
}

h2::after,
h3::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-4px;
    width:0;
    height:2px;
    background:#0e68b3;
    transition:.3s;
}

.card:hover h2::after,
.card:hover h3::after{
    width:100%;
}

p{
    line-height:1.8;
}

.card{
    background:white;
    border-radius:16px;
    padding:30px;
    margin-bottom:25px;
    border:1px solid #d9e2ec;

    box-shadow:
      0 3px 10px rgba(0,0,0,.05);

    animation:fadeUp .6s ease forwards;
    transition:all .25s ease;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:
      0 10px 25px rgba(14,104,179,.15);
}

.highlight{
    background:#eef6fc;
    border-left:5px solid #0e68b3;
    padding:15px;
    border-radius:8px;
    margin:20px 0;
}

ul{
    padding-left:25px;
}

li{
    margin-bottom:8px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:white;
    overflow:hidden;
    border-radius:10px;
}

th{
    background:#0e68b3;
    color:white;
    text-align:left;
    padding:14px;
}

td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
    vertical-align:top;
}

tr:nth-child(even){
    background:#f8fafc;
}

tr:hover{
    background:#edf6ff;
}

hr{
    border:none;
    height:1px;
    background:#d6e4f0;
    margin:30px 0;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media (max-width:768px){

    h1{
        font-size:2rem;
    }

    .card{
        padding:20px;
    }

    th,
    td{
        padding:10px;
        font-size:.95rem;
    }
}

</style>
</head>

<body>

<div class="container">


  

</div>
