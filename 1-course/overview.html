<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics Process</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #020617;
  color: white;
  overflow: hidden;
}

/* container */
.container {
  display: flex;
  height: 100vh;
  width: 100%;
  transition: transform 0.5s ease;
}

/* slides */
.section {
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* card */
.card {
  width: 500px;
  height: 260px;
  padding: 25px;

  border-radius: 15px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* text */
h1, h2 { margin: 0 0 10px; }
p { color: #cbd5f5; }

/* arrows */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 50px;

  background: rgba(255,255,255,0.1);
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.prev { left: 20px; }
.next { right: 20px; }

.prev::after { content: "⬅"; }
.next::after { content: "➜"; }

/* progress */
.progress {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 4px;
  background: #38bdf8;
  width: 0%;
}
</style>
</head>

<body>

<div class="arrow prev" id="prev"></div>
<div class="arrow next" id="next"></div>
<div class="progress" id="progress"></div>

<div class="container" id="container">

  <div class="section">
    <div class="card">
      <h1>Purpose</h1>
      <p>Understand the analytics lifecycle.</p>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <h2>1. Define Problem</h2>
      <p>Set research questions.</p>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <h2>2. Planning</h2>
      <p>Define requirements.</p>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <h2>3. Data Collection</h2>
      <p>Gather data sources.</p>
    </div>
  </div>

</div>

<script>
const container = document.getElementById("container");
const slides = document.querySelectorAll(".section");
const next = document.getElementById("next");
const prev = document.getElementById("prev");
const progress = document.getElementById("progress");

let index = 0;
const total = slides.length;

function update() {
  container.style.transform = "translateX(-" + (index * 100) + "vw)";
  progress.style.width = (index / (total - 1)) * 100 + "%";

  prev.style.display = index === 0 ? "none" : "flex";
  next.style.display = index === total - 1 ? "none" : "flex";
}

next.onclick = () => {
  if (index < total - 1) {
    index++;
    update();
  }
};

prev.onclick = () => {
  if (index > 0) {
    index--;
    update();
  }
};

/* keyboard support */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") next.onclick();
  if (e.key === "ArrowLeft") prev.onclick();
});

update();
</script>

</body>
</html>
