<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics Process</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  overflow: hidden;
}

/* container */
.container {
  display: flex;
  width: 100%;
  height: 100vh;
  transition: transform 0.5s ease;
}

/* slides */
.slide {
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* box */
.box {
  background: #1e293b;
  padding: 30px;
  border-radius: 10px;
  width: 400px;
  text-align: center;
}

/* arrows */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 50px;

  background: #334155;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.prev { left: 20px; }
.next { right: 20px; }

.prev::after { content: "⬅"; }
.next::after { content: "➡"; }
</style>
</head>

<body>

<div class="arrow prev" id="prev"></div>
<div class="arrow next" id="next"></div>

<div class="container" id="container">

  <div class="slide">
    <div class="box">
      <h1>Purpose</h1>
      <p>Understand the analytics process.</p>
    </div>
  </div>

  <div class="slide">
    <div class="box">
      <h2>1. Define Problem</h2>
      <p>Set research questions.</p>
    </div>
  </div>

  <div class="slide">
    <div class="box">
      <h2>2. Planning</h2>
      <p>Define scope and requirements.</p>
    </div>
  </div>

  <div class="slide">
    <div class="box">
      <h2>3. Data Collection</h2>
      <p>Gather data sources.</p>
    </div>
  </div>

</div>

<script>
const container = document.getElementById("container");
const next = document.getElementById("next");
const prev = document.getElementById("prev");

let index = 0;
const total = document.querySelectorAll(".slide").length;

function update() {
  container.style.transform = "translateX(-" + (index * 100) + "vw)";

  prev.style.display = index === 0 ? "none" : "flex";
  next.style.display = index === total - 1 ? "none" : "flex";
}

next.onclick = () => {
  if (index < total - 1) {
    index++;
    update();
  }
};

prev.onclick = () => {
  if (index > 0) {
    index--;
    update();
  }
};

update();
</script>

</body>
</html>
``
