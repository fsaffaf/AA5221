<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics Process</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #08131f, #000814);
  color: white;
  overflow: hidden;
}

/* container */
.container {
  display: flex;
  width: 400vw; /* number of slides × 100 */
  height: 100vh;
  transition: transform 0.5s ease;
}

/* slides */
.section {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* cards */
.card {
  width: 600px;
  height: 320px;
  padding: 30px;

  border-radius: 20px;

  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(20px);

  border: 1px solid rgba(120,200,255,0.3);

  box-shadow:
    0 0 40px rgba(0,200,255,0.25),
    0 20px 60px rgba(0,0,0,0.8);

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* text */
h1, h2 {
  margin: 0 0 10px;
  background: linear-gradient(90deg, #7dd3fc, #38bdf8, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

p {
  color: #cbd5f5;
}

/* button */
button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
}

button:hover {
  background: linear-gradient(90deg, #38bdf8, #818cf8);
}

/* panel */
.panel {
  max-height: 0;
  overflow: hidden;
  transition: 0.3s;
}

.panel.open {
  max-height: 120px;
}

/* arrows */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 55px;
  height: 55px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);

  cursor: pointer;
  backdrop-filter: blur(10px);
}

.arrow:hover {
  background: linear-gradient(90deg, #38bdf8, #818cf8);
}

.next { right: 20px; }
.prev { left: 20px; }

.next::after { content: "➜"; font-size: 22px; }
.prev::after { content: "⬅"; font-size: 22px; }

/* progress bar */
.progress {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 5px;
  width: 0%;
  background: linear-gradient(90deg, #38bdf8, #818cf8);
}
</style>
</head>

<body>

<div class="arrow prev" id="prev"></div>
<div class="arrow next" id="next"></div>
<div class="progress" id="progress"></div>

<div class="container" id="container">

  <div class="section"><div class="card">
    <h1>Purpose</h1>
    <p>Understand the analytics lifecycle.</p>
    <button onclick="toggle(this)">Learn More</button>
    <div class="panel">Overview of process.</div>
  </div></div>

  <div class="section"><div class="card">
    <h2>1. Define Problem</h2>
    <p>Set research questions.</p>
    <button onclick="toggle(this)">Learn More</button>
    <div class="panel">Define goals clearly.</div>
  </div></div>

  <div class="section"><div class="card">
    <h2>2. Planning</h2>
    <p>Define requirements.</p>
    <button onclick="toggle(this)">Learn More</button>
    <div class="panel">Identify stakeholders.</div>
  </div></div>

  <div class="section"><div class="card">
    <h2>3. Data Collection</h2>
    <p>Gather data.</p>
    <button onclick="toggle(this)">Learn More</button>
    <div class="panel">Use APIs or datasets.</div>
  </div></div>

</div>

<script>
const container = document.getElementById("container");
const next = document.getElementById("next");
const prev = document.getElementById("prev");
const progress = document.getElementById("progress");

let index = 0;
const total = document.querySelectorAll(".section").length;

/* expand panel */
function toggle(btn) {
  btn.nextElementSibling.classList.toggle("open");
}

/* update UI */
function update() {
  container.style.transform = `translateX(-${index * 100}vw)`;

  /* progress */
  progress.style.width = (index / (total - 1)) * 100 + "%";

  /* arrows */
  prev.style.display = index === 0 ? "none" : "flex";
  next.style.display = index === total - 1 ? "none" : "flex";
}

/* next */
next.onclick = () => {
  if (index < total - 1) {
    index++;
    update();
  }
};

/* prev */
prev.onclick = () => {
  if (index > 0) {
    index--;
    update();
  }
};

/* keyboard support */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") next.onclick();
  if (e.key === "ArrowLeft") prev.onclick();
});

update();
</script>

</body>
</html>
