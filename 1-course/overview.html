<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slide Deck</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #0b1220;
  overflow: hidden;
}

/* subtle glow */
body::before {
  content: "";
  position: fixed;
  width: 700px;
  height: 700px;
  left: 50%;
  top: 40%;
  transform: translate(-50%, -50%);
  background: radial-gradient(
    circle,
    rgba(147,197,253,0.14),
    rgba(59,130,246,0.06),
    transparent 70%
  );
  filter: blur(30px);
  z-index: 0;
}

/* deck */
.deck {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

.slides {
  display: flex;
  width: 500vw;
  height: 100vh;
  transition: transform 0.65s ease;
}

/* slide */
.slide {
  width: 100vw;
  height: 100vh;
  flex-shrink: 0;

  display: flex;
  justify-content: flex-start;
  align-items: flex-start;

  padding: 7vh 8vw;
  position: relative;
}

/* content */
.content {
  max-width: 900px;
  text-align: left; /* FIX: ensures no centering */
}

/* titles always left aligned */
h1, h2 {
  margin: 0;
  text-align: left;
  color: rgba(255,255,255,0.92);
  letter-spacing: -0.02em;
}

h1 {
  font-size: clamp(2.2rem, 4vw, 3.2rem);
  font-weight: 600;
}

h2 {
  font-size: 1.7rem;
  font-weight: 500;
  border-left: 3px solid rgba(147,197,253,0.8);
  padding-left: 0.75rem;
}

/* text */
p {
  margin-top: 0.75rem;
  font-size: 1rem;
  line-height: 1.6;
  color: rgba(226,232,240,0.72);
}

/* navigation */
.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 56px;
  height: 56px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(10,15,25,0.35);
  backdrop-filter: blur(16px);
  cursor: pointer;
  z-index: 10;
}

.left { left: 24px; }
.right { right: 24px; }

.arrow {
  width: 0;
  height: 0;
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left: 12px solid rgba(255,255,255,0.8);
}

.arrow.left {
  border-left: none;
  border-right: 12px solid rgba(255,255,255,0.8);
}

/* restart */
.restart {
  position: absolute;
  bottom: 20px;
  left: 24px;

  padding: 10px 16px;
  border-radius: 999px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.85);

  backdrop-filter: blur(16px);
  cursor: pointer;
  z-index: 10;
}

/* home */
.home-btn {
  position: absolute;
  bottom: 20px;
  left: 120px;

  padding: 10px 16px;
  border-radius: 999px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.85);
  text-decoration: none;

  backdrop-filter: blur(16px);
  z-index: 10;
}

/* counter */
.counter {
  position: absolute;
  bottom: 20px;
  right: 24px;
  font-size: 0.8rem;
  color: rgba(226,232,240,0.6);
  z-index: 10;
}
</style>
</head>

<body>

<div class="deck">

  <div class="slides" id="slides">

    <div class="slide">
      <div class="content">
        <h1>AA 5221</h1>
        <p>Applied Analytics & Research Methods I</p>
      </div>
    </div>

    <div class="slide">
      <div class="content">
        <h2>Course Purpose</h2>
        <p>Understanding data structures and inference foundations.</p>
      </div>
    </div>

    <div class="slide">
      <div class="content">
        <h2>Research Design</h2>
        <p>Experimental and observational methods.</p>
      </div>
    </div>

    <div class="slide">
      <div class="content">
        <h2>Statistics</h2>
        <p>Descriptive and inferential reasoning.</p>
      </div>
    </div>

    <div class="slide">
      <div class="content">
        <h2>Conclusion</h2>
        <p>Key concepts and synthesis.</p>
      </div>
    </div>

  </div>

  <!-- controls -->
  <button class="nav-btn left" onclick="prevSlide()">
    <div class="arrow left"></div>
  </button>

  <button class="nav-btn right" onclick="nextSlide()">
    <div class="arrow"></div>
  </button>

  <button class="restart" onclick="restart()">Restart</button>

  <a class="home-btn" href="index.html">Home</a>

  <div class="counter" id="counter">1 / 5</div>

</div>

<script>
let current = 0;
const total = 5;

const slides = document.getElementById("slides");
const counter = document.getElementById("counter");

const leftBtn = document.querySelector(".left");
const rightBtn = document.querySelector(".right");

function update() {
  slides.style.transform = `translateX(-${current * 100}vw)`;
  counter.textContent = `${current + 1} / ${total}`;

  leftBtn.style.display = current === 0 ? "none" : "flex";
  rightBtn.style.display = current === total - 1 ? "none" : "flex";
}

function nextSlide() {
  if (current < total - 1) current++;
  update();
}

function prevSlide() {
  if (current > 0) current--;
  update();
}

function restart() {
  current = 0;
  update();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextSlide();
  if (e.key === "ArrowLeft") prevSlide();
});

update();
</script>

</body>
</html>
