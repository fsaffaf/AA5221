<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slides</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #111;
}

/* container */
#container {
  display: flex;
  height: 100vh;
  transition: 0.4s;
}

/* each slide */
.slide {
  width: 100vw;
  height: 100vh;
  flex-shrink: 0;

  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 30px;
}

/* colors so you SEE movement */
.slide:nth-child(1) { background: #1e293b; }
.slide:nth-child(2) { background: #334155; }
.slide:nth-child(3) { background: #475569; }
.slide:nth-child(4) { background: #64748b; }

/* arrows */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 50px;

  background: white;
  color: black;

  display: flex;
  justify-content: center;
  align-items: center;

  cursor: pointer;
  font-size: 20px;
}

#left { left: 20px; }
#right { right: 20px; }
</style>
</head>

<body>

<div id="left" class="arrow">←</div>
<div id="right" class="arrow">→</div>

<div id="container">

  <div class="slide">Purpose</div>
  <div class="slide">Step 1</div>
  <div class="slide">Step 2</div>
  <div class="slide">Step 3</div>

</div>

<script>
let index = 0;
const container = document.getElementById("container");
const slides = document.querySelectorAll(".slide");

function update() {
  container.style.transform = "translateX(-" + (index * window.innerWidth) + "px)";
}

document.getElementById("right").onclick = function() {
  if (index < slides.length - 1) {
    index++;
    update();
  }
};

document.getElementById("left").onclick = function() {
  if (index > 0) {
    index--;
    update();
  }
};

/* important: update on resize */
window.onresize = update;

/* initialize */
update();
</script>

</body>
</html>
