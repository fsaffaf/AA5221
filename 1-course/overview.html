<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slide Deck</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: #111;
  }

  .deck {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .slides {
    display: flex;
    width: 1000vw; /* 10 slides */
    height: 100vh;
    transition: transform 0.6s ease-in-out;
  }

  .slide {
    width: 100vw;
    height: 100vh;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: white;
  }

  /* Different background colors per slide */
  .slide:nth-child(1) { background: #1abc9c; }
  .slide:nth-child(2) { background: #3498db; }
  .slide:nth-child(3) { background: #9b59b6; }
  .slide:nth-child(4) { background: #e74c3c; }
  .slide:nth-child(5) { background: #f39c12; }
  .slide:nth-child(6) { background: #2ecc71; }
  .slide:nth-child(7) { background: #34495e; }
  .slide:nth-child(8) { background: #16a085; }
  .slide:nth-child(9) { background: #8e44ad; }
  .slide:nth-child(10){ background: #c0392b; }

  /* Right arrow button */
  .next-btn {
    position: absolute;
    right: 25px;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }

  .next-btn:hover {
    background: rgba(255,255,255,0.3);
  }

  .arrow {
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 15px solid white;
    margin-left: 5px;
  }

  .counter {
    position: absolute;
    bottom: 20px;
    right: 25px;
    color: white;
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>

<body>

<div class="deck">
  <div class="slides" id="slides">

    <div class="slide">Slide 1</div>
    <div class="slide">Slide 2</div>
    <div class="slide">Slide 3</div>
    <div class="slide">Slide 4</div>
    <div class="slide">Slide 5</div>
    <div class="slide">Slide 6</div>
    <div class="slide">Slide 7</div>
    <div class="slide">Slide 8</div>
    <div class="slide">Slide 9</div>
    <div class="slide">Slide 10</div>

  </div>

  <button class="next-btn" onclick="nextSlide()">
    <div class="arrow"></div>
  </button>

  <div class="counter" id="counter">1 / 10</div>
</div>

<script>
  let currentSlide = 0;
  const totalSlides = 10;
  const slides = document.getElementById("slides");
  const counter = document.getElementById("counter");

  function updateSlide() {
    slides.style.transform = `translateX(-${currentSlide * 100}vw)`;
    counter.textContent = `${currentSlide + 1} / ${totalSlides}`;
  }

  function nextSlide() {
    currentSlide++;
    if (currentSlide >= totalSlides) {
      currentSlide = 0; // loop back to start
    }
    updateSlide();
  }

  // Optional: arrow key support
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") nextSlide();
  });
</script>

</body>
</html>
