<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics Process</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden; /* important for horizontal */
  font-family: "Segoe UI", system-ui;
  background: radial-gradient(circle at top, #08131f, #000814);
  color: white;
}

/* container holds all slides */
.container {
  display: flex;
  width: 100vw;
  height: 100vh;
  transition: transform 0.6s ease;
}

/* each slide */
.section {
  min-width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;
}

/* glow */
.section::before {
  content: "";
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(0,200,255,0.25), transparent);
  filter: blur(120px);
}

/* card */
.card {
  width: 600px;
  height: 320px;
  padding: 30px;

  border-radius: 20px;

  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(20px);

  border: 1px solid rgba(120,200,255,0.3);

  box-shadow:
    0 0 40px rgba(0,200,255,0.25),
    0 20px 60px rgba(0,0,0,0.8);

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* text */
h1, h2 {
  margin: 0 0 10px;
  background: linear-gradient(90deg, #7dd3fc, #38bdf8, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

p {
  color: #cbd5f5;
}

/* buttons */
button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
}

button:hover {
  background: linear-gradient(90deg, #38bdf8, #818cf8);
}

/* panel */
.panel {
  max-height: 0;
  overflow: hidden;
  transition: 0.3s;
}

.panel.open {
  max-height: 120px;
}

/* arrows */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 55px;
  height: 55px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);

  cursor: pointer;
  backdrop-filter: blur(10px);

  transition: 0.3s;
}

.arrow:hover {
  background: linear-gradient(90deg, #38bdf8, #818cf8);
  box-shadow: 0 0 20px #38bdf8;
}

/* positions */
.next { right: 20px; }
.prev { left: 20px; }

.next::after { content: "➜"; }
.prev::after { content: "⬅"; }

/* progress bar */
.progress {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 5px;
  width: 0%;
  background: linear-gradient(90deg, #38bdf8, #818cf8);
  box-shadow: 0 0 15px #38bdf8;
}
</style>
</head>

<body>

<div class="arrow prev" id="prevBtn"></div>
<div class="arrow next" id="nextBtn"></div>
<div class="progress" id="progress"></div>

<div class="container" id="container">

  <div class="section">
    <div class="card">
      <h1>Purpose</h1>
      <p>Understand the analytics lifecycle.</p>
      <button onclick="toggle(this)">Learn More</button>
      <div class="panel">Overview of full process.</div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <h2>1. Define Problem</h2>
      <p>Set research questions.</p>
      <button onclick="toggle(this)">Learn More</button>
      <div class="panel">Define goals clearly.</div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <h2>2. Planning</h2>
      <p>Define requirements.</p>
      <button onclick="toggle(this)">Learn More</button>
      <div class="panel">Identify stakeholders.</div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <h2>3. Data Collection</h2>
      <p>Gather data sources.</p>
      <button onclick="toggle(this)">Learn More</button>
      <div class="panel">Use surveys, APIs, databases.</div>
    </div>
  </div>

</div>

<script>
const container = document.getElementById('container');
const sections = document.querySelectorAll('.section');
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');
const progress = document.getElementById('progress');

let index = 0;

/* expand panel */
function toggle(btn) {
  btn.nextElementSibling.classList.toggle('open');
}

/* update UI */
function update() {
  container.style.transform = `translateX(-${index * 100}vw)`;

  /* progress */
  progress.style.width = ((index) / (sections.length - 1)) * 100 + "%";

  /* button visibility */
  prevBtn.style.display = index === 0 ? "none" : "flex";
  nextBtn.style.display = index === sections.length - 1 ? "none" : "flex";
}

/* next */
nextBtn.onclick = () => {
  if (index < sections.length - 1) {
    index++;
    update();
  }
};

/* prev */
prevBtn.onclick = () => {
  if (index > 0) {
    index--;
    update();
  }
};

/* OPTIONAL keyboard support */
document.addEventListener('keydown', (e) => {
  if (e.key === "ArrowRight") nextBtn.onclick();
  if (e.key === "ArrowLeft") prevBtn.onclick();
});

update();
</script>

</body>
</html>
