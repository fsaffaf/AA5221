<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics Process</title>

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: "Segoe UI", system-ui;
  background: radial-gradient(circle at top, #08131f, #000814);
  color: white;

  scroll-snap-type: y mandatory;
  overflow-y: scroll;
}

/* progress bar */
.progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 5px;
  width: 0%;
  background: linear-gradient(90deg, #38bdf8, #818cf8);
  box-shadow: 0 0 15px #38bdf8;
  z-index: 999;
}

/* arrows */
.arrow {
  position: fixed;
  width: 50px;
  height: 50px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);

  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.arrow:hover {
  background: linear-gradient(90deg, #38bdf8, #818cf8);
  box-shadow: 0 0 20px #38bdf8;
}

/* positions */
.next {
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
}
.next::after { content: "➜"; }

.prev {
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
}
.prev::after { content: "⬅"; }

/* sections */
.section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  scroll-snap-align: start;
}

/* glow */
.section::before {
  content: "";
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(0,200,255,0.25), transparent);
  filter: blur(120px);
}

/* cards */
.card {
  width: 600px;
  height: 320px;
  padding: 30px;
  border-radius: 20px;

  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
  backdrop-filter: blur(20px);

  border: 1px solid rgba(120,200,255,0.3);

  box-shadow:
    0 0 40px rgba(0,200,255,0.25),
    0 20px 60px rgba(0,0,0,0.8);

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  opacity: 0;
  transform: translateY(30px);
  transition: 0.6s;
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

h1, h2 {
  margin: 0 0 10px;
  background: linear-gradient(90deg, #7dd3fc, #38bdf8, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

p { color: #cbd5f5; }

/* button */
button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
}

button:hover {
  background: linear-gradient(90deg, #38bdf8, #818cf8);
}

/* panels */
.panel {
  max-height: 0;
  overflow: hidden;
  transition: 0.3s;
}

.panel.open {
  max-height: 120px;
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>
<div class="arrow prev" id="prevBtn"></div>
<div class="arrow next" id="nextBtn"></div>

<!-- SECTIONS -->

<div class="section"><div class="card">
<h1>Purpose</h1>
<p>Understand the analytics lifecycle.</p>
<button onclick="toggle(this)">Learn More</button>
<div class="panel">Full process overview.</div>
</div></div>

<div class="section"><div class="card">
<h2>1. Define Problem</h2>
<p>Set research questions.</p>
<button onclick="toggle(this)">Learn More</button>
<div class="panel">Define goals clearly.</div>
</div></div>

<div class="section"><div class="card">
<h2>2. Planning</h2>
<p>Define requirements.</p>
<button onclick="toggle(this)">Learn More</button>
<div class="panel">Identify stakeholders.</div>
</div></div>

<div class="section"><div class="card">
<h2>3. Data Collection</h2>
<p>Gather data sources.</p>
<button onclick="toggle(this)">Learn More</button>
<div class="panel">Use surveys, APIs, databases.</div>
</div></div>

<script>
const sections = document.querySelectorAll('.section');
const progress = document.getElementById('progress');
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');

/* toggle learn more */
function toggle(btn) {
  btn.nextElementSibling.classList.toggle('open');
}

/* ✅ RELIABLE slide index */
function getIndex() {
  return Math.round(window.scrollY / window.innerHeight);
}

/* update UI */
function update() {
  const index = getIndex();

  /* animate cards */
  sections.forEach((sec, i) => {
    const rect = sec.getBoundingClientRect();
    if (rect.top < window.innerHeight * 0.7) {
      sec.querySelector('.card').classList.add('show');
    }
  });

  /* progress */
  const scrollTop = document.documentElement.scrollTop;
  const height = document.documentElement.scrollHeight - window.innerHeight;
  progress.style.width = (scrollTop / height) * 100 + "%";

  /* arrow visibility */
  prevBtn.style.display = index === 0 ? "none" : "flex";
  nextBtn.style.display = index === sections.length - 1 ? "none" : "flex";
}

/* next */
nextBtn.addEventListener('click', () => {
  const i = getIndex();
  if (i < sections.length - 1) {
    window.scrollTo({ top: (i + 1) * window.innerHeight, behavior: "smooth" });
  }
});

/* prev */
prevBtn.addEventListener('click', () => {
  const i = getIndex();
  if (i > 0) {
    window.scrollTo({ top: (i - 1) * window.innerHeight, behavior: "smooth" });
  }
});

window.addEventListener('scroll', update);
update();
</script>

</body>
</html>
