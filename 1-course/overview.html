<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics Process</title>

<style>
html, body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #020617;
  color: white;
  scroll-behavior: smooth;
}

.section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 20px;
}

.section::before, .section::after {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  filter: blur(70px);
}

.section::before {
  background: radial-gradient(circle, rgba(125,211,252,0.25), transparent 60%);
  top: -150px; left: -150px;
}

.section::after {
  background: radial-gradient(circle, rgba(167,139,250,0.25), transparent 60%);
  bottom: -150px; right: -150px;
}

/* ✅ FIXED UNIFORM CARD SIZE */
.card {
  width: 650px;
  min-height: 320px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;

  padding: 40px;
  border-radius: 24px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);

  opacity: 0;
  transform: translateY(40px) scale(0.95);
  transition: all 0.7s ease;
}

.card.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* content wrapper for alignment */
.content {
  flex-grow: 1;
}

h1 {
  font-size: 2.8rem;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #7dd3fc, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

h2 {
  font-size: 1.6rem;
  margin-bottom: 10px;
}

p {
  font-size: 1rem;
  color: #cbd5f5;
}

/* links pinned to bottom */
.links {
  margin-top: 20px;
}

.links a {
  display: inline-block;
  padding: 8px 14px;
  margin: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #e0f2fe;
  text-decoration: none;
  font-size: 0.85rem;
  transition: all 0.3s ease;
}

.links a:hover {
  background: linear-gradient(90deg, #7dd3fc, #a78bfa);
  color: black;
  transform: scale(1.05);
}

/* nav */
.nav {
  position: fixed;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
}

.nav div {
  width: 10px;
  height: 10px;
  margin: 10px 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
}

.nav .active {
  background: linear-gradient(90deg, #7dd3fc, #a78bfa);
  transform: scale(1.5);
}
</style>
</head>

<body>

<div class="nav" id="nav"></div>

<!-- PURPOSE -->
<div class="section">
  <div class="card">
    <div class="content">
      <h1>Purpose</h1>
      <p>Understand the full lifecycle of data analytics.</p>
    </div>
    <div class="links">
      #Overview</a>
      <a href="#">Learning Goals</a>
    </div>
  </div>
</div>

<!-- STEPS -->

<div class="section">
  <div class="card">
    <div class="content">
      <h2>1. Define Problem</h2>
      <p>Identify research questions and goals.</p>
    </div>
    <div class="links">
      #Templates</a>
      #Examples</a>
    </div>
  </div>
</div>

<div class="section">
  <div class="card">
    <div class="content">
      <h2>2. Planning</h2>
      <p>Define scope and stakeholders.</p>
    </div>
    <div class="links">
      #Stakeholders</a>
      #Planning</a>
    </div>
  </div>
</div>

<div class="section">
  <div class="card">
    <div class="content">
      <h2>3. Data Collection</h2>
      <p>Gather relevant datasets.</p>
    </div>
    <div class="links">
      #Sources</a>
      #APIs</a>
    </div>
  </div>
</div>

<script>
const sections = document.querySelectorAll('.section');
const nav = document.getElementById('nav');

sections.forEach(() => {
  const dot = document.createElement('div');
  nav.appendChild(dot);
});

function update() {
  let activeIndex = 0;

  sections.forEach((section, i) => {
    const rect = section.getBoundingClientRect();

    if (rect.top < window.innerHeight * 0.6) {
      section.querySelector('.card').classList.add('show');
    }

    if (rect.top < window.innerHeight / 2 && rect.bottom > window.innerHeight / 2) {
      activeIndex = i;
    }
  });

  document.querySelectorAll('.nav div').forEach((dot, i) => {
    dot.classList.toggle('active', i === activeIndex);
  });
}

window.addEventListener('scroll', update);
update();
</script>

</body>
</html>
