<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics Process</title>

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: "Segoe UI", system-ui;
  background: radial-gradient(circle at top, #08131f, #000814);
  color: white;

  scroll-snap-type: y mandatory;
  overflow-y: scroll;
}

/* progress bar */
.progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 5px;
  width: 0%;
  background: linear-gradient(90deg, #38bdf8, #818cf8);
  box-shadow: 0 0 15px #38bdf8;
  z-index: 999;
}

.section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  scroll-snap-align: start;
}

.card {
  width: 600px;
  height: 320px;
  padding: 30px;

  border-radius: 20px;
  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
  backdrop-filter: blur(20px);
  border: 1px solid rgba(120,200,255,0.3);

  box-shadow:
    0 0 40px rgba(0,200,255,0.25),
    0 20px 60px rgba(0,0,0,0.8);

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  opacity: 0;
  transform: translateY(30px);
  transition: 0.6s;
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

h1, h2 {
  margin: 0 0 10px;
  background: linear-gradient(90deg, #7dd3fc, #38bdf8, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

p { color: #cbd5f5; }

button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
}

button:hover {
  background: linear-gradient(90deg, #38bdf8, #818cf8);
  color: white;
}

.panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  font-size: 0.9rem;
  color: #cbd5f5;
}

.panel.open { max-height: 120px; }

/* brighter glowing number */
.step-number {
  position: fixed;
  top: 20px;
  left: 20px;

  font-size: 70px;
  font-weight: 800;

  background: linear-gradient(180deg, #38bdf8, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 0 20px rgba(56,189,248,0.8),
    0 0 40px rgba(56,189,248,0.5);

  opacity: 0.9;
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>
<div class="step-number" id="step"></div>

<div class="section">
  <div class="card">
    <div>
      <h1>Purpose</h1>
      <p>Understand the analytics lifecycle.</p>
    </div>
    <div>
      <button onclick="toggle(this)">Learn More</button>
      <div class="panel">Overview of full process.</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="card">
    <div>
      <h2>1. Define Problem</h2>
      <p>Set research questions.</p>
    </div>
    <div>
      <button onclick="toggle(this)">Learn More</button>
      <div class="panel">Define goals clearly.</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="card">
    <div>
      <h2>2. Planning</h2>
      <p>Define requirements.</p>
    </div>
    <div>
      <button onclick="toggle(this)">Learn More</button>
      <div class="panel">Identify stakeholders.</div>
    </div>
  </div>
</div>

<script>
const sections = document.querySelectorAll('.section');
const step = document.getElementById('step');
const progress = document.getElementById('progress');

function toggle(btn) {
  const panel = btn.nextElementSibling;
  panel.classList.toggle('open');
}

function update() {
  let index = 0;

  sections.forEach((sec, i) => {
    const rect = sec.getBoundingClientRect();

    if (rect.top < window.innerHeight * 0.7) {
      sec.querySelector('.card').classList.add('show');
    }

    if (rect.top < window.innerHeight / 2 && rect.bottom > window.innerHeight / 2) {
      index = i;
    }
  });

  step.innerText = index === 0 ? '' : index;

  /* progress bar */
  const scrollTop = document.documentElement.scrollTop;
  const height = document.documentElement.scrollHeight - window.innerHeight;
  const percent = (scrollTop / height) * 100;
  progress.style.width = percent + "%";
}

window.addEventListener('scroll', update);
update();
</script>

</body>
</html>
