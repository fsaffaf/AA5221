<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AA 5221 — Course Materials</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>

  <!-- Starfield Background -->
  <canvas id="starfield"></canvas>

  <!-- Homepage Content -->
  <div class="home-container">

    <!-- SINGLE, STYLED TITLE -->
    <h1 style="
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 0.25em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff, #7dd3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0 0 20px rgba(56, 189, 248, 0.35),
        0 0 40px rgba(56, 189, 248, 0.15);
    ">
      AA <span style="font-weight: 300;">5221</span>
    </h1>

    <p class="subtitle" style="
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 2rem;
    ">
      Applied Analytics
    </p>

    <div class="collapsible">
      <button class="collapse-toggle">
        Lectures ▼
      </button>

      <div class="collapse-content">
        <a class="home-button" href="lectures/lecture01.html">Lecture 1</a>
        <a class="home-button" href="lectures/lecture02.html">Lecture 2</a>
        <a class="home-button" href="lectures/lecture03.html">Lecture 3</a>
        <a class="home-button" href="lectures/lecture04.html">Lecture 4</a>
        <a class="home-button" href="lectures/lecture05.html">Lecture 5</a>
        <a class="home-button" href="lectures/lecture06.html">Lecture 6</a>
        <a class="home-button" href="lectures/lecture07.html">Lecture 7</a>
        <a class="home-button" href="lectures/lecture08.html">Lecture 8</a>
        <a class="home-button" href="lectures/lecture09.html">Lecture 9</a>
        <a class="home-button" href="lectures/lecture10.html">Lecture 10</a>
      </div>
    </div>

  </div>

  <!-- Starfield Script -->
  <script src="assets/stars.js"></script>

  <!-- Collapsible Menu Script -->
  <script>
    const toggle = document.querySelector(".collapse-toggle");
    const content = document.querySelector(".collapse-content");

    toggle.addEventListener("click", () => {
      content.classList.toggle("open");
      toggle.textContent = content.classList.contains("open")
        ? "Lectures ▲"
        : "Lectures ▼";
    });
  </script>

</body>
</html>
