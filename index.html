<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: transparent;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

#starfield {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}

/* NAV */
.glass-nav {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
  background: rgba(10, 15, 25, 0.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.12);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 8px 30px rgba(0,0,0,0.35);
}

.nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0.7rem 1.5rem;
  display: flex;
}

.nav-item {
  flex: 1;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.75);

  padding: 0.6rem 0;
  cursor: pointer;
}

/* Divider */
.nav-item:not(:last-child)::after {
  content: "";
  position: absolute;
  right: 0;
  top: 25%;
  height: 50%;
  width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15), transparent);
}

/* Glow */
.nav-item::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: radial-gradient(circle, rgba(125,211,252,0.18), transparent 70%);
  opacity: 0;
  transform: scale(0.85);
  transition: 0.25s;
}

.nav-item:hover::before {
  opacity: 1;
  transform: scale(1);
}

.nav-item:hover {
  color: white;
}

/* Label */
.nav-label {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Underline */
.nav-label::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 50%;
  width: 0%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #7dd3fc, transparent);
  transform: translateX(-50%);
  transition: 0.25s;
  opacity: 0;
}

.nav-item:hover .nav-label::after {
  width: 60%;
  opacity: 1;
}

/* Dropdown */
.dropdown-panel {
  position: absolute;
  top: 100%;
  min-width: 220px;
  background: rgba(15,15,30,0.95);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 14px;
  display: none;
}

.dropdown:hover .dropdown-panel {
  display: block;
}

.dropdown-panel a {
  display: block;
  padding: 0.7rem 1rem;
  font-size: 0.7rem;
  text-decoration: none;
  color: rgba(255,255,255,0.85);
}

.dropdown-panel a:hover {
  background: rgba(255,255,255,0.08);
  color: white;
}

/* Content */
.home-container {
  position: relative;
  z-index: 1;
  padding-top: 7rem;
  text-align: center;
}
</style>
